[pytest]
testpaths = tests backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    unit_pure: Pure Python unit tests that require no DB, broker, or network
    db_invariant: Real local Postgres tests for RLS/GUC/triggers/constraints
    integration_db_direct: Integration tests against local direct Postgres
    integration_db_pooler: Integration tests against local transaction-pooler Postgres
    governance: Static governance and topology validation tests
    integration: Integration tests
    e2e: End-to-end tests
    ingestion: Ingestion service tests
    webhook: Webhook endpoint tests
    slow: Slow-running tests
    serial: Run tests serially
    celery_eager: Celery task logic tests with eager/in-process execution only
    celery_worker: Real Celery worker and broker topology tests
    append_only_sensitive: Tests that touch append-only protected truth tables
    rls_guc_sensitive: Tests that prove RLS/GUC tenant authority
    fail_visible_tenant_context: Tests that prove missing tenant context fails visibly
    b23_representative: Local representative B2.3 proof subset
    b24_persistence_readiness: B2.4 persistence substrate audit/blocker tests
    requires_external_db: External DB smoke tests; opt-in only with SKELDIR_ALLOW_EXTERNAL_DB_TESTS=true
asyncio_mode = auto
log_cli = true
log_cli_level = INFO

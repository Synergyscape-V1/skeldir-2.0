$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.skeldir.local/trust-api/projection-profiles.v1.yaml
title: B2.5-P14 Downstream Projection Profile Registry

# ---------------------------------------------------------------------------
# What this file is
# ---------------------------------------------------------------------------
#
# P14 is the boundary between Skeldir's independently verifiable TrustEnvelope
# and every downstream system that explains, simulates or proposes from it. The
# governing law is:
#
#     DOWNSTREAM AUTHORITY MUST NEVER EXCEED SOURCE AUTHORITY
#     A(y) <= A(x)   for a projection y of source authority x
#
# A projection profile is the machine-readable answer to two separate
# questions, which P14 requires to stay separate:
#
#   1. TRUTH CORRESPONDENCE. If a truth-bearing field is projected at all, its
#      meaning must correspond exactly to its authoritative source. Not every
#      source field must appear downstream; a field that does appear may not be
#      mutated. This registry answers it by naming an explicit allowlist --
#      `fields` -- and nothing outside it may be projected.
#
#   2. AUTHORITY MONOTONICITY. A projected value occupies a *position* in the
#      consumer: instruction, tool context, policy, authority, evidence or
#      display. A value may only occupy a position whose authority is <= the
#      authority its source class carries. This registry answers it by naming a
#      `position` per field and a total order over positions.
#
# The two are different invariants. A faithful copy of `verified_revenue_minor`
# placed in an instruction position is truth-correspondent and still unlawful.
#
# ---------------------------------------------------------------------------
# Why a file and not code
# ---------------------------------------------------------------------------
#
# The identity of a profile has to be reconstructable by an auditor who holds
# only a downstream artifact. `app/trust/projection_profiles.py` computes a
# content-addressed `profile_hash` over the canonical form of each profile
# below, so a persisted explanation or simulation names the exact bytes of the
# contract it was produced under. Editing a profile changes its hash; a stored
# artifact then no longer claims to have been produced under the edited rule.
#
# Unknown profile ids, unknown field paths, unknown trust classes, unknown
# positions and missing matrix cells are errors, not safe defaults.

registry_version: b25-p14-projection-profiles-v1

# The authority partial order used for `position`. Index 0 is weakest.
# `A(position_a) <= A(position_b)` iff index(a) <= index(b).
position_authority_order:
- display_only          # rendered to a human; carries no machine authority
- evidence              # a machine-readable fact the consumer may reason over
- policy                # constrains what the consumer may do
- tool_context          # reaches a tool/function boundary
- instruction           # reaches the consumer's instruction channel
- execution             # causes an external side effect. No P14 profile may use it.

# The B2.5-P3 text trust classes, and the strongest position each may occupy.
# `untrusted_display_label` and `quarantined_text_hash` are provider-controlled:
# a signature over them authenticates that Skeldir received those bytes, never
# that the bytes are true or safe to obey. P14-G2 is this table's first row.
text_trust_class_max_position:
  machine_authority_enum: policy
  machine_authority_code: policy
  safe_system_enum: evidence
  opaque_reference: evidence
  untrusted_display_label: display_only
  quarantined_text_hash: display_only
  redacted_text: display_only
  operator_controlled_safe_label: display_only
  provider_controlled_quarantined: display_only
  none: display_only

profiles:

# ---------------------------------------------------------------------------
# P14-G2. The default projection for any LLM explanation surface.
# ---------------------------------------------------------------------------
- profile_id: llm_explanation_projection_safe
  profile_version: v1
  status: supported
  purpose: >-
    The only projection an LLM explanation surface may consume. It carries the
    deterministic facts an explanation must stay faithful to, and it carries
    them as evidence -- never as instruction or tool context. Provider-
    controlled display strings are excluded outright, so no signed untrusted
    label can become model instruction merely because it travelled inside a
    TrustEnvelope.
  untrusted_labels_admitted: false
  policy_authority_projection: typed
  judge_authority: none
  max_action_authority: read_only
  llm_authority_over_projected_values: none
  fields:
  - path: envelope_id
    position: evidence
    trust_class: machine_authority_code

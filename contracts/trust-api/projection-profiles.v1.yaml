# ---------------------------------------------------------------------------
# The B2.8 solver's only lawful input surface.
# ---------------------------------------------------------------------------
- profile_id: optimization_projection_safe
  profile_version: v1
  status: supported
  purpose: >-
    The deterministic simulation input surface. Money crosses this boundary in
    integer minor units only; nothing provider-controlled crosses it at all,
    because a solver has no display surface and therefore no lawful use for a
    display label. `policy_action_authority.policy_state` is projected as
    policy, not as evidence, because it is what bounds the action authority any
    resulting proposal may carry.
  untrusted_labels_admitted: false
  policy_authority_projection: typed
  judge_authority: none
  max_action_authority: simulation_only
  llm_authority_over_projected_values: none
  fields:

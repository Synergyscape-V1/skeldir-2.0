# ---------------------------------------------------------------------------
# The one profile where a provider-controlled label is lawful -- and only ever
# in a display position.
# ---------------------------------------------------------------------------
- profile_id: display_projection_untrusted_labels_allowed
  profile_version: v1
  status: supported
  purpose: >-
    The controlled human-presentation profile. It is the only profile that
    admits provider-controlled display strings, and the position table pins
    them to `display_only`, so admitting a label is not the same as trusting
    it. No machine consumer may select this profile: the loader records
    `machine_consumption_permitted: false` and the P14 contract floor asserts
    it.
  untrusted_labels_admitted: true
  machine_consumption_permitted: false
  policy_authority_projection: typed
  judge_authority: none
  max_action_authority: read_only
  llm_authority_over_projected_values: none
  fields:
  - path: envelope_id
    position: evidence
    trust_class: machine_authority_code
  - path: tenant_id_hash
    position: evidence
    trust_class: machine_authority_code
  - path: subject_type
    position: evidence
    trust_class: machine_authority_enum
  - path: truth_type
    position: evidence
    trust_class: machine_authority_enum
  - path: deterministic_verification_status
    position: evidence
    trust_class: machine_authority_enum
  - path: verified_revenue_minor
    position: evidence
    trust_class: machine_authority_code
  - path: currency
    position: evidence
    trust_class: machine_authority_enum
  - path: causal_status
    position: evidence
    trust_class: machine_authority_enum
  - path: confidence_metadata.confidence_status
    position: evidence
    trust_class: machine_authority_enum
  - path: fallback_applied
    position: evidence
    trust_class: machine_authority_enum
  - path: policy_action_authority.policy_state
    position: policy
    trust_class: machine_authority_enum
  - path: semantic_truth_hash
    position: evidence
    trust_class: machine_authority_code
  - path: untrusted_display_data.text_trust_class
    position: evidence
    trust_class: machine_authority_enum
  - path: untrusted_display_data.display_transform
    position: evidence
    trust_class: machine_authority_enum
  - path: untrusted_display_data.display_text
    position: display_only
    trust_class: untrusted_display_label

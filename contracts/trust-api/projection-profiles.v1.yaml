# ---------------------------------------------------------------------------
# The internal audit projection. Widest field set, weakest consumer authority.
# ---------------------------------------------------------------------------
- profile_id: audit_projection_internal
  profile_version: v1
  status: supported
  purpose: >-
    Reconstruction surface for an internal auditor holding a downstream
    artifact identity. It admits the quarantined provider text *as evidence of
    what was received*, which is exactly the thing an audit must be able to
    see, and it carries no policy or instruction position at all -- an auditor
    reads, and reading is not an action authority.
  untrusted_labels_admitted: true
  policy_authority_projection: typed
  judge_authority: none

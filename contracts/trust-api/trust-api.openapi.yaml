openapi: 3.1.0
info:
  title: Skeldir Trust API Contract Authority
  version: 1.0.0
  description: >
    B2.5 contract authority for the P10 TrustEnvelope read, bounded-query,
    authenticated-verification, and public JWKS surfaces. It does not authorize
    mutation, compute dispatch, LLM behavior, MCP behavior, or autonomous action.
servers:
  - url: https://api.skeldir.example
paths:
  /api/trust/v1/envelopes/{subject_type}/{subject_ref}:
    get:
      operationId: getTrustEnvelope
      summary: Read one signed TrustEnvelope
      security:
        - MachineBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TrustNonce"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: subject_type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SubjectType"
        - name: subject_ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema-bound TrustEnvelope.
          content:
            application/json:
              schema:
                $ref: "trust-envelope.v1.yaml"
        "400":
          $ref: "#/components/responses/TrustError"
        "403":
          $ref: "#/components/responses/TrustError"
  /api/trust/v1/envelopes/query:
    post:
      operationId: queryTrustEnvelopes
      summary: Bounded exact-match query for signed TrustEnvelopes
      security:
        - MachineBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TrustNonce"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - subject_types
                - subject_refs
              properties:
                subject_types:
                  type: array
                  minItems: 1
                  maxItems: 5
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/SubjectType"
                subject_refs:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
                created_at_after:
                  type: string
                  format: date-time
                created_at_before:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Query results.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - envelopes
                properties:
                  envelopes:
                    type: array
                    items:
                      $ref: "trust-envelope.v1.yaml"
        "400":
          $ref: "#/components/responses/TrustError"
        "403":
          $ref: "#/components/responses/TrustError"
  /api/trust/v1/keys/jwks:
    get:
      operationId: getTrustJwks
      summary: Public verification key surface
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Future JWKS response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
        "403":
          $ref: "#/components/responses/TrustError"
  /api/trust/v1/verify:
    post:
      operationId: verifyTrustEnvelope
      summary: Authenticated verification of a supplied TrustEnvelope
      security:
        - MachineBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TrustNonce"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "trust-envelope.v1.yaml"
      responses:
        "200":
          description: Future verification result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - verification_status
                  - reason_code
                  - schema_version
                  - canonicalization_version
                  - signing_key_id
                  - signing_algorithm
                  - signature_hash
                  - semantic_truth_hash
                properties:
                  verification_status:
                    type: string
                    enum:
                      - verified
                      - rejected
                  reason_code:
                    type:
                      - string
                      - "null"
                  schema_version:
                    type:
                      - string
                      - "null"
                  canonicalization_version:
                    type:
                      - string
                      - "null"
                  signing_key_id:
                    type:
                      - string
                      - "null"
                  signing_algorithm:
                    type:
                      - string
                      - "null"
                  signature_hash:
                    type:
                      - string
                      - "null"
                  semantic_truth_hash:
                    type:
                      - string
                      - "null"
        "400":
          $ref: "#/components/responses/TrustError"
components:
  securitySchemes:
    MachineBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-machine-token
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TrustNonce:
      name: X-Trust-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    TrustError:
      description: Typed Trust API refusal or validation error.
      content:
        application/json:
          schema:
            $ref: "error-envelope.schema.json"
  schemas:
    SubjectType:
      type: string
      enum:
        - revenue_claim
        - match_verdict
        - attribution_result
        - reconciliation_discrepancy
        - confidence_projection

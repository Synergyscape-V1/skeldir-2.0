openapi: 3.1.0
info:
  title: Skeldir Trust API Contract Authority
  version: 1.2.0
  description: >
    B2.5 contract authority for the P10 TrustEnvelope read, bounded-query,
    authenticated-verification, and public JWKS surfaces. It does not authorize
    mutation, compute dispatch, LLM behavior, MCP behavior, or autonomous action.
servers:
  - url: https://api.skeldir.example
paths:
  /api/trust/v1/envelopes/{subject_type}/{subject_ref}:
    get:
      operationId: getTrustEnvelope
      summary: Read one signed TrustEnvelope
      security:
        - MachineBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TrustNonce"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: subject_type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SubjectType"
        - name: subject_ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema-bound TrustEnvelope.
          content:
            application/json:
              schema:
                $ref: "trust-envelope.v1.yaml"
                x-max-serialized-bytes: 65536
        "400":
          $ref: "#/components/responses/TrustError"
        "403":
          $ref: "#/components/responses/TrustError"
        "413":
          $ref: "#/components/responses/TrustApiError"
        "422":
          $ref: "#/components/responses/TrustApiError"
        "503":
          $ref: "#/components/responses/TrustApiError"
  /api/trust/v1/envelopes/query:
    post:
      operationId: queryTrustEnvelopes
      summary: Bounded exact-match query for signed TrustEnvelopes
      description: >
        Exact-reference selection only. The normalized subject-type/reference
        expansion may not exceed 50. Temporal predicates are inclusive and use
        the persisted b23_match_verdicts.updated_at subject chronology; they do
        not use envelope issuance or request time. OFFSET and caller-controlled
        page size are not supported. At most two accepted references are
        evaluated per page. The opaque continuation advances over the immutable
        caller-declared reference sequence, including nonmatching references,
        until page.complete is true and remaining_count is zero.
      x-max-request-body-bytes: 65536
      x-max-expanded-lookup-pairs: 50
      x-max-evaluated-references-per-page: 2
      x-max-returned-envelopes: 2
      x-max-concurrent-query-executions-per-worker: 2
      x-max-aggregate-response-bytes: 4194304
      security:
        - MachineBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TrustNonce"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - subject_types
                - subject_refs
              properties:
                subject_types:
                  type: array
                  minItems: 1
                  maxItems: 5
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/SubjectType"
                subject_refs:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
                created_at_after:
                  type: string
                  format: date-time
                  description: Inclusive persisted subject updated_at lower bound.
                created_at_before:
                  type: string
                  format: date-time
                  description: Inclusive persisted subject updated_at upper bound.
                continuation_token:
                  type:
                    - string
                    - "null"
                  minLength: 1
                  maxLength: 2048
                  description: >
                    Opaque, expiring, tenant/request/predicate-bound token from
                    the immediately preceding page. It never changes admission
                    or caller-controlled page size.
      responses:
        "200":
          description: Query results.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - envelopes
                  - page
                  - continuation_token
                properties:
                  envelopes:
                    type: array
                    maxItems: 2
                    items:
                      $ref: "trust-envelope.v1.yaml"
                    x-max-serialized-item-bytes: 65536
                  page:
                    type: object
                    additionalProperties: false
                    required:
                      - accepted_count
                      - evaluated_count
                      - page_evaluated_count
                      - remaining_count
                      - complete
                    properties:
                      accepted_count:
                        type: integer
                        minimum: 1
                        maximum: 50
                      evaluated_count:
                        type: integer
                        minimum: 1
                        maximum: 50
                        description: Cumulative accepted references evaluated.
                      page_evaluated_count:
                        type: integer
                        minimum: 1
                        maximum: 2
                      remaining_count:
                        type: integer
                        minimum: 0
                        maximum: 50
                      complete:
                        type: boolean
                  continuation_token:
                    type:
                      - string
                      - "null"
                    maxLength: 2048
                    description: >
                      Required on nonterminal pages and null only when complete.
        "400":
          $ref: "#/components/responses/TrustError"
        "403":
          $ref: "#/components/responses/TrustError"
        "413":
          $ref: "#/components/responses/TrustApiError"
        "415":
          $ref: "#/components/responses/TrustApiError"
        "422":
          $ref: "#/components/responses/TrustApiError"
        "503":
          $ref: "#/components/responses/TrustApiError"
  /api/trust/v1/keys/jwks:
    get:
      operationId: getTrustJwks
      summary: Public verification key surface
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Future JWKS response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
        "403":
          $ref: "#/components/responses/TrustError"
  /api/trust/v1/verify:
    post:
      operationId: verifyTrustEnvelope
      summary: Authenticated verification of a supplied TrustEnvelope
      x-max-request-body-bytes: 262144
      security:
        - MachineBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TrustNonce"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "trust-envelope.v1.yaml"
      responses:
        "200":
          description: Future verification result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - verification_status
                  - reason_code
                  - schema_version
                  - canonicalization_version
                  - signing_key_id
                  - signing_algorithm
                  - signature_hash
                  - semantic_truth_hash
                properties:
                  verification_status:
                    type: string
                    enum:
                      - verified
                      - rejected
                  reason_code:
                    type:
                      - string
                      - "null"
                  schema_version:
                    type:
                      - string
                      - "null"
                  canonicalization_version:
                    type:
                      - string
                      - "null"
                  signing_key_id:
                    type:
                      - string
                      - "null"
                  signing_algorithm:
                    type:
                      - string
                      - "null"
                  signature_hash:
                    type:
                      - string
                      - "null"
                  semantic_truth_hash:
                    type:
                      - string
                      - "null"
        "400":
          $ref: "#/components/responses/TrustError"
        "413":
          $ref: "#/components/responses/TrustApiError"
        "415":
          $ref: "#/components/responses/TrustApiError"
        "422":
          $ref: "#/components/responses/TrustApiError"
        "503":
          $ref: "#/components/responses/TrustApiError"
components:
  securitySchemes:
    MachineBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-machine-token
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    TrustNonce:
      name: X-Trust-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    TrustError:
      description: Typed Trust API refusal or validation error.
      content:
        application/json:
          schema:
            $ref: "error-envelope.schema.json"
    TrustApiError:
      description: Sanitized typed Trust API refusal or availability result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrustApiError"
  schemas:
    SubjectType:
      type: string
      description: >
        match_verdict is supported. The other values are reserved taxonomy and
        deterministically return unsupported_subject_type; they never collapse
        into subject_not_found.
      enum:
        - revenue_claim
        - match_verdict
        - attribution_result
        - reconciliation_discrepancy
        - confidence_projection
      x-skeldir-supported-values:
        - match_verdict
      x-skeldir-reserved-values:
        - revenue_claim
        - attribution_result
        - reconciliation_discrepancy
        - confidence_projection
    TrustApiError:
      type: object
      additionalProperties: false
      required:
        - status
        - reason_code
      properties:
        status:
          type: string
          enum:
            - refused
            - unavailable
        reason_code:
          type: string
          enum:
            - unsupported_subject_type
            - response_budget_exceeded
            - tenant_context_unavailable
            - request_body_too_large
            - unsupported_content_encoding
            - invalid_content_length
            - continuation_invalid
            - continuation_expired

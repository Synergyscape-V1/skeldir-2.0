$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.skeldir.local/trust-api/export-artifact.v1.yaml
title: B2.5-P11 Signed Match-Verdict Export Artifact (historical protocol v1, verification-only)
description: >-
  VERIFICATION-ONLY. Protocol v1 is the original export-artifact framing, in
  which signing_key_id and signing_algorithm participate in the artifact hash.

  Production no longer issues v1. This schema is retained so artifacts signed
  under the original markers keep exactly one interpretation and remain
  verifiable, and it must NOT be published as a successful issuance response.
  The active issuance response schema is export-artifact.v2.yaml.

  Authoritative version->algorithm mapping lives in
  export_artifact_protocol_registry in hash-domain-manifest.v1.yaml.
x-skeldir-protocol-lifecycle: verification_only
type: object
additionalProperties: false
required:
  - artifact_schema_version
  - canonicalization_version
  - artifact_signing_domain
  - envelopes
  - artifact_hash
  - signature_hash
  - signature
  - signing_key_id
  - signing_algorithm
  - generated_at
  - tenant_id_hash
properties:
  artifact_schema_version:
    type: string
    const: b25-p11-export-artifact-v1
  canonicalization_version:
    type: string
    const: b25-p11-artifact-framing-v1
  artifact_signing_domain:
    type: string
    const: "skeldir:b25-p11:export-artifact:v1\\0"
  envelopes:
    type: array
    minItems: 1
    maxItems: 2
    items:
      $ref: trust-envelope.v1.yaml
  artifact_hash:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  signature_hash:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
    description: SHA-256 identity of the canonical domain-separated bytes covered by the artifact signature; never an alias of artifact_hash or a hash of signature text.
  signature:
    type: string
    pattern: ^ed25519:[A-Za-z0-9_-]+$
    minLength: 16
    maxLength: 2048
  signing_key_id:
    type: string
    pattern: ^kid:[A-Za-z0-9._:-]{8,128}$
  signing_algorithm:
    type: string
    const: ed25519
  generated_at:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  tenant_id_hash:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$

openapi: 3.1.0
info:
  title: Skeldir Export API
  version: 2.1.0
  description: B2.5-P11 non-authoritative display exports; raw tenant_id values are forbidden.
servers:
  - url: https://api.skeldir.com
    description: Production server
  - url: http://localhost:4013
    description: Prism mock server for frontend development
paths:
  /api/export/revenue:
    get:
      operationId: exportRevenue
      tags:
        - Export
      summary: Export revenue data
      description: Export bounded display-only revenue projections in CSV, JSON, or XLSX format
      security:
        - BearerAuth: []
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Distributed tracing correlation ID
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - csv
              - json
              - xlsx
            default: json
          description: Export format
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date for revenue data (ISO 8601 format)
          example: "2025-01-01"
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date for revenue data (ISO 8601 format)
          example: "2025-11-10"
      responses:
        '200':
          description: Revenue data exported successfully
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDisplayProjection'
              examples:
                json_export:
                  summary: JSON export
                  value:
                    projection_authority: non_authoritative_display
                    projection_schema_version: b25-p11-display-v1
                    tenant_id_hash: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                    generated_at: "2026-08-08T12:00:00Z"
                    date_range: {start: "2026-08-01", end: "2026-08-08"}
                    rows: []
            text/csv:
              schema:
                type: string
                description: Header-first rectangular b25-p11-export-csv-v2; every data row carries projection_authority=non_authoritative_display and no metadata preamble is permitted.
              examples:
                csv_export:
                  summary: CSV export
                  value: "projection_authority,projection_schema_version,date,channel,revenue,conversions,confidence\r\nnon_authoritative_display,b25-p11-export-csv-v2,2025-01-01,google_search,1000.50,1,0.90\r\n"
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '../../../_common/v1/components.yaml#/components/responses/Unauthorized'
        '429':
          $ref: '../../../_common/v1/components.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../../../_common/v1/components.yaml#/components/responses/InternalServerError'
components:
  schemas:
    ExportDisplayProjection:
      type: object
      additionalProperties: false
      required: [projection_authority, projection_schema_version, tenant_id_hash, generated_at, date_range, rows]
      properties:
        projection_authority: {type: string, const: non_authoritative_display}
        projection_schema_version: {type: string, const: b25-p11-display-v1}
        tenant_id_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Hashed tenant scope; raw tenant_id is prohibited.
        generated_at: {type: string, format: date-time}
        date_range:
          type: object
          additionalProperties: false
          required: [start, end]
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ExportDisplayRow'
    ExportDisplayRow:
      type: object
      additionalProperties: false
      required: [date, channel, revenue_minor, revenue_display, conversions, confidence_display]
      properties:
        date: {type: string, format: date}
        channel: {type: string}
        revenue_minor: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
        revenue_display: {type: string}
        conversions: {type: integer, minimum: 0}
        confidence_display: {type: string}
  securitySchemes:
    BearerAuth:
      $ref: '../../../_common/v1/components.yaml#/components/securitySchemes/BearerAuth'

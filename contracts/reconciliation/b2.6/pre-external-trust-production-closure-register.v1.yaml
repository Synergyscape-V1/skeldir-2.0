# PRE-EXTERNAL-TRUST / PRODUCTION-CLOSURE REGISTER (B2.6-P2 Corrective XI, §15)
#
# These obligations are real engineering debt. They are NOT P2-core
# blockers and do NOT gate P2 completion or P3 authorization, but they
# must not silently disappear. Each activates no later than the earliest
# of its triggers. The trigger is change in TRUST RELIANCE or MERGE
# AUTHORITY -- never an arbitrary active-user count.
version: 1
owner: B2.6-P2 Corrective XI
activation_policy: earliest_trigger_wins
triggers:
  - first third party materially relying on a signed TrustEnvelope
  - public launch
  - first enterprise or regulatory audit requiring structural independence
  - first independent engineer, service, or bot with merge authority not
    personally reviewed by the operator
  - B2.6-P10 production-equivalent closure if none occurs earlier
obligations:
  - id: external-verifier-independence
    obligation: >
      Absolute verifier independence / external verifier authority. Every
      load-bearing verifier that judges a candidate must execute from
      protected prior-main bytes or an immutable external artifact; no
      merge decision may rest solely on candidate-tree bytes.
    activation: >
      Before the first external deterministic TrustEnvelope reliance OR
      delegated merge authority OR public launch OR B2.6-P10, whichever
      occurs first.
  - id: verifier-first-organizational-separation
    obligation: >
      Full verifier-first organizational separation: behavior changes and
      the verifiers that approve them cannot land in one unprotected
      trust action.
    activation: >
      Before the first external deterministic TrustEnvelope reliance OR
      delegated merge authority OR public launch OR B2.6-P10, whichever
      occurs first.
  - id: tested-image-production-promotion
    obligation: >
      Exact tested application-image to production-runtime digest
      promotion: the digest CI proves must be the digest production
      mechanically selects (registry, promotion consumer, pinned base).
    activation: before production or external alpha.
  - id: automatic-p2-health-consumer
    obligation: >
      Automatic production control-plane consumption of P2 health: a
      deployed actor must observe scheduler/evaluator vitality and react.
    activation: before production or external alpha.
  - id: monitor-of-monitor
    obligation: >
      Monitor-of-monitor: failure of the health consumer itself must be
      observed by a deployed actor.
    activation: before production or external alpha.
  - id: cryptographic-ci-governance
    obligation: >
      Mature cross-organizational / cryptographic CI governance
      (external signature plane over evidence capsules, path-protected
      verifier and workflow bytes).
    activation: >
      Before the first external deterministic TrustEnvelope reliance OR
      delegated merge authority OR public launch OR B2.6-P10, whichever
      occurs first.
temporary_compensating_governance:
  description: >
    Until full verifier independence activates, a minimal enforced
    operator-review boundary applies (see .github/CODEOWNERS): any PR
    changing canonical P2 SQL semantics, P2 temporal/version logic, scope
    policy semantics, P2 migrations, P2 authority grants/roles, B2.6
    validators/oracles, or B2.6 CI workflow logic requires explicit
    human/operator approval before merge. This control is temporary
    governance, not evidence of structural independence.
  enforced_by: .github/CODEOWNERS

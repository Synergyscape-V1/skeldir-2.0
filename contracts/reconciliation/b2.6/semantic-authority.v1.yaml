phase_id: B2.6-P1
contract_version: b2.6-p1-semantic-authority-v5
maturity_mode: DESIGN_PARTNER_MODE
authority_kind: semantic_constitution_not_financial_result

# Version-identity record (Corrective V): this constitution replaces the
# Corrective-IV scope-coherence seam with executable consumer authority.
# Canonical truth is available only through the governed sink framework,
# which owns its database capability, enforces transaction-bound tenant
# unity, re-derives sovereign B2.3 state on every execution, and
# materializes authoritative fields itself after projection callbacks
# return. No caller-supplied observation can become canonical; mathematics
# is re-derived from integer legs under a pinned Decimal context, and
# diagnostic/external output carries only the one-way tenant hash. Two
# semantically different constitutions MUST NOT share a human-readable
# version; identity is (contract_path, contract_version, source_sha256).
# Historical v1/v2/v3/v4 proof artifacts remain distinguishable by version
# AND hash.
supersession:
  supersedes: b2.6-p1-semantic-authority-v4
  reason: executable_canonical_consumer_with_tenant_unity_and_framework_owned_final_fields

migration_authority:
  schema_change_required_in_P1: false
  expected_single_head: "202609072001"
  p1_closure_head: "202609072001"
  ancestry_law: descendant_of_p1_closure_head_required
  revision_graph_source: alembic_native_ScriptDirectory
  rationale: >-
    P1 declares semantic and adjudicative authority only. Existing B2.3
    production relations already provide the sovereign inputs, while legacy
    reconciliation relations remain fenced false authorities.
    expected_single_head records the historical P1 closure coordinate and is
    NOT a permanent future law. The permanent law is ancestry_law: every
    current migration head must descend from p1_closure_head with P1 semantic
    values intact.

coverage_authority:
  aggregate_callable: app.revenue_verification.verification_coverage.fetch_verification_coverage_aggregate
  metric_object: app.revenue_verification.verification_coverage.VERIFICATION_COVERAGE
  metric_method: compute
  implementation_ast_sha256: c97ce3814f9b28635494cd89dd31b988decce50e95c5ce020b2ba2cf6d103217
  supported_provider_scope_reference: app.revenue_verification.verification_coverage.SUPPORTED_VERIFICATION_COVERAGE_PLATFORMS
  supported_currency_scope_reference: app.revenue_verification.verification_coverage.SUPPORTED_VERIFICATION_COVERAGE_CURRENCIES
  numerator:
    name: matched_webhook_revenue_minor
    definition: >-
      Sum canonical_net_verified_amount_minor from tenant-bound B2.3 verdicts in
      matched_provisional, matched_confirmed, or adjusted state, joined by the
      durable webhook_ingress_identity_id to authenticity-verified ingress in
      the same supported-provider, currency, and half-open event window.
  denominator:
    name: connected_platform_revenue_minor
    definition: >-
      Sum verified_amount_minor from tenant-bound, authenticity-verified ingress
      for connected supported providers in the same currency and half-open
      event_timestamp window, whether or not a matching verdict is final.
  window_semantics:
    interval: half_open
    lower_bound: inclusive
    upper_bound: exclusive
    clock_source: persisted_webhook_ingress_identities.event_timestamp
    timezone: UTC
  unsupported_rail_doctrine:
    numerator: excluded
    denominator: excluded
    later_finance_representation: deferred_to_B2.6-P2_or_later
  golden_falsification_vector:
    matched_minor: 76000
    connected_supported_minor: 80000
    total_business_minor: 100000
    required_percent: "95.00"
    forbidden_percent: "76.00"
  # Scope-only sovereign authority seam (Corrective V): canonical coverage is
  # whatever the governed sink framework re-derives from the sovereign B2.3
  # source for a server-derived scope in the same execution, through its own
  # governed database capability, with transaction-bound tenant unity proven
  # before aggregation. There is no transferable token:
  # admit_canonical_verification_coverage always refuses caller-supplied
  # observations (fail-closed), mathematics is re-derived from integer legs
  # through an independent oracle under a pinned Decimal context, and
  # diagnostic/external output carries only the one-way tenant hash. Numeric
  # coincidence with the golden vector never confers authority.
  canonical_admission_seam:
    module: app.finance_reconciliation.coverage_authority
    sealed_type: app.finance_reconciliation.coverage_authority.CanonicalVerificationCoverage
    loader: app.finance_reconciliation.coverage_authority.load_canonical_verification_coverage
    admitter: app.finance_reconciliation.coverage_authority.admit_canonical_verification_coverage
    scope_verifier: app.finance_reconciliation.coverage_authority.require_canonical_scope
    sovereign_producer: app.revenue_verification.verification_coverage.fetch_verification_coverage_aggregate+app.revenue_verification.verification_coverage.VERIFICATION_COVERAGE.compute
    law: only_sovereign_rederivation_may_be_canonical
    provenance_model: scope_only_sovereign_rederivation_no_transferable_token
    resolver: app.finance_reconciliation.coverage_authority.resolve_canonical_coverage
    admitter_behavior: always_refuses_caller_observation_fail_closed
    mathematics: independently_rederived_from_integer_minor_legs
    diagnostic_tenant: one_way_hash_only_raw_uuid_never_emitted
    tenant_authority_mode: transaction_bound_db_tenant_equals_scope_tenant
    database_capability_mode: framework_owned_governed_session_factory_only
    sink_framework: app.finance_reconciliation.canonical_sink.execute_governed_sink
    final_field_owner: canonical_sink_framework_post_callback_materialization
    provenance_law: re_derive_on_read_at_every_canonical_boundary

truth_status:
  coverage_is_not_final_finance_confirmation: true
  matched_provisional:
    participates_in_coverage_numerator: true
    finance_truth_status: provisional
    may_be_relabelled_confirmed: false
  matched_confirmed:
    participates_in_coverage_numerator: true
    finance_truth_status: confirmed
  adjusted:
    participates_in_coverage_numerator: true
    finance_truth_status: confirmed_adjusted
  future_consumer_requirement: >-
    Expose provisional and confirmed amounts/statuses separately and never infer
    final finance confirmation from coverage_percent alone.

required_reconciliation_reasons: []
# Superseded collapsed category (B2.6-P1 Corrective II): the nine legacy labels
# below are preserved ONLY as separated ontologies. truth_state_vocabulary holds
# truth states, scope_dispositions holds scope/exclusion/availability outcomes,
# and finance_discrepancy_reasons holds the versioned finance discrepancy
# obligation. The collapsed list above MUST remain empty so no consumer can
# mistake it for discrepancy authority.
legacy_collapsed_reason_labels_superseded:
  - matched_confirmed
  - matched_provisional
  - adjusted_confirmed
  - supported_unresolved
  - unsupported_provider_excluded
  - unsupported_currency_excluded
  - outside_governed_window_excluded
  - source_identity_unresolved
  - authority_unavailable

truth_state_vocabulary:
  - matched_confirmed
  - matched_provisional
  - adjusted_confirmed

scope_dispositions:
  - supported_unresolved
  - unsupported_provider_excluded
  - unsupported_currency_excluded
  - outside_governed_window_excluded
  - source_identity_unresolved
  - authority_unavailable

finance_discrepancy_reasons:
  taxonomy_version: b2.6-discrepancy-taxonomy-v1
  required_reasons:
    - amount_mismatch_tax_shipping
    - amount_mismatch_platform_claim
    - late_webhook
    - unsupported_payment_rail
    - refund_or_chargeback_adjustment
    - missing_order_reference
    - duplicate_claim
    - privacy_limited_resolution
  # Governed additive slot (Corrective II-2): a lawful future reason MUST be
  # listed here AND carry a taxonomy minor-version bump
  # (b2.6-discrepancy-taxonomy-v1.<n>). Additions without a bump, removals of
  # baseline members, or unlisted reasons are RED.
  additional_governed_reasons: []
  evolution_policy: additive_only_with_minor_version_bump
  classifier_status: deferred_to_B2.6-P3_no_classifier_in_P1

money_authority:
  representation: integer_minor_units
  authoritative_float_or_decimal_major_units: forbidden
  display_major_units: derived_non_authoritative_only

projection_doctrine:
  finance_export:
    authority: projection_only
    recomputation: forbidden
    required_source: future_durable_B2.6_reconciliation_authority
  trust_envelope:
    authority: projection_only
    recomputation: forbidden
    required_source: future_durable_B2.6_reconciliation_authority
    fields_created_in_P1: false
  coherent_information_object_requires:
    - financial_amount
    - governed_scope
    - truth_status
    - reason_or_exclusion
    - provenance
    - tenant_authority
    - contract_version
    - trust_envelope_identity

tenant_identifier_policy:
  durable_state: tenant_scoped
  external_raw_tenant_id: forbidden
  external_identity: one_way_tenant_id_hash_or_equivalent

ontological_authority:
  deterministic_B2.3_truth: sovereign_input
  deterministic_B2.6_reconciliation: future_derived_authority
  B2.4_estimation_financial_authority: NONE
  B2.13_counterfactual_financial_authority: NONE
  LLM_financial_or_classification_authority: NONE
  B2.4_and_B2.13_usage: optional_separately_labelled_enrichment_only

authority_map:
  sovereign:
    - authenticated_commerce_identity:webhook_ingress_identities
    - deterministic_match_verdict:b23_match_verdicts
    - verification_coverage:app.revenue_verification.verification_coverage
  derived:
    - future_B2.6_reconciliation:from_B2.3_verdict_and_coverage_authority_only
  projection_only:
    - finance_export
    - TrustEnvelope_reconciliation_projection
  forbidden:
    - B2.4_confidence_as_money_or_denominator
    - B2.13_counterfactual_as_revenue_or_discrepancy
    - LLM_output_as_reconciliation_truth

legacy_false_authorities:
  - id: legacy_reconciliation_service
    python_module: app.services.revenue_reconciliation
    python_symbol: RevenueReconciliationService
  - id: legacy_revenue_ledger
    database_relation: public.revenue_ledger
  - id: legacy_reconciliation_api
    python_module: app.api.reconciliation
    route_prefix: /api/reconciliation
  - id: route_local_source_alias_arithmetic
    python_module: app.api.reconciliation
    python_symbol: _SOURCE_ALIASES
  - id: allocation_grain_export_recomputation
    python_module: app.api.export
    python_symbol: _fetch_reporting_rows

# Legacy authority quarantine (Corrective III): the fenced surfaces above
# remain mounted for contract compatibility only. They are explicitly
# non-authoritative and cannot conduct into canonical B2.6 through import,
# dynamic load, helper, database relation, or network/service invocation.
legacy_authority_quarantine:
  status: compatibility_only_non_authoritative
  mounted_for_compatibility: true
  canonical_admission: refused
  route_paths:
    - /api/reconciliation/status
    - /api/reconciliation/platform/{platform_id}
    - /api/reconciliation/sync
  modules:
    - app.services.revenue_reconciliation
    - app.api.reconciliation
    - app.api.export
  enforcement: app.finance_reconciliation.legacy_quarantine+app.finance_reconciliation.coverage_authority.admit_canonical_verification_coverage+static_capability_fences

future_insertion_seam:
  - B2.3_deterministic_verdict_and_coverage_authority
  - future_B2.6_deterministic_reconciliation_projection_boundary
  - future_finance_projection
  - future_B2.6_TrustEnvelope_projection

negative_control_registry:
  - B26-P1-NC-01-mandatory-semantic-element
  - B26-P1-NC-02-coverage-authority-reference
  - B26-P1-NC-03-legacy-false-authority-import
  - B26-P1-NC-04-ontological-authority
  - B26-P1-NC-05-workflow-execution-identity
  - B26-P1-NC-06-proof-candidate-identity
  - B26-P1-NC-07-container-contract-copy

proof_artifact_identity_requirements:
  - gate_id
  - phase
  - contract_version
  - contract_hash
  - candidate_sha
  - candidate_tree
  - migration_head
  - producer
  - workflow
  - event_type
  - run_id
  - artifact_hash
  - scenario_id
  - falsifier_id
  - status

prohibited_P1_product_machinery:
  - reconciliation_business_table
  - reconciliation_computation_kernel
  - reconciliation_API
  - reconciliation_worker_or_scheduler
  - reconciliation_outbox
  - finance_reconciliation_export
  - TrustEnvelope_reconciliation_fields

# Executable canonical-consumer authority (Corrective V): canonical status
# is available only through the governed sink framework executing a
# registered sink implementation. The framework accepts scope only, owns
# its database capability, enforces tenant unity, re-derives sovereign
# truth on every execution, and materializes authoritative fields itself.
canonical_sink_framework:
  module: app.finance_reconciliation.canonical_sink
  executor: app.finance_reconciliation.canonical_sink.execute_governed_sink
  final_output_type: app.finance_reconciliation.canonical_sink.FinalCanonicalOutput
  governed_sink_ids:
    - future_B2.6_deterministic_reconciliation_projection_boundary
    - future_finance_projection
    - future_B2.6_TrustEnvelope_projection
  provenance_mode: RE_DERIVE_ON_READ
  projection_policy: adjunct_only_authoritative_fields_framework_owned
  tenant_authority_mode: transaction_bound_db_tenant_equals_scope_tenant
  database_capability_mode: framework_owned_governed_session_factory_only
  governed_principals:
    - app_user
    - app_worker

# Successor durable-provenance constitution (Corrective V): P1 creates no
# durable canonical state, but no later phase may register canonical
# persistence without declaring one governed provenance mode and its
# required runtime proofs. Omission is refused by machine law, not prose.
successor_provenance_law:
  status: provenance_mode_required_no_persistence_in_P1
  allowed_modes:
    - RE_DERIVE_ON_READ
    - DURABLE_SOURCE_BINDING
  enforcement: app.finance_reconciliation.canonical_sink.authorize_successor_persistence+static_successor_fence

# Phase-lifetime gate for product machinery (Corrective II-2): at P1 closure
# (status none) the AST product-machinery fence is enforced. A governed later
# phase retires this closure check ONLY via an explicit recorded authorization
# in this contract (status authorized_p2_product_growth with a non-empty
# authorized_machinery record). All other permanent P1 semantic laws remain
# enforced regardless of this flag. closure_snapshot permanently records that
# no such machinery existed at P1 closure.
successor_product_authorization:
  status: none
  authorized_machinery: []


name: b057-p3-webhook-ingestion-least-privilege

on:
  pull_request:
    paths:
      - 'backend/tests/integration/test_b057_p3_webhook_ingestion_unblocking.py'
      - 'backend/app/ingestion/**'
      - 'backend/app/api/**'
      - '.github/workflows/b057-p3-webhook-ingestion-least-privilege.yml'
      - 'docs/ci/**'
      - 'contracts-internal/governance/b03_phase2_required_status_checks.main.json'
  push:
    paths:
      - 'backend/tests/integration/test_b057_p3_webhook_ingestion_unblocking.py'
      - 'backend/app/ingestion/**'
      - 'backend/app/api/**'
      - '.github/workflows/b057-p3-webhook-ingestion-least-privilege.yml'
      - 'docs/ci/**'
      - 'contracts-internal/governance/b03_phase2_required_status_checks.main.json'
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  b057_p3_webhook_ingestion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      DB_NAME: skeldir_b057_p3
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SUPERUSER: postgres
      DB_SUPERPASS: postgres

      MIGRATION_USER: migration_owner
      MIGRATION_PASS: migration_owner
      RUNTIME_USER: app_user
      RUNTIME_PASS: app_user

      DATABASE_URL: postgresql+asyncpg://app_user:app_user@127.0.0.1:5432/skeldir_b057_p3
      B057_P3_RUNTIME_DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b057_p3
      B057_P3_ADMIN_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b057_p3
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b057_p3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Provision roles and database (least-privilege runtime)
        env:
          PGPASSWORD: ${{ env.DB_SUPERPASS }}
        run: |
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "CREATE ROLE app_rw NOLOGIN;"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "CREATE ROLE app_ro NOLOGIN;"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "CREATE USER ${RUNTIME_USER} WITH PASSWORD '${RUNTIME_PASS}';"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "CREATE USER app_worker WITH PASSWORD 'app_worker';"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "CREATE USER ${MIGRATION_USER} WITH PASSWORD '${MIGRATION_PASS}';"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "GRANT app_rw TO ${RUNTIME_USER}; GRANT app_ro TO ${RUNTIME_USER};"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "GRANT ${RUNTIME_USER} TO ${MIGRATION_USER};"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "GRANT app_worker TO ${MIGRATION_USER};"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${DB_NAME} OWNER ${MIGRATION_USER};"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO ${MIGRATION_USER}; GRANT ALL ON SCHEMA public TO ${RUNTIME_USER};"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE ${DB_NAME} TO app_worker; GRANT USAGE ON SCHEMA public TO app_worker;"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Apply migrations (admin identity)
        run: |
          python -m alembic upgrade head

      - name: Enforce B0.5.7-P3 least-privilege tenant access
        env:
          PGPASSWORD: ${{ env.DB_SUPERPASS }}
        run: |
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -c "REVOKE ALL ON TABLE public.tenants FROM app_user;"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -c "REVOKE ALL ON TABLE public.tenants FROM app_ro;"
          psql -h "${DB_HOST}" -U "${DB_SUPERUSER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -c "REVOKE ALL ON TABLE public.tenants FROM app_rw;"

      - name: Assert direct tenant table access is denied for runtime identity
        env:
          PGPASSWORD: ${{ env.RUNTIME_PASS }}
        run: |
          if psql -h "${DB_HOST}" -U "${RUNTIME_USER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -c "SELECT id FROM public.tenants LIMIT 1" >/dev/null 2>&1; then
            echo "runtime identity unexpectedly has direct tenants SELECT"
            exit 1
          fi

      - name: Run B0.5.7-P3 integration test (real HTTP + real DB)
        run: |
          pytest -q backend/tests/integration/test_b057_p3_webhook_ingestion_unblocking.py

          grep -q '^B25_P13_C14_CLOSURE_VALIDATION_PASS$' /tmp/c14-closure.out
          grep -q '^c14_static_negative_controls_fired=7$' /tmp/c14-closure.out

      - name: NC-XIV-FINANCIAL false money turns governing proof red
        run: |
          set -euo pipefail
          cp backend/app/trust/semantic_authority.py /tmp/c14-authority.py
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/trust/semantic_authority.py')
          source = path.read_text(encoding='utf-8')
          old = 'if actual_bytes != expected_bytes:'
          assert source.count(old) == 1
          source = source.replace(old, 'if False and actual_bytes != expected_bytes:', 1)
          source = source.replace('if audited_payload != expected:', 'if False and audited_payload != expected:', 1)

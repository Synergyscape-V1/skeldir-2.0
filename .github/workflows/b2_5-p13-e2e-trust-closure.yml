name: B2.5-P13 E2E Trust Closure

# B2.5-P13 proves the trust chain COMPOSES through the real machine-facing route.
# Every layer below already passes its own phase gate; what this context adds is
# the composition proof -- real PostgreSQL with RLS, the actual FastAPI route,
# the production builder and signer, and public-only verification.
#
# Not path-filtered on pull_request, deliberately. A required status check that
# is path-filtered never reports on a PR outside its paths and blocks that PR
# forever waiting for a status that cannot arrive. That defect was found in P12
# and again across P8-P11 during P13-P0; this workflow is built without it.

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/app/trust/**'
      - 'backend/app/confidence_projection/**'
      - 'backend/app/bayesian/fit_execution.py'
      - 'backend/app/bayesian/fit_claim.py'
      - 'backend/app/bayesian/runtime_state.py'
      - 'backend/app/bayesian/e2e_harness.py'
      - 'backend/app/bayesian/models.py'
      - 'backend/app/bayesian/repository.py'
      - 'backend/app/bayesian/source_snapshot.py'
      - 'backend/app/api/trust_api.py'
      - 'backend/app/api/trust_keys.py'
      - 'backend/tests/trust/test_b25_p13_e2e_trust_closure.py'
      - 'alembic/versions/007_skeldir_foundation/**'
      - 'contracts/trust-api/**'
      - 'scripts/ci/validate_b25_p13_confidence_truth.py'
      - 'scripts/ci/validate_b25_p13_c4_closure.py'
      - 'scripts/ci/validate_b25_p13_c5_closure.py'
      - 'db/schema/canonical_schema.sql'
      - '.github/workflows/b2_5-p13-e2e-trust-closure.yml'
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push / merge_group: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  b25-p13-e2e-trust-closure:
    name: B2.5-P13 E2E Trust Closure
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p13_e2e
      MIGRATION_DATABASE_URL: postgresql://migration_user:migration_user@127.0.0.1:5432/skeldir_b25_p13_e2e
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      SKELDIR_B25_P13_E2E_PROOF: "1"
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      # Shared least-privilege boundary rather than a hand-rolled superuser
      # database; migrations run under the migration principal. The runtime
      # principal must NOT bypass RLS: app.trust.tenant_security refuses any
      # connection whose role has rolbypassrls, so running as the postgres
      # superuser silently disabled that control AND every RLS policy the G2
      # tenant-isolation journey depends on.
      - name: Provision least-privilege database
        uses: ./.github/actions/setup-postgres-ci
        with:
          database-name: skeldir_b25_p13_e2e

      # Asserted, not assumed: a superuser connection would make G2 pass for
      # the wrong reason, because RLS would never apply.
      - name: Assert the runtime identity cannot bypass RLS
        run: |
          set -o pipefail
          bypass=$(psql "$DATABASE_URL" -tAc "SELECT COALESCE((SELECT rolbypassrls FROM pg_roles WHERE rolname = current_user), true)")
          echo "runtime_role_bypassrls=$bypass"
          test "$bypass" = "f"

      # The composition proof. Real DB, real RLS, real route, real signer.
      - name: P13 E2E trust closure (G1-G10 composition and adversarial journeys)
        run: |
          set -o pipefail
          python -m pytest backend/tests/trust/test_b25_p13_e2e_trust_closure.py \
            -q -s --no-header | tee /tmp/b25_p13_e2e.out
          grep -E "1 passed" /tmp/b25_p13_e2e.out

          # Exact assertions, not ">= 1". A journey or tamper field that silently
          # disappears must turn this gate red rather than reduce a number nobody
          # reads. Both tamper counts are pinned, so neither a shrinking matrix nor
          # a blind field can pass.
          grep -E "^p13_missing_cases=0$" /tmp/b25_p13_e2e.out
          grep -E "^p13_executed_cases=20$" /tmp/b25_p13_e2e.out
          grep -E "^p13_tamper_fields_expected=158$" /tmp/b25_p13_e2e.out
          grep -E "^p13_tamper_fields_failed=158$" /tmp/b25_p13_e2e.out
          grep -E "^p13_load_bearing_paths=85$" /tmp/b25_p13_e2e.out
          grep -E "^p13_display_only_paths_excluded=24$" /tmp/b25_p13_e2e.out
          grep -E "^p13_downgrade_cases_failed_closed=6$" /tmp/b25_p13_e2e.out
          grep -E "^p13_negative_controls_fired=18$" /tmp/b25_p13_e2e.out
          grep -E "^p13_money_columns_integer_not_null=6$" /tmp/b25_p13_e2e.out
          grep -E "^p13_route_level_denials=2$" /tmp/b25_p13_e2e.out
          grep -E "^p13_confidence_semantic_truth_cases=10$" /tmp/b25_p13_e2e.out
          grep -E "^p13_confidence_governed_source_tables=7$" /tmp/b25_p13_e2e.out
          grep -E "^p13_confidence_physical_read_tables=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_replay_denied=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_scope_denied=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_db_invalid_available_rejected=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_db_invalid_state_mutations_rejected=5$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_authority_transaction_rollback=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_temporal_e2e=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_valid_terminalization_accepted=1$" /tmp/b25_p13_e2e.out

          # B2.5-P13 C5. Each of these is len() of a list the run appended
          # to, and p13_counter_provenance prints what was counted, so a
          # reviewer can check the number against the events behind it.
          grep -E "^p13_c5_terminal_authority_mutations_rejected=7$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_lease_reclaim_still_possible=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_terminal_bookkeeping_still_mutable=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_claim_seam_cases=6$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_future_evidence_write_rejected=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_allowed_skew_accepted=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_future_evidence_never_current=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_absolute_age_cases=2$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_classes_witnessed=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_dispositions=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_classes_quarantined=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_classes_signature_verified=3$" /tmp/b25_p13_e2e.out

      - name: P13 C3 confidence authority and semantic falsifiers
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_confidence_truth.py --negative-control \
            | tee /tmp/b25_p13_confidence_truth.out
          grep -E "^B25_P13_CONFIDENCE_TRUTH_VALIDATION_PASS$" \
            /tmp/b25_p13_confidence_truth.out
          grep -E "^confidence_truth_negative_controls_fired=12$" \
            /tmp/b25_p13_confidence_truth.out

      - name: P13 C4 state, temporal, freshness, and executable-authority closure
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_c4_closure.py --negative-control \
            | tee /tmp/b25_p13_c4_closure.out
          grep -E "^B25_P13_C4_CLOSURE_VALIDATION_PASS$" \
            /tmp/b25_p13_c4_closure.out
          grep -E "^p13_c4_negative_controls_fired=10$" \
            /tmp/b25_p13_c4_closure.out
          grep -E "^p13_c4_executable_dependency_controls=1$" \
            /tmp/b25_p13_c4_closure.out
          grep -E "^p13_c4_historical_rows_fail_closed=1$" \
            /tmp/b25_p13_c4_closure.out
      # P13 C5: lifecycle, temporal and proof-system closure. This step is
      # where a behavioural invariant guarded only by a source check is caught:
      # the control registry requires every such control to name a causal proof,
      # and the gate verifies that proof still exists.
      - name: P13 C5 lifecycle, temporal, and proof-system closure
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_c5_closure.py --negative-control \
            | tee /tmp/b25_p13_c5_closure.out
          grep -E "^B25_P13_C5_CLOSURE_VALIDATION_PASS$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_negative_controls_fired=10$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_controls_classified=33$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_behavioral_invariants=25$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_causal_controls=18$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_behavioral_backstops=9$" /tmp/b25_p13_c5_closure.out

      # P13-G11: the suite must not silently lose a journey. An expected case
      # that disappears has to fail the gate rather than reduce a count nobody
      # reads, so the manifest is asserted here as well as inside the test.
      - name: P13 expected-case manifest (non-vacuity)
        run: |
          set -o pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path(
              "backend/tests/trust/test_b25_p13_e2e_trust_closure.py"
          ).read_text(encoding="utf-8")
          block = re.search(r"EXPECTED_CASE_IDS = \((.*?)\)", source, re.S)
          assert block, "EXPECTED_CASE_IDS manifest missing"
          cases = re.findall(r'"([^"]+)"', block.group(1))
          required = {
              "P13-G1-happy-path-signed-envelope",
              "P13-G2-wrong-tenant-no-existence-leak",
              "P13-G9-public-only-verification",
              "P13-G3-tamper-matrix-all-load-bearing-fields",
              "P13-G4-degraded-confidence-no-fabricated-interval",
              "P13-G5-prompt-control-quarantined",
              "P13-G6-money-source-not-authoritative",
              "P13-G7-schema-downgrade-fails-closed",
              "P13-G8-read-only-no-compute-dispatch",
              "P13-G10-audit-provenance-composition",
              "P13-H14-replay-denied-atomically",
              "P13-H15-missing-scope-denied",
              "P13-H15R-route-level-scope-denial",
              "P13-H14R-route-level-replay-denial",
              "P13-H08-confidence-projection-closure",
              "P13-C5-01-terminal-confidence-immutable",
              "P13-C5-02-production-claim-seam-operability",
              "P13-C5-03-future-evidence-cannot-be-current",
              "P13-C5-04-absolute-age-explicitly-bounded",
              "P13-C5-05-adversarial-class-matrix",
          }
          missing = sorted(required - set(cases))
          assert not missing, f"required P13 journeys removed from manifest: {missing}"
          for case in cases:
              assert f'executed.append("{case}")' in source, (
                  f"case {case} is declared but never appended by the suite"
              )
          print(f"p13_expected_cases={len(cases)}")
          print("p13_manifest_integrity=ok")
          PY

      # NC-P13-15: a failing P13 proof must not be able to leave this workflow
      # green. Previously recorded as "structurally covered", which was an
      # assertion about this file rather than a proof of it. Now checked: every
      # counter assertion must be anchored (^...$) and pinned to a literal value.
      # A grep like "^p13_executed_cases=[0-9]*$" would match a shrinking suite,
      # so the gate would stay green while coverage fell.
      - name: NC-P13-15 counter assertions are exact and cannot drift
        run: |
          set -o pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(
              ".github/workflows/b2_5-p13-e2e-trust-closure.yml"
          ).read_text(encoding="utf-8")
          asserts = re.findall(r'grep -E "([^"]*p13_[a-z_]+[^"]*)"', workflow)
          assert asserts, "no p13 counter assertions found"
          weak = []
          for pattern in asserts:
              if not (pattern.startswith("^") and pattern.endswith("$")):
                  weak.append((pattern, "not anchored"))
                  continue
              value = pattern[1:-1].split("=", 1)[1] if "=" in pattern else ""
              if not value.isdigit():
                  weak.append((pattern, f"value {value!r} is not a literal integer"))
          assert not weak, f"counter assertions that could drift: {weak}"
          print(f"p13_counter_assertions_exact={len(asserts)}")
          PY

      # P13-G11: failure must not be maskable, and no journey may be quietly
      # skipped. pytest reports skips and xfails in its summary line; asserting
      # their absence is the difference between "the suite ran" and "the suite
      # ran everything it claims".
      - name: P13 non-vacuity (no skips, no xfail, no failure masking)
        run: |
          set -o pipefail
          if grep -qE "skipped|xfailed|xpassed|deselected" /tmp/b25_p13_e2e.out; then
            echo "P13 suite reported skipped/xfail/deselected cases:"
            grep -E "skipped|xfailed|xpassed|deselected" /tmp/b25_p13_e2e.out
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/b2_5-p13-e2e-trust-closure.yml"
          ).read_text(encoding="utf-8")
          # A gate that can swallow its own failure is decorative. The tokens are
          # ASSEMBLED rather than written literally: spelling them out here would
          # place them inside a b2_5 workflow, and B2.5-P12's Plane D scans every
          # b2_5-*.yml for exactly these strings. Writing the scanner literally
          # made P12 red -- the failure-masking detector introduced
          # failure-masking. Assembling them keeps the check honest and keeps the
          # file clean for the layer above it.
          tokens = (
              "continue-" + "on-error: true",
              "|" + "| true",
              "exit " + "0  #",
          )
          for token in tokens:
              assert token not in workflow, f"failure masking token present: {token}"
          # `set -o pipefail` is required wherever the suite is piped to tee,
          # otherwise tee's exit status hides a failing pytest.
          assert workflow.count("set -o pipefail") >= 3, "pipefail missing from a step"
          print("p13_failure_masking_tokens=0")
          print("p13_pipefail_guarded=ok")
          PY

      # P13-G12: P13 must not weaken any earlier phase. The inherited proofs are
      # re-run here with their own negative controls rather than assumed to hold
      # because some other workflow is green.
      - name: P1-P12 preservation with P13 present
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p1_contracts.py --negative-control
          python scripts/ci/validate_b25_p1_trust_drift.py --negative-control
          python scripts/ci/validate_b25_p12_trust_isolation.py --negative-control             | tee /tmp/b25_p13_p12_iso.out
          grep -E "^B25_P12_TRUST_ISOLATION_VALIDATION_PASS$" /tmp/b25_p13_p12_iso.out
          grep -E "^isolation_negative_controls_fired=4$" /tmp/b25_p13_p12_iso.out
          python scripts/ci/validate_b25_p12_ci_gates.py --negative-control             | tee /tmp/b25_p13_p12_gates.out
          grep -E "^B25_P12_CI_GATES_VALIDATION_PASS$" /tmp/b25_p13_p12_gates.out
          grep -E "^ci_gate_negative_controls_fired=7$" /tmp/b25_p13_p12_gates.out
          echo "p13_preservation_validators_passed=4"

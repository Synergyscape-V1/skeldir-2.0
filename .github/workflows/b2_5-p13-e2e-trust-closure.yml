name: B2.5-P13 E2E Trust Closure

# B2.5-P13 proves the trust chain COMPOSES through the real machine-facing route.
# Every layer below already passes its own phase gate; what this context adds is
# the composition proof -- real PostgreSQL with RLS, the actual FastAPI route,
# the production builder and signer, and public-only verification.
#
# Not path-filtered on pull_request, deliberately. A required status check that
# is path-filtered never reports on a PR outside its paths and blocks that PR
# forever waiting for a status that cannot arrive. That defect was found in P12
# and again across P8-P11 during P13-P0; this workflow is built without it.

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/app/trust/**'
      - 'backend/app/confidence_projection/**'
      - 'backend/app/bayesian/**'
      - 'backend/app/bayesian/fit_execution.py'
      - 'backend/app/bayesian/fit_claim.py'
      - 'backend/app/bayesian/runtime_state.py'
      - 'backend/app/bayesian/e2e_harness.py'
      - 'backend/app/bayesian/models.py'
      - 'backend/app/bayesian/repository.py'
      - 'backend/app/bayesian/source_snapshot.py'
      - 'backend/app/tasks/bayesian.py'
      - 'backend/app/tasks/beat_schedule.py'
      - 'backend/app/api/trust_api.py'
      - 'backend/app/api/trust_keys.py'
      - 'backend/tests/trust/test_b25_p13_e2e_trust_closure.py'
      - 'backend/tests/trust/test_b25_p13_c6_postgres_physics.py'
      - 'backend/tests/trust/test_b25_p13_c7_conservation_physics.py'
      - 'backend/tests/trust/test_b25_p13_c8_identity_window_physics.py'
      - 'backend/tests/trust/test_b25_p13_c8_transport_physics.py'
      - 'backend/tests/trust/test_b25_p13_c8_contiguous_journey.py'
      - 'backend/app/bayesian/fit_planner.py'
      - 'backend/app/bayesian/feature_cardinality.py'
      - 'backend/app/bayesian/feature_authority.py'
      - 'backend/app/bayesian/input_contract.py'
      - 'backend/tests/trust/test_b25_p13_c9_feature_cardinality_physics.py'
      - 'backend/tests/trust/test_b25_p13_c9_tenant_containment.py'
      - 'backend/tests/trust/test_b25_p13_c9_degradation_matrix.py'
      - 'backend/tests/trust/test_b25_p13_c9_authority_supersession.py'
      - 'backend/tests/trust/test_b25_p13_c9_positive_confidence.py'
      - 'backend/tests/trust/test_b25_p13_c10_policy_transport_physics.py'
      - 'backend/tests/trust/test_b25_p13_c11_semantic_authority.py'
      - 'backend/tests/trust/test_b25_p13_c12_authority_closure.py'
      - 'backend/tests/trust/test_b25_p13_c13_signing_truth_boundary.py'
      - 'backend/tests/trust/test_b25_p13_c14_semantic_authority.py'
      - 'backend/app/trust/semantic_authority.py'
      - 'backend/app/inference_policy_registry.py'
      - 'backend/app/tasks/bayesian_publisher.py'
      - 'backend/Dockerfile.bayesian'
      - 'scripts/ci/validate_b24_artifact_topology.py'
      - 'backend/app/bayesian/fit_claim.py'
      - 'backend/app/bayesian/authority_liveness.py'
      - 'backend/app/bayesian/source_snapshot.py'
      - 'backend/app/bayesian/model_identity.py'
      - 'backend/app/bayesian/source_contract_authority.py'
      - 'backend/app/bayesian/source_invalidation_contract.py'
      - 'backend/app/bayesian/source_snapshot.py'
      - 'backend/tests/test_b24_p9_postgres_runtime.py'
      - 'docs/forensics/B2.5-P13 Corrective Action Remediation VIII Report.md'
      - 'scripts/ci/validate_b25_p13_c7_closure.py'
      - 'scripts/ci/_b25_p13_c7_dependency_derivation.py'
      - 'docs/forensics/B2.5-P13 Corrective Action Remediation VII Report.md'
      - 'Procfile'
      - '.env.example'
      - '*compose.e2e.yml'
      - 'alembic/versions/007_skeldir_foundation/**'
      - 'contracts/trust-api/**'
      - 'contracts/bayesian/**'
      - 'scripts/ci/validate_b25_p13_confidence_truth.py'
      - 'scripts/ci/validate_b25_p13_c4_closure.py'
      - 'scripts/ci/validate_b25_p13_c5_closure.py'
      - 'scripts/ci/validate_b25_p13_c6_closure.py'
      - 'scripts/ci/validate_b25_p13_c12_closure.py'
      - 'scripts/ci/validate_b25_p13_c13_closure.py'
      - 'scripts/ci/validate_b25_p13_c13_artifact_closure.py'
      - 'scripts/ci/validate_b25_p13_c14_closure.py'
      - 'contracts-internal/governance/b25_p13_c13_authority_topology.v1.json'
      - 'contracts-internal/governance/b25_p13_c14_trust_semantic_authority.v1.json'
      - 'scripts/database/prepare_migration_authority_boundary.py'
      - '.github/actions/setup-postgres-ci/action.yml'
      - 'docs/forensics/B2.5-P13 Corrective Action Remediation VI Report.md'
      - 'docs/forensics/B2.5-P13 Corrective Action Remediation XII Report.md'
      - 'docs/forensics/B2.5-P13 Corrective Action Remediation XIII Report.md'
      - 'docs/forensics/B2.5-P13 Corrective Action Remediation XIV Report.md'
      - 'db/schema/canonical_schema.sql'
      - '.github/workflows/b2_5-p13-e2e-trust-closure.yml'
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push / merge_group: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  b25-p13-e2e-trust-closure-core:
    name: B2.5-P13 E2E Trust Closure Core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p13_e2e
      # migration_owner, not migration_user: that is the role
      # setup-postgres-ci actually provisions. The old value named a role that
      # never existed and went unnoticed because nothing in the job read this
      # variable until C5's legacy-row seeding did.
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
      B24_DISPATCH_PUBLISHER_DATABASE_URL: postgresql://app_dispatch_publisher:app_dispatch_publisher@127.0.0.1:5432/skeldir_b25_p13_e2e
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      SKELDIR_B25_P13_E2E_PROOF: "1"
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      # Shared least-privilege boundary rather than a hand-rolled superuser
      # database; migrations run under the migration principal. The runtime
      # principal must NOT bypass RLS: app.trust.tenant_security refuses any
      # connection whose role has rolbypassrls, so running as the postgres
      # superuser silently disabled that control AND every RLS policy the G2
      # tenant-isolation journey depends on.
      - name: Provision least-privilege database
        uses: ./.github/actions/setup-postgres-ci
        with:
          database-name: skeldir_b25_p13_e2e

      # Asserted, not assumed: a superuser connection would make G2 pass for
      # the wrong reason, because RLS would never apply.
      - name: Assert the runtime identity cannot bypass RLS
        run: |
          set -o pipefail
          bypass=$(psql "$DATABASE_URL" -tAc "SELECT COALESCE((SELECT rolbypassrls FROM pg_roles WHERE rolname = current_user), true)")
          echo "runtime_role_bypassrls=$bypass"
          test "$bypass" = "f"

      # The composition proof. Real DB, real RLS, real route, real signer.
      - name: P13 E2E trust closure (G1-G10 composition and adversarial journeys)
        run: |
          set -o pipefail
          python -m pytest backend/tests/trust/test_b25_p13_e2e_trust_closure.py \
            -q -s --no-header | tee /tmp/b25_p13_e2e.out
          grep -E "1 passed" /tmp/b25_p13_e2e.out

          # Exact assertions, not ">= 1". A journey or tamper field that silently
          # disappears must turn this gate red rather than reduce a number nobody
          # reads. Both tamper counts are pinned, so neither a shrinking matrix nor
          # a blind field can pass.
          grep -E "^p13_missing_cases=0$" /tmp/b25_p13_e2e.out
          grep -E "^p13_expected_cases=21$" /tmp/b25_p13_e2e.out
          grep -E "^p13_executed_cases=21$" /tmp/b25_p13_e2e.out
          grep -E "^p13_tamper_fields_expected=158$" /tmp/b25_p13_e2e.out
          grep -E "^p13_tamper_fields_failed=158$" /tmp/b25_p13_e2e.out
          grep -E "^p13_load_bearing_paths=97$" /tmp/b25_p13_e2e.out

          # C10: the signature commits to the producing inference regime.
          # Pinned exactly -- a provenance field that stops being covered must
          # turn this red rather than quietly shrink a number nobody reads.
          grep -E "^p13_c10_provenance_tamper_fields_expected=12$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c10_provenance_tamper_fields_failed=12$" /tmp/b25_p13_e2e.out
          grep -E "^p13_display_only_paths_excluded=24$" /tmp/b25_p13_e2e.out
          grep -E "^p13_downgrade_cases_failed_closed=8$" /tmp/b25_p13_e2e.out
          grep -E "^p13_negative_controls_fired=18$" /tmp/b25_p13_e2e.out
          grep -E "^p13_money_columns_integer_not_null=6$" /tmp/b25_p13_e2e.out
          grep -E "^p13_route_level_denials=2$" /tmp/b25_p13_e2e.out
          grep -E "^p13_confidence_semantic_truth_cases=10$" /tmp/b25_p13_e2e.out
          grep -E "^p13_confidence_governed_source_tables=7$" /tmp/b25_p13_e2e.out
          grep -E "^p13_confidence_physical_read_tables=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_replay_denied=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_scope_denied=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_db_invalid_available_rejected=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_db_invalid_state_mutations_rejected=5$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_authority_transaction_rollback=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_temporal_e2e=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c4_valid_terminalization_accepted=1$" /tmp/b25_p13_e2e.out

          # B2.5-P13 C5. Each of these is len() of a list the run appended
          # to, and p13_counter_provenance prints what was counted, so a
          # reviewer can check the number against the events behind it.
          grep -E "^p13_c5_terminal_authority_mutations_rejected=12$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_lease_reclaim_still_possible=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_terminal_bookkeeping_still_mutable=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_claim_seam_cases=6$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_future_evidence_write_rejected=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_allowed_skew_accepted=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_future_evidence_never_current=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c5_absolute_age_cases=2$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_classes_witnessed=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_dispositions=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_classes_quarantined=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g5_adversarial_classes_signature_verified=3$" /tmp/b25_p13_e2e.out
          grep -E "^p13_g8_no_live_recompute_statements=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_c6_completed_proof_journeys=1$" /tmp/b25_p13_e2e.out

      - name: P13 C3 confidence authority and semantic falsifiers
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_confidence_truth.py --negative-control \
            | tee /tmp/b25_p13_confidence_truth.out
          grep -E "^B25_P13_CONFIDENCE_TRUTH_VALIDATION_PASS$" \
            /tmp/b25_p13_confidence_truth.out
          grep -E "^confidence_truth_negative_controls_fired=12$" \
            /tmp/b25_p13_confidence_truth.out

      - name: P13 C4 state, temporal, freshness, and executable-authority closure
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_c4_closure.py --negative-control \
            | tee /tmp/b25_p13_c4_closure.out
          grep -E "^B25_P13_C4_CLOSURE_VALIDATION_PASS$" \
            /tmp/b25_p13_c4_closure.out
          grep -E "^p13_c4_negative_controls_fired=10$" \
            /tmp/b25_p13_c4_closure.out
          grep -E "^p13_c4_executable_dependency_controls=1$" \
            /tmp/b25_p13_c4_closure.out
          grep -E "^p13_c4_historical_rows_fail_closed=1$" \
            /tmp/b25_p13_c4_closure.out
      # P13 C5: lifecycle, temporal and proof-system closure. This step is
      # where a behavioural invariant guarded only by a source check is caught:
      # the control registry requires every such control to name a causal proof,
      # and the gate verifies that proof still exists.
      - name: P13 C5 lifecycle, temporal, and proof-system closure
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_c5_closure.py --negative-control \
            | tee /tmp/b25_p13_c5_closure.out
          grep -E "^B25_P13_C5_CLOSURE_VALIDATION_PASS$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_negative_controls_fired=11$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_controls_classified=34$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_behavioral_invariants=25$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_causal_controls=18$" /tmp/b25_p13_c5_closure.out
          grep -E "^p13_c5_behavioral_backstops=10$" /tmp/b25_p13_c5_closure.out

      - name: P13 C6 authority, orchestration, contract, and proof closure
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_c6_closure.py --negative-control \
            | tee /tmp/b25_p13_c6_closure.out
          grep -E "^B25_P13_C6_CLOSURE_VALIDATION_PASS$" /tmp/b25_p13_c6_closure.out
          grep -E "^c6_invariant_groups_passed=12$" /tmp/b25_p13_c6_closure.out
          grep -E "^c6_negative_controls_fired=13$" /tmp/b25_p13_c6_closure.out

      - name: P13 C6 PostgreSQL authority and production-planner physics
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_B25_P13_C6_DB_PROOF: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c6-prometheus
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          python -m pytest \
            backend/tests/trust/test_b25_p13_c6_postgres_physics.py \
            -q -s --no-header | tee /tmp/b25_p13_c6_physics.out
          grep -E "3 passed" /tmp/b25_p13_c6_physics.out

      - name: P13 C7 source causality, obligation conservation, and authority closure
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p13_c7_closure.py --negative-control             | tee /tmp/b25_p13_c7_closure.out
          grep -E "^B25_P13_C7_CLOSURE_VALIDATION_PASS$" /tmp/b25_p13_c7_closure.out
          grep -E "^c7_invariant_groups_passed=11$" /tmp/b25_p13_c7_closure.out
          grep -E "^c7_static_negative_controls_fired=38$" /tmp/b25_p13_c7_closure.out
          grep -E "^c7_semantics_preserving_controls_held=1$" /tmp/b25_p13_c7_closure.out
          grep -E "^c7_behavioral_obligations_bound=12$" /tmp/b25_p13_c7_closure.out

      # The behavioural half. Real PostgreSQL, real triggers, real planner
      # functions, real provisioner re-invocation. C7 refuses to let any of
      # these invariants be closed by a source-text substitution, which is the
      # exact gap that let a green C6 tree ship reproducible runtime defects.
      - name: P13 C7 conservation physics (behavioural falsifiers)
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C7_DB_PROOF: "1"
          SKELDIR_B25_P13_C7_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c7-prometheus
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          python -m pytest             backend/tests/trust/test_b25_p13_c7_conservation_physics.py             -q -s --no-header | tee /tmp/b25_p13_c7_physics.out
          grep -E "12 passed" /tmp/b25_p13_c7_physics.out

      # NC-C7-B01. The directive's named authority falsifier, run in both
      # directions against real privilege state rather than provisioner source
      # text: restore the broad runtime GRANT that Report 40 reproduced, prove
      # the required authority gate turns red, then prove provisioning repairs
      # the state and the gate turns green again. A gate that only reads source
      # could not tell these four steps apart.
      - name: NC-C7-B01 restoring runtime schema authority turns the gate red
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C7_DB_PROOF: "1"
          SKELDIR_B25_P13_C7_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c7-prometheus
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          DB=postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e
          ADMIN=postgresql://postgres:postgres@127.0.0.1:5432/postgres

          psql "$DB" -c "GRANT ALL ON SCHEMA public TO app_user;"
          reopened=$(psql "$DB" -tAc "SELECT has_schema_privilege('app_user','public','CREATE')")
          echo "reopened_runtime_create=$reopened"
          test "$reopened" = "t"

          if python -m pytest \
              backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
              -q -s --no-header -k reprovision_cannot_restore \
              > /tmp/nc_c7_b01_red.out 2>&1; then
            echo "NC-C7-B01 did not fire: the authority proof passed while runtime CREATE was open"
            cat /tmp/nc_c7_b01_red.out
            exit 1
          fi
          grep -E "1 failed" /tmp/nc_c7_b01_red.out

          python scripts/database/prepare_migration_authority_boundary.py \
            --admin-dsn "$ADMIN" --database-name skeldir_b25_p13_e2e \
            | tee /tmp/nc_c7_b01_repair.out
          grep -E "^runtime_schema_hardening_applied=true$" /tmp/nc_c7_b01_repair.out
          grep -E "^authority_monotonic=true$" /tmp/nc_c7_b01_repair.out
          repaired=$(psql "$DB" -tAc "SELECT has_schema_privilege('app_user','public','CREATE')")
          echo "repaired_runtime_create=$repaired"
          test "$repaired" = "f"

          python -m pytest \
            backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
            -q -s --no-header -k reprovision_cannot_restore \
            | tee /tmp/nc_c7_b01_green.out
          grep -E "1 passed" /tmp/nc_c7_b01_green.out

      # NC-C7-B02. Source-change causality is a physical property of the
      # contract-derived trigger, so removing the trigger must make a real B2.4
      # transition stop producing its planning obligation. Restoring it must
      # make the same proof green again.
      - name: NC-C7-B02 removing source invalidation turns causality red
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C7_DB_PROOF: "1"
          SKELDIR_B25_P13_C7_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c7-prometheus
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          DB=postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e

          psql "$DB" -c "DROP TRIGGER trg_b24_invalidate_b23_match_verdicts_update ON public.b23_match_verdicts;"
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
              -q -s --no-header -k source_change_creates_durable_obligation \
              > /tmp/nc_c7_b02_red.out 2>&1; then
            echo "NC-C7-B02 did not fire: causality proof passed without the trigger"
            cat /tmp/nc_c7_b02_red.out
            exit 1
          fi
          grep -E "1 failed" /tmp/nc_c7_b02_red.out
          grep -E "produced no invalidation" /tmp/nc_c7_b02_red.out

          psql "$DB" -c "CREATE TRIGGER trg_b24_invalidate_b23_match_verdicts_update AFTER UPDATE ON public.b23_match_verdicts REFERENCING OLD TABLE AS old_rows NEW TABLE AS new_rows FOR EACH STATEMENT EXECUTE FUNCTION public.b24_invalidate_b23_match_verdicts_update();"
          python -m pytest \
            backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
            -q -s --no-header -k source_change_creates_durable_obligation \
            | tee /tmp/nc_c7_b02_green.out
          grep -E "1 passed" /tmp/nc_c7_b02_green.out

      # NC-C7-B03. Wake-up conservation is a property of the completion
      # function's residual-authority read. Reinstating the C6 semantics --
      # unconditional delete on "no exception" -- must strand pre-debounce and
      # bounded-backlog work and turn both liveness proofs red.
      - name: NC-C7-B03 unconditional wake-up acknowledgement turns liveness red
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C7_DB_PROOF: "1"
          SKELDIR_B25_P13_C7_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c7-prometheus
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          DB=postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e

          psql "$DB" <<'SQL'
          CREATE OR REPLACE FUNCTION public.b24_complete_fit_planner_wakeup(
              p_tenant_id uuid, p_lease_owner text, p_wakeup_revision bigint,
              p_succeeded boolean, p_quiet_period_seconds integer,
              p_max_wait_seconds integer)
          RETURNS text LANGUAGE plpgsql SECURITY DEFINER
          SET search_path = public, pg_temp AS $nc$
          BEGIN
              DELETE FROM public.b24_fit_planner_wakeups
              WHERE tenant_id = p_tenant_id AND status = 'leased'
                AND lease_owner = p_lease_owner
                AND wakeup_revision = p_wakeup_revision;
              RETURN 'deleted';
          END $nc$;
          SQL
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
              -q -s --no-header \
              -k "pre_debounce_pass_cannot_strand or bounded_backlog_drains" \
              > /tmp/nc_c7_b03_red.out 2>&1; then
            echo "NC-C7-B03 did not fire: liveness proofs passed with C6 acknowledgement semantics"
            cat /tmp/nc_c7_b03_red.out
            exit 1
          fi
          grep -E "2 failed" /tmp/nc_c7_b03_red.out

          # Restore the governed function by replaying the C7 revision.
          MIGRATION_DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
          DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
            alembic downgrade 202608202300
          MIGRATION_DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
          DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
            alembic upgrade head
          python -m pytest \
            backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
            -q -s --no-header \
            -k "pre_debounce_pass_cannot_strand or bounded_backlog_drains" \
            | tee /tmp/nc_c7_b03_green.out
          grep -E "2 passed" /tmp/nc_c7_b03_green.out

      # C8: the seam both audits found severed. Source causality now has to
      # reach the signed boundary -- one identity space, and window dependency
      # by overlap rather than equality.
      - name: P13 C8 identity and window causality physics
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C8_DB_PROOF: "1"

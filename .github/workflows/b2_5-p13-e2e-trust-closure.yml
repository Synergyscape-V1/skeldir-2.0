          grep -E "failed" /tmp/nc_c9_01.out
          cp /tmp/fc_backup.py backend/app/bayesian/feature_cardinality.py
          python -m pytest \
            backend/tests/trust/test_b25_p13_c9_feature_cardinality_physics.py \
            -q -s --no-header | tee /tmp/nc_c9_01_restored.out
          grep -E "10 passed" /tmp/nc_c9_01_restored.out

      # NC-C9-06: removing the per-tenant containment boundary must strand the
      # tenants behind a failing one again.
      - name: NC-C9-06 removing tenant containment turns the gate red
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C9_DB_PROOF: "1"

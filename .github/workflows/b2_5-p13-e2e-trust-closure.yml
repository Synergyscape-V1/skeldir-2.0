          python -m pytest             backend/tests/trust/test_b25_p13_c8_contiguous_journey.py             -q -s --no-header | tee /tmp/b25_p13_c8_journey.out
          grep -E "2 passed" /tmp/b25_p13_c8_journey.out

      # NC-C8-B05: removing the planner's Beat entry must make the transport
      # proof red. Without this the proof cannot distinguish real delivery from
      # a planner that happened to run some other way.
      - name: NC-C8-B05 removing the planner Beat entry turns transport red
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          CELERY_BROKER_URL: sqla+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          CELERY_RESULT_BACKEND: db+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C8_TRANSPORT_PROOF: "1"
          SKELDIR_B24_P9_REQUIRE_DB_PROOFS: "1"
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c8-transport-prometheus
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          cp backend/app/tasks/beat_schedule.py /tmp/beat_schedule_backup.py
          python - <<'PY'
          import pathlib
          p = pathlib.Path("backend/app/tasks/beat_schedule.py")
          s = p.read_text(encoding="utf-8")
          marker = 'if os.getenv("SKELDIR_B24_DISABLE_FIT_PLANNER_JOB") != "1":'
          assert s.count(marker) == 1, "planner Beat guard not found"
          p.write_text(s.replace(marker, "if False:  # NC-C8-B05", 1), encoding="utf-8")
          PY
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c8_transport_physics.py \
              -q -s --no-header > /tmp/nc_c8_b05.out 2>&1; then
            echo "NC-C8-B05 did not fire: transport proof passed with no planner Beat entry"
            cp /tmp/beat_schedule_backup.py backend/app/tasks/beat_schedule.py
            cat /tmp/nc_c8_b05.out
            exit 1
          fi
          grep -E "1 failed" /tmp/nc_c8_b05.out
          cp /tmp/beat_schedule_backup.py backend/app/tasks/beat_schedule.py
          python -m pytest \
            backend/tests/trust/test_b25_p13_c8_transport_physics.py \
            -q -s --no-header | tee /tmp/nc_c8_b05_restored.out
          grep -E "1 passed" /tmp/nc_c8_b05_restored.out

      # C10-G/H/P: claim-time policy transitions and fresh transport are
      # runtime properties. The live test observes Beat emission, a PostgreSQL
      # broker row, execution inside the real Bayesian worker, and the durable
      # dispatch identity; direct task invocation is not part of the proof.
      - name: P13 C10 policy transition and natural fresh-dispatch physics
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
          CELERY_BROKER_URL: sqla+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          CELERY_RESULT_BACKEND: db+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C10_DB_PROOF: "1"
          SKELDIR_B24_P9_REQUIRE_DB_PROOFS: "1"
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c10-prometheus
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          python -m pytest \
            backend/tests/trust/test_b25_p13_c10_policy_transport_physics.py \
            -q -s --no-header | tee /tmp/b25_p13_c10_policy_transport.out
          grep -E "5 passed" /tmp/b25_p13_c10_policy_transport.out

      - name: P13 C11 semantic authority, publisher custody, and lineage physics
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C11_DB_PROOF: "1"
          SKELDIR_B24_P9_REQUIRE_DB_PROOFS: "1"
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c11-prometheus
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          python scripts/ci/validate_b25_p13_c11_closure.py --negative-control \
            | tee /tmp/b25_p13_c11_validator.out
          grep -E '^B25_P13_C11_CLOSURE_VALIDATION_PASS$' \
            /tmp/b25_p13_c11_validator.out
          grep -E '^c11_semantic_negative_controls_fired=3$' \
            /tmp/b25_p13_c11_validator.out
          python -m pytest \
            backend/tests/trust/test_b25_p13_c11_semantic_authority.py \
            -q -s --no-header | tee /tmp/b25_p13_c11_physics.out
          grep -E '7 passed' /tmp/b25_p13_c11_physics.out

      - name: P13 C12 authority closure and producing-regime concurrency
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
          B24_DISPATCH_PUBLISHER_DATABASE_URL: postgresql://app_dispatch_publisher:app_dispatch_publisher@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C12_DB_PROOF: "1"
        run: |
          set -euo pipefail
          python scripts/ci/validate_b25_p13_c12_closure.py --negative-control \
            | tee /tmp/b25_p13_c12_validator.out
          grep -E '^c12_semantic_negative_controls_fired=4$' \
            /tmp/b25_p13_c12_validator.out
          grep -E '^B25_P13_C12_CLOSURE_VALIDATION_PASS$' \
            /tmp/b25_p13_c12_validator.out
          python -m pytest \
            backend/tests/trust/test_b25_p13_c12_authority_closure.py \
            -q -s --no-header | tee /tmp/b25_p13_c12_physics.out
          grep -E '6 passed' /tmp/b25_p13_c12_physics.out

      - name: NC-C12 alternate self-issued authority turns the gate RED
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C12_DB_PROOF: "1"
        run: |
          set -euo pipefail
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE POLICY nc_c12_alternate_global_authority
            ON public.b24_fit_dispatch_outbox FOR ALL
            USING (current_setting('app.b24_recovery_reconciler', true) = 'on')
            WITH CHECK (current_setting('app.b24_recovery_reconciler', true) = 'on');
          SQL
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c12_authority_closure.py \
              -q --no-header \
              -k arbitrary_session_state_has_no_cross_tenant_consequence \
              > /tmp/nc_c12_authority.out 2>&1; then
            echo 'NC-C12 did not fire: alternate caller-minted authority survived'
            cat /tmp/nc_c12_authority.out
            exit 1
          fi
          grep -E '1 failed' /tmp/nc_c12_authority.out
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'DROP POLICY nc_c12_alternate_global_authority ON public.b24_fit_dispatch_outbox'
          python -m pytest \
            backend/tests/trust/test_b25_p13_c12_authority_closure.py \
            -q --no-header \
            -k arbitrary_session_state_has_no_cross_tenant_consequence \
            | tee /tmp/nc_c12_authority_restored.out
          grep -E '1 passed' /tmp/nc_c12_authority_restored.out

      - name: NC-C11-07 removing P2 turns the lineage gate RED
        env:
          C11_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e
          C11_WORKER_DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import psycopg2
          from psycopg2.extras import RealDictCursor

          admin = psycopg2.connect(os.environ["C11_ADMIN_DATABASE_URL"])
          worker = psycopg2.connect(os.environ["C11_WORKER_DATABASE_URL"])
          row = None
          deleted = False
          try:
              with admin.cursor(cursor_factory=RealDictCursor) as cursor:
                  cursor.execute(
                      "SELECT * FROM public.b24_fit_policy_replan_lineage "
                      "WHERE transition_sequence=2 LIMIT 1"
                  )
                  row = cursor.fetchone()
                  assert row, "C11 P1->P2->P3->P4 witness missing"
                  cursor.execute(
                      "ALTER TABLE public.b24_fit_policy_replan_lineage "
                      "DISABLE TRIGGER trg_b24_replan_lineage_append_only"
                  )
                  cursor.execute(
                      "DELETE FROM public.b24_fit_policy_replan_lineage "
                      "WHERE tenant_id=%s AND fit_id=%s AND transition_sequence=2",
                      (row["tenant_id"], row["fit_id"]),
                  )
              admin.commit()
              deleted = True

              with worker.cursor() as cursor:
                  cursor.execute(
                      "SELECT set_config('app.current_tenant_id', %s, false)",
                      (str(row["tenant_id"]),),
                  )
                  cursor.execute(
                      "SELECT public.b24_policy_lineage_complete(%s,%s)",
                      (row["tenant_id"], row["fit_id"]),
                  )
                  assert cursor.fetchone()[0] is False
              worker.commit()
              print("nc_c11_07_lineage_gap_detected=1")
          finally:
              if row is not None and deleted:
                  columns = list(row)
                  placeholders = ",".join(["%s"] * len(columns))
                  with admin.cursor() as cursor:
                      cursor.execute(
                          "INSERT INTO public.b24_fit_policy_replan_lineage ("
                          + ",".join(columns)
                          + ") VALUES (" + placeholders + ")",
                          [row[column] for column in columns],
                      )
                      cursor.execute(
                          "ALTER TABLE public.b24_fit_policy_replan_lineage "
                          "ENABLE TRIGGER trg_b24_replan_lineage_append_only"
                      )
                  admin.commit()
              worker.close()
              admin.close()
          PY

      # NC-C11-04/05/06 mutate production semantics while deliberately leaving
      # their labels and registry identity unchanged.  The same validator used
      # above must turn red for each family, then return green after restoration.
      - name: NC-C11 semantic mutation without version transition turns RED
        run: |
          set -euo pipefail
          for spec in \
            'backend/app/bayesian/sampling_policy.py|draws_per_chain: int = 1000|draws_per_chain: int = 999' \
            'backend/app/bayesian/diagnostics.py|ess_min_threshold: float = 400.0|ess_min_threshold: float = 399.0' \
            'backend/app/bayesian/inference_profile.py|CELERY_SOFT_TIME_LIMIT_SECONDS = 270|CELERY_SOFT_TIME_LIMIT_SECONDS = 271'; do
            IFS='|' read -r file old new <<< "$spec"
            cp "$file" /tmp/c11-policy-backup.py
            python - "$file" "$old" "$new" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          assert source.count(sys.argv[2]) == 1, (path, sys.argv[2])
          path.write_text(source.replace(sys.argv[2], sys.argv[3], 1), encoding="utf-8")
          PY
            if python scripts/ci/validate_b25_p13_c11_closure.py \
                 > /tmp/c11-semantic-red.out 2>&1; then
              echo "C11 semantic mutation did not turn the gate red: $file"
              cp /tmp/c11-policy-backup.py "$file"
              exit 1
            fi
            grep -E 'live_policy_semantics_registry_mismatch' \
              /tmp/c11-semantic-red.out
            cp /tmp/c11-policy-backup.py "$file"
            # Drop cached bytecode for the restored module. CPython invalidates
            # .pyc by source mtime at one-second granularity, so a mutate-and-
            # restore inside the same second can leave the mutated bytecode
            # authoritative -- the control then reports the mutation it just
            # undid, and the step fails for a reason that no longer exists.
            find backend/app -name '__pycache__' -type d -prune -exec rm -rf {} +
          done
          python -B scripts/ci/validate_b25_p13_c11_closure.py \
            | grep -E '^B25_P13_C11_CLOSURE_VALIDATION_PASS$'

      # NC-C10-09 / NC-C10-10. Remove the only production scheduler edge. The
      # required proof must turn red immediately; a direct `.run()` call is not
      # present and therefore cannot rescue it.
      - name: NC-C10-09 removing fresh publisher turns transport gate red
        env:
          SKELDIR_B25_P13_C10_DB_PROOF: "1"
        run: |
          set -o pipefail
          cp backend/app/tasks/beat_schedule.py /tmp/c10_beat_schedule_backup.py
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/tasks/beat_schedule.py")
          source = path.read_text(encoding="utf-8")
          marker = 'if os.getenv("SKELDIR_B24_DISABLE_FIT_DISPATCH_PUBLISHER_JOB") != "1":'
          assert source.count(marker) == 1, "fresh publisher schedule guard moved"
          path.write_text(source.replace(marker, "if False:  # NC-C10-09", 1), encoding="utf-8")
          PY
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c10_policy_transport_physics.py \
              -q -s --no-header \
              -k production_schedule_contains_fresh_dispatch_publisher \
              > /tmp/nc_c10_09_red.out 2>&1; then
            echo "NC-C10-09 DID NOT FIRE: transport gate passed without publisher"
            cp /tmp/c10_beat_schedule_backup.py backend/app/tasks/beat_schedule.py
            cat /tmp/nc_c10_09_red.out
            exit 1
          fi
          grep -E "1 failed" /tmp/nc_c10_09_red.out
          cp /tmp/c10_beat_schedule_backup.py backend/app/tasks/beat_schedule.py
          python -m pytest \
            backend/tests/trust/test_b25_p13_c10_policy_transport_physics.py \
            -q -s --no-header \
            -k production_schedule_contains_fresh_dispatch_publisher \
            | tee /tmp/nc_c10_09_green.out
          grep -E "1 passed" /tmp/nc_c10_09_green.out

      # P13-G11: the suite must not silently lose a journey. An expected case
      # that disappears has to fail the gate rather than reduce a count nobody
      # reads, so the manifest is asserted here as well as inside the test.
      - name: P13 expected-case manifest (non-vacuity)
        run: |
          set -o pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path(
              "backend/tests/trust/test_b25_p13_e2e_trust_closure.py"
          ).read_text(encoding="utf-8")
          block = re.search(r"EXPECTED_CASE_IDS = \((.*?)\)", source, re.S)
          assert block, "EXPECTED_CASE_IDS manifest missing"
          cases = re.findall(r'"([^"]+)"', block.group(1))
          required = {
              "P13-G1-happy-path-signed-envelope",
              "P13-G2-wrong-tenant-no-existence-leak",
              "P13-G9-public-only-verification",
              "P13-G3-tamper-matrix-all-load-bearing-fields",
              "P13-G4-degraded-confidence-no-fabricated-interval",
              "P13-G5-prompt-control-quarantined",
              "P13-G6-money-source-not-authoritative",
              "P13-G7-schema-downgrade-fails-closed",
              "P13-G8-read-only-no-compute-dispatch",
              "P13-G10-audit-provenance-composition",
              "P13-H14-replay-denied-atomically",
              "P13-H15-missing-scope-denied",
              "P13-H15R-route-level-scope-denial",
              "P13-H14R-route-level-replay-denial",
              "P13-H08-confidence-projection-closure",
              "P13-C5-01-terminal-confidence-immutable",
              "P13-C5-02-production-claim-seam-operability",
              "P13-C5-03-future-evidence-cannot-be-current",
              "P13-C5-04-absolute-age-explicitly-bounded",
              "P13-C5-05-adversarial-class-matrix",
              "P13-C10-signed-inference-provenance-tamper-closure",
          }
          missing = sorted(required - set(cases))
          assert not missing, f"required P13 journeys removed from manifest: {missing}"
          for case in cases:
              assert f'executed.append("{case}")' in source, (
                  f"case {case} is declared but never appended by the suite"
              )
          print(f"p13_expected_cases={len(cases)}")
          print("p13_manifest_integrity=ok")
          PY

      # NC-P13-15: a failing P13 proof must not be able to leave this workflow
      # green. Previously recorded as "structurally covered", which was an
      # assertion about this file rather than a proof of it. Now checked: every
      # counter assertion must be anchored (^...$) and pinned to a literal value.
      # A grep like "^p13_executed_cases=[0-9]*$" would match a shrinking suite,
      # so the gate would stay green while coverage fell.
      - name: NC-P13-15 counter assertions are exact and cannot drift
        run: |
          set -o pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(
              ".github/workflows/b2_5-p13-e2e-trust-closure.yml"
          ).read_text(encoding="utf-8")
          asserts = re.findall(r'grep -E "([^"]*p13_[a-z_]+[^"]*)"', workflow)
          assert asserts, "no p13 counter assertions found"
          weak = []
          for pattern in asserts:
              if not (pattern.startswith("^") and pattern.endswith("$")):
                  weak.append((pattern, "not anchored"))
                  continue
              value = pattern[1:-1].split("=", 1)[1] if "=" in pattern else ""
              if not value.isdigit():
                  weak.append((pattern, f"value {value!r} is not a literal integer"))
          assert not weak, f"counter assertions that could drift: {weak}"
          print(f"p13_counter_assertions_exact={len(asserts)}")
          PY

      # P13-G11: failure must not be maskable, and no journey may be quietly
      # skipped. pytest reports skips and xfails in its summary line; asserting
      # their absence is the difference between "the suite ran" and "the suite
      # ran everything it claims".
      - name: P13 non-vacuity (no skips, no xfail, no failure masking)
        run: |
          set -o pipefail
          if grep -qE "skipped|xfailed|xpassed|deselected" /tmp/b25_p13_e2e.out; then
            echo "P13 suite reported skipped/xfail/deselected cases:"
            grep -E "skipped|xfailed|xpassed|deselected" /tmp/b25_p13_e2e.out
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/b2_5-p13-e2e-trust-closure.yml"
          ).read_text(encoding="utf-8")
          # A gate that can swallow its own failure is decorative. The tokens are
          # ASSEMBLED rather than written literally: spelling them out here would
          # place them inside a b2_5 workflow, and B2.5-P12's Plane D scans every
          # b2_5-*.yml for exactly these strings. Writing the scanner literally
          # made P12 red -- the failure-masking detector introduced
          # failure-masking. Assembling them keeps the check honest and keeps the
          # file clean for the layer above it.
          tokens = (
              "continue-" + "on-error: true",
              "|" + "| true",
              "exit " + "0  #",
          )
          for token in tokens:
              assert token not in workflow, f"failure masking token present: {token}"
          # `set -o pipefail` is required wherever the suite is piped to tee,
          # otherwise tee's exit status hides a failing pytest.
          assert workflow.count("set -o pipefail") >= 3, "pipefail missing from a step"
          print("p13_failure_masking_tokens=0")
          print("p13_pipefail_guarded=ok")
          PY

      # P13-G12: P13 must not weaken any earlier phase. The inherited proofs are
      # re-run here with their own negative controls rather than assumed to hold
      # because some other workflow is green.
      - name: P1-P12 preservation with P13 present
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p1_contracts.py --negative-control
          python scripts/ci/validate_b25_p1_trust_drift.py --negative-control
          python scripts/ci/validate_b25_p12_trust_isolation.py --negative-control             | tee /tmp/b25_p13_p12_iso.out
          grep -E "^B25_P12_TRUST_ISOLATION_VALIDATION_PASS$" /tmp/b25_p13_p12_iso.out
          grep -E "^isolation_negative_controls_fired=4$" /tmp/b25_p13_p12_iso.out
          python scripts/ci/validate_b25_p12_ci_gates.py --negative-control             | tee /tmp/b25_p13_p12_gates.out
          grep -E "^B25_P12_CI_GATES_VALIDATION_PASS$" /tmp/b25_p13_p12_gates.out
          grep -E "^ci_gate_negative_controls_fired=7$" /tmp/b25_p13_p12_gates.out
          echo "p13_preservation_validators_passed=4"

  b2-5-p13-c13-semantic-history:
    name: B2.5-P13 C13 Semantic Signing and Historical Replay
    runs-on: ubuntu-latest
    env:
      # The shared pytest bootstrap requires an explicit localhost DSN in CI even
      # for this deliberately database-free semantic proof. No connection is made.
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p13_c13
      PYTHONPATH: ${{ github.workspace }}/backend
      TESTING: "1"
      CI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install semantic proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Production signer boundary and historical replay physics
        run: |
          set -euo pipefail
          python -m pytest \
            backend/tests/trust/test_b25_p13_c13_signing_truth_boundary.py \
            -q -s --no-header | tee /tmp/c13-signing-history.out
          grep -E '16 passed' /tmp/c13-signing-history.out

      - name: C13 route topology and proof graph with negative controls
        run: |
          set -euo pipefail
          python scripts/ci/validate_b25_p13_c13_closure.py --negative-control \
            | tee /tmp/c13-closure.out
          grep -q '^B25_P13_C13_CLOSURE_VALIDATION_PASS$' /tmp/c13-closure.out
          grep -q '^c13_static_negative_controls_fired=6$' /tmp/c13-closure.out

  b2-5-p13-c9-positive-confidence:
    name: B2.5-P13 C9 Positive Confidence Composition
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_c9
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_c9
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      TESTING: "1"
      CI: "true"
      SKELDIR_B25_P13_C9_POSITIVE_PROOF: "1"
      SKELDIR_CELERY_WORKER_ROLE: bayesian
      SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
      SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
      SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
      SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
      SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
      ENFORCE_RUNTIME_IDENTITY_PARITY: "1"
      EXPECTED_RUNTIME_DB_USER: app_worker
      PLATFORM_TOKEN_ENCRYPTION_KEY: test-platform-key
      PLATFORM_TOKEN_KEY_ID: test-key
      PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c9-positive-prometheus
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      # The Bayesian runtime is required, not optional. This journey samples a
      # real posterior; the proof it replaces was the one that supplied its own
      # feature authority instead.
      - name: Install backend and Bayesian dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-bayesian.txt
          pip install -r backend/requirements-dev.txt

      - name: Prepare C9 CI database
        uses: ./.github/actions/setup-postgres-ci
        with:
          database-name: "skeldir_b25_p13_c9"
          migration-command: "alembic upgrade head"
          revoke-alembic-version: "false"

      # C9-J. One real settlement run reaches a signed, usable confidence with
      # no test-written feature authority, no test-written fit, and no
      # test-constructed dispatch claim at any point in the chain.
      - name: P13 C9 positive available-confidence composition
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          python -m pytest \
            backend/tests/trust/test_b25_p13_c9_positive_confidence.py \
            -q -s --no-header | tee /tmp/b25_p13_c9_positive.out
          grep -E "2 passed" /tmp/b25_p13_c9_positive.out

      # NC-C9-08: substituting a test-created feature authority at the seam must
      # make this red. The gate is only meaningful if the seam is load-bearing,
      # and the seam is exactly where every previous positive-confidence proof
      # started from state it wrote itself.
      - name: NC-C9-08 substituting the feature authority turns the gate red
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          cp backend/tests/trust/test_b25_p13_c9_positive_confidence.py /tmp/pos_backup.py
          python - <<'PY'
          import pathlib
          p = pathlib.Path("backend/tests/trust/test_b25_p13_c9_positive_confidence.py")
          s = p.read_text(encoding="utf-8")
          old = "    return asyncio.run(produce_all())"
          assert s.count(old) == 1, "the producer call site moved"
          # Skip the real producer entirely, as the historical P6 proof does.
          p.write_text(s.replace(old, "    return 1", 1), encoding="utf-8")
          PY
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c9_positive_confidence.py \
              -q -s --no-header > /tmp/nc_c9_08.out 2>&1; then
            echo "NC-C9-08 did not fire: the journey passed without the producer"
            cp /tmp/pos_backup.py backend/tests/trust/test_b25_p13_c9_positive_confidence.py
            cat /tmp/nc_c9_08.out
            exit 1
          fi
          grep -E "failed" /tmp/nc_c9_08.out
          cp /tmp/pos_backup.py backend/tests/trust/test_b25_p13_c9_positive_confidence.py
          python -m pytest \
            backend/tests/trust/test_b25_p13_c9_positive_confidence.py \
            -q -s --no-header | tee /tmp/nc_c9_08_restored.out
          grep -E "2 passed" /tmp/nc_c9_08_restored.out

  b2-5-p13-c10-artifact-topology:
    name: B2.5-P13 C10 Executable Artifact Topology
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_c11
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_c11
      B24_DISPATCH_PUBLISHER_DATABASE_URL: postgresql://app_dispatch_publisher:app_dispatch_publisher@127.0.0.1:5432/skeldir_b25_p13_c11
      CELERY_BROKER_URL: sqla+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_c11
      CELERY_RESULT_BACKEND: db+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_c11
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      TESTING: "1"
      CI: "true"
      SKELDIR_B25_P13_C9_POSITIVE_PROOF: "1"
      SKELDIR_B25_P13_C11_DB_PROOF: "1"
      SKELDIR_B25_P13_C11_EXTERNAL_WORKER: "1"
      SKELDIR_CELERY_WORKER_ROLE: bayesian
      SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
      SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
      SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
      SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
      SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
      PLATFORM_TOKEN_ENCRYPTION_KEY: test-platform-key
      PLATFORM_TOKEN_KEY_ID: test-key
      PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c11-host-prometheus
    # This job exists because F-11 was declared resolved on evidence produced by
    # a job that pip-installs onto a runner. That evidence was real, and it
    # measured a topology the shipped image did not have: Dockerfile.bayesian
    # set B24_PYMC_CHAINS=1, so production resolved one chain, R-hat was
    # undefined, and no fit it produced could pass its own diagnostics -- while
    # required CI stayed green, because nothing in CI ever built the image.
    #
    # Nothing here reads a policy default. Every assertion is made against the
    # artifact this repository would actually deploy.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python and C11 database authority
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install host orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Provision C11 principals and migrate
        uses: ./.github/actions/setup-postgres-ci
        with:
          database-name: skeldir_b25_p13_c11

      - name: Build the production Bayesian artifact, unmodified
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile.bayesian -t skeldir-bayesian:candidate .

      - name: C13 artifact identity, default CMD, and dependency trace
        run: |
          set -euo pipefail
          docker image inspect skeldir-bayesian:candidate \
            --format '{{json .Id}} {{json .Config.Cmd}}' | tee c13-image-inspect.log
          grep -q 'celery' c13-image-inspect.log
          grep -q 'bayesian' c13-image-inspect.log
          docker run --rm -i skeldir-bayesian:candidate \
            python - < scripts/ci/validate_b25_p13_c13_artifact_closure.py \
            | tee c13-artifact-trace.log
          grep -q '^B25_P13_C13_ARTIFACT_CLOSURE_PASS$' c13-artifact-trace.log
          echo "p13_c13_image_identity=$(cut -d' ' -f1 c13-image-inspect.log)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: NC-XIII artifact dependency and host mount-shadow controls
        run: |
          set -euo pipefail
          printf '%s\n' \
            'FROM skeldir-bayesian:candidate' \
            'RUN rm /app/contracts/trust-api/temporal-policy.v1.yaml' \
            > Dockerfile.nc-xiii-contract
          docker build -f Dockerfile.nc-xiii-contract -t skeldir-bayesian:nc-xiii-contract .
          if docker run --rm -i skeldir-bayesian:nc-xiii-contract \
               python - < scripts/ci/validate_b25_p13_c13_artifact_closure.py \
               > nc-xiii-contract.log 2>&1; then
            echo 'missing governed contract passed artifact closure'; exit 1
          fi
          grep -q 'resource_missing' nc-xiii-contract.log

          printf '%s\n' \
            'FROM skeldir-bayesian:candidate' \
            'RUN rm /app/backend/app/inference_policy_registry.py' \
            > Dockerfile.nc-xiii-module
          docker build -f Dockerfile.nc-xiii-module -t skeldir-bayesian:nc-xiii-module .
          if docker run --rm -i skeldir-bayesian:nc-xiii-module \
               python - < scripts/ci/validate_b25_p13_c13_artifact_closure.py \
               > nc-xiii-module.log 2>&1; then
            echo 'missing governed module passed artifact closure'; exit 1
          fi
          grep -q 'module_import_failed' nc-xiii-module.log

          if docker run --rm -i \
               -v "$PWD/backend/app:/app/backend/app:ro" \
               skeldir-bayesian:candidate python - \
               < scripts/ci/validate_b25_p13_c13_artifact_closure.py \
               > nc-xiii-mount-shadow.log 2>&1; then
            echo 'mount-shadow runtime passed production equivalence'; exit 1
          fi
          grep -q 'host_mount_shadows_governed_runtime' nc-xiii-mount-shadow.log
          echo 'p13_c13_artifact_negative_controls_fired=3' >> "$GITHUB_STEP_SUMMARY"

      - name: C10-B/C10-I -- the shipped artifact resolves the governed topology
        run: |
          set -euo pipefail
          # Piped in rather than baked into the image: the artifact under test
          # stays byte-identical to the one that would ship.
          for run in 1 2; do
            docker run --rm -i skeldir-bayesian:candidate \
              python - < scripts/ci/validate_b24_artifact_topology.py \
              2>&1 | tee "artifact_topology_${run}.log"
            grep -q 'B24_ARTIFACT_TOPOLOGY_PASS' "artifact_topology_${run}.log"
            grep -q 'Sequential sampling (4 chains in 1 job)' \
              "artifact_topology_${run}.log" \
              || { echo "artifact did not sample four chains sequentially"; exit 1; }
            grep -q '"observed_posterior_draws_total": 4000' \
              "artifact_topology_${run}.log"
            grep -q '"divergence_count": 0' "artifact_topology_${run}.log"
            grep -q '"identical_chain_pairs": \[\]' "artifact_topology_${run}.log"
          done
          echo "p13_c10_artifact_topology_pass=1" >> "$GITHUB_STEP_SUMMARY"
          echo "p13_c10_artifact_statistical_repeats=2" >> "$GITHUB_STEP_SUMMARY"

      - name: NC-C10-01 -- reintroducing the one-chain image override turns this RED
        run: |
          set -euo pipefail
          # The decisive F-12 successor control. No test expectation is touched;
          # only the deployment artifact changes, exactly as it stood on main.
          python - <<'PY'
          import pathlib
          lines = pathlib.Path("backend/Dockerfile.bayesian").read_text().split("\n")
          i = next(n for n, l in enumerate(lines)
                   if l.strip().startswith("B24_PYMC_CORES="))
          lines.insert(i + 1, "    B24_PYMC_CHAINS=1 " + chr(92))
          pathlib.Path("Dockerfile.nc-c10-01").write_text("\n".join(lines))
          PY
          docker build -f Dockerfile.nc-c10-01 -t skeldir-bayesian:nc-c10-01 .
          if docker run --rm -i skeldir-bayesian:nc-c10-01 \
               python - < scripts/ci/validate_b24_artifact_topology.py > nc01.log 2>&1; then
            echo "NC-C10-01 DID NOT FIRE: the one-chain artifact passed the gate"
            cat nc01.log
            exit 1
          fi
          grep -q 'B24_ARTIFACT_TOPOLOGY_FAIL' nc01.log
          grep -q 'authorized=4 resolved=1' nc01.log
          rm -f Dockerfile.nc-c10-01
          echo "p13_c10_nc01_artifact_one_chain_fired=1" >> "$GITHUB_STEP_SUMMARY"

      - name: NC-C10-02 -- an environment override is refused before PyMC runs
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            if docker run --rm -i -e B24_PYMC_CHAINS=$n skeldir-bayesian:candidate \
                 python - < scripts/ci/validate_b24_artifact_topology.py > "nc02-$n.log" 2>&1; then
              echo "NC-C10-02 DID NOT FIRE for chains=$n"
              cat "nc02-$n.log"
              exit 1
            fi
            grep -q "authorized=4 resolved=$n" "nc02-$n.log"
            # Refused *before* computation, not diagnosed after it.
            if grep -q 'Sequential sampling' "nc02-$n.log"; then
              echo "chains=$n reached PyMC; the binding is not fail-closed"
              exit 1
            fi
          done
          echo "p13_c10_nc02_runtime_override_refused=3" >> "$GITHUB_STEP_SUMMARY"

      - name: NC-C10-03 -- a deadline that diverges from the profile fails closed
        run: |
          set -euo pipefail
          # The chains defect proved that equal defaults are not a binding. These
          # three are equally environment-driven and today merely happen to agree.
          fired=0
          for spec in "B24_SAMPLER_SUPERVISOR_DEADLINE_S=120" \
                      "BAYESIAN_TASK_SOFT_TIME_LIMIT_S=250" \
                      "BAYESIAN_TASK_TIME_LIMIT_S=999"; do
            if docker run --rm -i -e "$spec" skeldir-bayesian:candidate \
                 python - < scripts/ci/validate_b24_artifact_topology.py > nc03.log 2>&1; then
              echo "NC-C10-03 DID NOT FIRE for $spec"
              cat nc03.log
              exit 1
            fi
            grep -q 'B24_ARTIFACT_TOPOLOGY_FAIL' nc03.log
            fired=$((fired + 1))
          done
          echo "p13_c10_nc03_deadline_divergence_refused=$fired" >> "$GITHUB_STEP_SUMMARY"

      - name: C10-I -- four chains without multiprocessing fan-out
        run: |
          set -euo pipefail
          # Chains rose; parallelism did not. Confirmed from inside the running
          # container rather than from the policy that requested it.
          docker run --rm -i skeldir-bayesian:candidate python - <<'PY' | tee containment.log
          import json, os, warnings
          warnings.filterwarnings("ignore")
          from app.bayesian.runtime_policy import build_runtime_policy
          r = build_runtime_policy()
          assert r.pymc_cores == 1, r.pymc_cores
          assert r.blas_total_threads == 1, r.blas_total_threads
          for var in ("OMP_NUM_THREADS", "OPENBLAS_NUM_THREADS", "MKL_NUM_THREADS",
                      "NUMEXPR_NUM_THREADS", "VECLIB_MAXIMUM_THREADS"):
              assert os.environ.get(var) == "1", (var, os.environ.get(var))
          print("B24_ARTIFACT_CONTAINMENT_PASS " + json.dumps({
              "chains": r.pymc_chains, "cores": r.pymc_cores,
              "blas_total_threads": r.blas_total_threads,
              "worker_concurrency": r.worker_concurrency,
          }, sort_keys=True))
          PY
          grep -q 'B24_ARTIFACT_CONTAINMENT_PASS' containment.log
          echo "p13_c10_single_process_containment_pass=1" >> "$GITHUB_STEP_SUMMARY"

      # C11-M/P/Q/T.  The execution container is started with no command
      # override: Docker therefore uses Dockerfile.bayesian's deployed Celery
      # CMD.  A second credential-isolated process consumes only the publisher
      # queue.  Beat emits the publisher task; the financial journey creates
      # the fit naturally; the real image consumes its broker wake-up and its
      # sampler child produces the posterior that Trust later signs.
      - name: C11 real artifact worker positive Trust composition
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          docker run -d --rm --network host --name skeldir-c11-execution \
            -e DATABASE_URL \
            -e CELERY_BROKER_URL \
            -e CELERY_RESULT_BACKEND \
            -e TESTING -e CI \
            -e SKELDIR_BAYESIAN_DB_TOPOLOGY \
            -e SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION \
            -e SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE \
            -e SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY \
            skeldir-bayesian:candidate

          docker run -d --rm --network host --name skeldir-c11-publisher \
            -e DATABASE_URL="$B24_DISPATCH_PUBLISHER_DATABASE_URL" \
            -e B24_DISPATCH_PUBLISHER_DATABASE_URL \
            -e CELERY_BROKER_URL="sqla+$B24_DISPATCH_PUBLISHER_DATABASE_URL" \
            -e CELERY_RESULT_BACKEND="db+$B24_DISPATCH_PUBLISHER_DATABASE_URL" \
            -e SKELDIR_CELERY_WORKER_ROLE=bayesian_publisher \
            -e SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS=0 \
            -e TESTING -e CI \
            -e SKELDIR_BAYESIAN_DB_TOPOLOGY \
            -e SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION \
            -e SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE \
            -e SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY \
            skeldir-bayesian:candidate \
            celery -A app.celery_app.celery_app worker \
              -Q bayesian_publisher --loglevel=INFO --concurrency=1

          # Teardown is made incapable of failing rather than having its
          # failure swallowed. A trailing short-circuit to a no-op would do the
          # same thing to this block and to a real assertion, which is why P12
          # forbids that token outright; an explicit `return 0` on a function
          # that only removes containers says what is intended and cannot
          # spread to anything that asserts.
          cleanup() {
            if [ -n "${BEAT_PID:-}" ]; then
              kill "$BEAT_PID" 2>/dev/null
            fi
            docker rm -f skeldir-c11-execution skeldir-c11-publisher \
              >/dev/null 2>&1
            return 0
          }
          trap cleanup EXIT

          for container in skeldir-c11-execution skeldir-c11-publisher; do
            for attempt in $(seq 1 90); do
              docker logs "$container" > "/tmp/${container}-boot.log" 2>&1
              grep -q ' ready' "/tmp/${container}-boot.log" && break
              test "$attempt" -lt 90 || {
                docker logs "$container"; exit 1;
              }
              sleep 1
            done
          done

          (
            cd backend
            B24_FIT_PLANNER_INTERVAL_SECONDS=1 \
            SKELDIR_B24_DISABLE_FIT_PLANNER_JOB=1 \
            SKELDIR_B24_P9_DISABLE_RECOVERY_RECONCILER_JOB=1 \
            celery -A app.celery_app.celery_app beat --loglevel=INFO \
              --pidfile= --schedule=/tmp/c11-celerybeat-schedule
          ) > /tmp/c11-beat.log 2>&1 &
          BEAT_PID=$!

          python -m pytest \
            backend/tests/trust/test_b25_p13_c9_positive_confidence.py \
            -q -s --no-header \
            -k real_posterior_is_produced_by_the_chain_that_claims_it \
            | tee /tmp/c11-artifact-positive.out
          grep -E '1 passed' /tmp/c11-artifact-positive.out
          # Captured to files before matching. `docker logs | grep -q` makes
          # grep exit on its first hit while docker is still writing, which
          # SIGPIPEs the writer and surfaces as exit 141 under pipefail -- a
          # green journey reported as a failed step. The rest of this workflow
          # already matches against captured files for the same reason.
          docker logs skeldir-c11-execution > /tmp/c11-exec.log 2>&1
          docker logs skeldir-c11-publisher > /tmp/c11-pub.log 2>&1
          grep -q 'app.tasks.bayesian.execute_fit_intent' /tmp/c11-exec.log
          grep -q 'app.tasks.bayesian.publish_due_fit_dispatches' \
            /tmp/c11-pub.log
          echo "p13_c11_actual_docker_cmd_worker=1" >> "$GITHUB_STEP_SUMMARY"
          echo "p13_c11_natural_publisher_worker_trust_journey=1" >> "$GITHUB_STEP_SUMMARY"

      - name: NC-C11-10 broken Celery CMD turns the production worker gate RED
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("backend/Dockerfile.bayesian").read_text(encoding="utf-8")
          marker = 'CMD ["celery", "-A", "app.celery_app", "worker"'
          assert source.count(marker) == 1
          Path("Dockerfile.nc-c11-10").write_text(
              source.replace(marker, 'CMD ["false", "-A", "app.celery_app", "worker"', 1),
              encoding="utf-8",
          )
          PY
          docker build -f Dockerfile.nc-c11-10 \
            -t skeldir-bayesian:nc-c11-10 .

          # The old command-replacement validator remains green, proving why it
          # was insufficient as an executable-artifact gate.
          docker run --rm -i skeldir-bayesian:nc-c11-10 \
            python - < scripts/ci/validate_b24_artifact_topology.py \
            > /tmp/nc-c11-10-old-validator.out 2>&1
          grep -q 'B24_ARTIFACT_TOPOLOGY_PASS' \
            /tmp/nc-c11-10-old-validator.out

          # The C11 gate uses the real default CMD, so the same image is red.
          if docker run --rm skeldir-bayesian:nc-c11-10 \
               > /tmp/nc-c11-10-worker.out 2>&1; then
            echo 'NC-C11-10 did not fire: broken default worker CMD succeeded'
            exit 1
          fi
          if grep -q ' ready' /tmp/nc-c11-10-worker.out; then
            echo 'NC-C11-10 did not fire: broken image reported worker readiness'
            exit 1
          fi
          rm -f Dockerfile.nc-c11-10
          echo "p13_c11_nc10_broken_worker_cmd_fired=1" >> "$GITHUB_STEP_SUMMARY"

  # This job deliberately owns the branch-protection context name. It is a
  # mechanical AND over the core trust chain, the real positive posterior
  # journey, and executable production-artifact topology. A skipped or failed
  b2-5-p13-c14-semantic-authority:
    name: B2.5-P13 C14 Complete Semantic Issuance Authority
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p13_c14

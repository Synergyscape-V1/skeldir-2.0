          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c7-prometheus
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          DB=postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e

          psql "$DB" -c "DROP TRIGGER trg_b24_invalidate_b23_match_verdicts_update ON public.b23_match_verdicts;"
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
              -q -s --no-header -k source_change_creates_durable_obligation \
              > /tmp/nc_c7_b02_red.out 2>&1; then
            echo "NC-C7-B02 did not fire: causality proof passed without the trigger"
            cat /tmp/nc_c7_b02_red.out
            exit 1
          fi
          grep -E "1 failed" /tmp/nc_c7_b02_red.out
          grep -E "produced no invalidation" /tmp/nc_c7_b02_red.out

          psql "$DB" -c "CREATE TRIGGER trg_b24_invalidate_b23_match_verdicts_update AFTER UPDATE ON public.b23_match_verdicts REFERENCING OLD TABLE AS old_rows NEW TABLE AS new_rows FOR EACH STATEMENT EXECUTE FUNCTION public.b24_invalidate_b23_match_verdicts_update();"
          python -m pytest \
            backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
            -q -s --no-header -k source_change_creates_durable_obligation \
            | tee /tmp/nc_c7_b02_green.out
          grep -E "1 passed" /tmp/nc_c7_b02_green.out

      # NC-C7-B03. Wake-up conservation is a property of the completion
      # function's residual-authority read. Reinstating the C6 semantics --
      # unconditional delete on "no exception" -- must strand pre-debounce and
      # bounded-backlog work and turn both liveness proofs red.
      - name: NC-C7-B03 unconditional wake-up acknowledgement turns liveness red
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C7_DB_PROOF: "1"
          SKELDIR_B25_P13_C7_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c7-prometheus
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          DB=postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e

          psql "$DB" <<'SQL'
          CREATE OR REPLACE FUNCTION public.b24_complete_fit_planner_wakeup(
              p_tenant_id uuid, p_lease_owner text, p_wakeup_revision bigint,
              p_succeeded boolean, p_quiet_period_seconds integer,
              p_max_wait_seconds integer)
          RETURNS text LANGUAGE plpgsql SECURITY DEFINER
          SET search_path = public, pg_temp AS $nc$
          BEGIN
              DELETE FROM public.b24_fit_planner_wakeups
              WHERE tenant_id = p_tenant_id AND status = 'leased'
                AND lease_owner = p_lease_owner
                AND wakeup_revision = p_wakeup_revision;
              RETURN 'deleted';
          END $nc$;
          SQL
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
              -q -s --no-header \
              -k "pre_debounce_pass_cannot_strand or bounded_backlog_drains" \
              > /tmp/nc_c7_b03_red.out 2>&1; then
            echo "NC-C7-B03 did not fire: liveness proofs passed with C6 acknowledgement semantics"
            cat /tmp/nc_c7_b03_red.out
            exit 1
          fi
          grep -E "2 failed" /tmp/nc_c7_b03_red.out

          # Restore the governed function by replaying the C7 revision.
          MIGRATION_DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
          DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
            alembic downgrade 202608202300
          MIGRATION_DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
          DATABASE_URL=postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e \
            alembic upgrade head
          python -m pytest \
            backend/tests/trust/test_b25_p13_c7_conservation_physics.py \
            -q -s --no-header \
            -k "pre_debounce_pass_cannot_strand or bounded_backlog_drains" \
            | tee /tmp/nc_c7_b03_green.out
          grep -E "2 passed" /tmp/nc_c7_b03_green.out

      # C8: the seam both audits found severed. Source causality now has to
      # reach the signed boundary -- one identity space, and window dependency
      # by overlap rather than equality.
      - name: P13 C8 identity and window causality physics
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e

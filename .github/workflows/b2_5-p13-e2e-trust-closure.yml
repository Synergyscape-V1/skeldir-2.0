name: B2.5-P13 E2E Trust Closure

# B2.5-P13 proves the trust chain COMPOSES through the real machine-facing route.
# Every layer below already passes its own phase gate; what this context adds is
# the composition proof -- real PostgreSQL with RLS, the actual FastAPI route,
# the production builder and signer, and public-only verification.
#
# Not path-filtered on pull_request, deliberately. A required status check that
# is path-filtered never reports on a PR outside its paths and blocks that PR
# forever waiting for a status that cannot arrive. That defect was found in P12
# and again across P8-P11 during P13-P0; this workflow is built without it.

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/app/trust/**'
      - 'backend/app/api/trust_api.py'
      - 'backend/tests/trust/test_b25_p13_e2e_trust_closure.py'
      - 'contracts/trust-api/**'
      - '.github/workflows/b2_5-p13-e2e-trust-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b25-p13-e2e-trust-closure:
    name: B2.5-P13 E2E Trust Closure
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skeldir_b25_p13_e2e
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      SKELDIR_B25_P13_E2E_PROOF: "1"
      PGPASSWORD: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Provision database
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE skeldir_b25_p13_e2e;"
          psql -h 127.0.0.1 -U postgres -d skeldir_b25_p13_e2e -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Apply migrations
        run: alembic upgrade head

      # The composition proof. Real DB, real RLS, real route, real signer.
      - name: P13 E2E trust closure (G1-G10 composition and adversarial journeys)
        run: |
          set -o pipefail
          python -m pytest backend/tests/trust/test_b25_p13_e2e_trust_closure.py \
            -q -s --no-header | tee /tmp/b25_p13_e2e.out
          grep -E "1 passed" /tmp/b25_p13_e2e.out

          # Exact assertions, not ">= 1". A journey or tamper field that silently
          # disappears must turn this gate red rather than reduce a number nobody
          # reads. Both tamper counts are pinned, so neither a shrinking matrix nor
          # a blind field can pass.
          grep -E "^p13_missing_cases=0$" /tmp/b25_p13_e2e.out
          grep -E "^p13_executed_cases=12$" /tmp/b25_p13_e2e.out
          grep -E "^p13_tamper_fields_expected=147$" /tmp/b25_p13_e2e.out
          grep -E "^p13_tamper_fields_failed=147$" /tmp/b25_p13_e2e.out
          grep -E "^p13_load_bearing_paths=83$" /tmp/b25_p13_e2e.out
          grep -E "^p13_display_only_paths_excluded=24$" /tmp/b25_p13_e2e.out
          grep -E "^p13_downgrade_cases_failed_closed=6$" /tmp/b25_p13_e2e.out
          grep -E "^p13_negative_controls_fired=14$" /tmp/b25_p13_e2e.out
          grep -E "^p13_replay_denied=1$" /tmp/b25_p13_e2e.out
          grep -E "^p13_scope_denied=1$" /tmp/b25_p13_e2e.out
      # P13-G11: the suite must not silently lose a journey. An expected case
      # that disappears has to fail the gate rather than reduce a count nobody
      # reads, so the manifest is asserted here as well as inside the test.
      - name: P13 expected-case manifest (non-vacuity)
        run: |
          set -o pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path(
              "backend/tests/trust/test_b25_p13_e2e_trust_closure.py"
          ).read_text(encoding="utf-8")
          block = re.search(r"EXPECTED_CASE_IDS = \((.*?)\)", source, re.S)
          assert block, "EXPECTED_CASE_IDS manifest missing"
          cases = re.findall(r'"([^"]+)"', block.group(1))
          required = {
              "P13-G1-happy-path-signed-envelope",
              "P13-G2-wrong-tenant-no-existence-leak",
              "P13-G9-public-only-verification",
              "P13-G3-tamper-matrix-all-load-bearing-fields",
              "P13-G4-degraded-confidence-no-fabricated-interval",
              "P13-G5-prompt-control-quarantined",
              "P13-G6-money-source-not-authoritative",
              "P13-G7-schema-downgrade-fails-closed",
              "P13-G8-read-only-no-compute-dispatch",
              "P13-G10-audit-provenance-composition",
              "P13-H14-replay-denied-atomically",
              "P13-H15-missing-scope-denied",
          }
          missing = sorted(required - set(cases))
          assert not missing, f"required P13 journeys removed from manifest: {missing}"
          for case in cases:
              assert f'executed.append("{case}")' in source, (
                  f"case {case} is declared but never appended by the suite"
              )
          print(f"p13_expected_cases={len(cases)}")
          print("p13_manifest_integrity=ok")
          PY

      # P13-G11: failure must not be maskable, and no journey may be quietly
      # skipped. pytest reports skips and xfails in its summary line; asserting
      # their absence is the difference between "the suite ran" and "the suite
      # ran everything it claims".
      - name: P13 non-vacuity (no skips, no xfail, no failure masking)
        run: |
          set -o pipefail
          if grep -qE "skipped|xfailed|xpassed|deselected" /tmp/b25_p13_e2e.out; then
            echo "P13 suite reported skipped/xfail/deselected cases:"
            grep -E "skipped|xfailed|xpassed|deselected" /tmp/b25_p13_e2e.out
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/b2_5-p13-e2e-trust-closure.yml"
          ).read_text(encoding="utf-8")
          # A gate that can swallow its own failure is decorative. The tokens are
          # ASSEMBLED rather than written literally: spelling them out here would
          # place them inside a b2_5 workflow, and B2.5-P12's Plane D scans every
          # b2_5-*.yml for exactly these strings. Writing the scanner literally
          # made P12 red -- the failure-masking detector introduced
          # failure-masking. Assembling them keeps the check honest and keeps the
          # file clean for the layer above it.
          tokens = (
              "continue-" + "on-error: true",
              "|" + "| true",
              "exit " + "0  #",
          )
          for token in tokens:
              assert token not in workflow, f"failure masking token present: {token}"
          # `set -o pipefail` is required wherever the suite is piped to tee,
          # otherwise tee's exit status hides a failing pytest.
          assert workflow.count("set -o pipefail") >= 3, "pipefail missing from a step"
          print("p13_failure_masking_tokens=0")
          print("p13_pipefail_guarded=ok")
          PY

      # P13-G12: P13 must not weaken any earlier phase. The inherited proofs are
      # re-run here with their own negative controls rather than assumed to hold
      # because some other workflow is green.
      - name: P1-P12 preservation with P13 present
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p1_contracts.py --negative-control
          python scripts/ci/validate_b25_p1_trust_drift.py --negative-control
          python scripts/ci/validate_b25_p12_trust_isolation.py --negative-control             | tee /tmp/b25_p13_p12_iso.out
          grep -E "^B25_P12_TRUST_ISOLATION_VALIDATION_PASS$" /tmp/b25_p13_p12_iso.out
          grep -E "^isolation_negative_controls_fired=4$" /tmp/b25_p13_p12_iso.out
          python scripts/ci/validate_b25_p12_ci_gates.py --negative-control             | tee /tmp/b25_p13_p12_gates.out
          grep -E "^B25_P12_CI_GATES_VALIDATION_PASS$" /tmp/b25_p13_p12_gates.out
          grep -E "^ci_gate_negative_controls_fired=7$" /tmp/b25_p13_p12_gates.out
          echo "p13_preservation_validators_passed=4"

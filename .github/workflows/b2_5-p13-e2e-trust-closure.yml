      # NC-C9-01: splitting the feature-authority measurements back across two
      # transactions must make the exact-snapshot proof red. Without this the
      # proof cannot distinguish one snapshot from two that happened to agree.
      - name: NC-C9-01 splitting the snapshot measurement turns the gate red
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e

          grep -E "2 passed" /tmp/nc_c9_06_restored.out

      # C9: the producer C8-N proved was missing. Cardinality, not confidence --
      # these assert the four widths are the widths of the data, that a width
      # past its cap is reported as a floor rather than a count, and that an
      # authority is never written for a snapshot the producer did not observe.
      - name: P13 C9 feature-authority cardinality physics
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C9_DB_PROOF: "1"
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15

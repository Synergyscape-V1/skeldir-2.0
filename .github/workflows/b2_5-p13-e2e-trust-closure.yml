      # C8-H: the gate C7 recorded as PARTIAL. Real Beat, real non-memory
      # broker, real bayesian routing, real worker process, and a probe written
      # from inside the task body under the worker database identity.
      - name: P13 C8 live scheduler transport (Beat -> broker -> worker -> planner)
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          CELERY_BROKER_URL: sqla+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          CELERY_RESULT_BACKEND: db+postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e

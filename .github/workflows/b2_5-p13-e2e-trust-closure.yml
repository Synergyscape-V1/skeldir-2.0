          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c9-prometheus
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          cp backend/app/bayesian/feature_cardinality.py /tmp/fc_backup.py
          python - <<'PY'
          import pathlib
          p = pathlib.Path("backend/app/bayesian/feature_cardinality.py")
          s = p.read_text(encoding="utf-8")
          old = "            within_snapshot=_within,\n        )\n\n    walked = snapshot.within_snapshot_result"
          assert s.count(old) == 1, "the single-snapshot measurement point moved"
          new = (
              "        )\n"
              "    from app.db.session import get_session as _later_session\n"
              "    async with _later_session(tenant_id) as _later:\n"
              "        walked = await _within(_later)"
          )
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c9_feature_cardinality_physics.py \
              -q -s --no-header > /tmp/nc_c9_01.out 2>&1; then

          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime
          PROMETHEUS_MULTIPROC_DIR: /tmp/skeldir-p13-c9-prometheus
        run: |
          set -o pipefail
          mkdir -p "$PROMETHEUS_MULTIPROC_DIR"
          cp backend/app/tasks/bayesian.py /tmp/tasks_backup.py
          python - <<'PY'
          import pathlib
          p = pathlib.Path("backend/app/tasks/bayesian.py")
          s = p.read_text(encoding="utf-8")
          start = s.index("        except Exception as exc:  # noqa: BLE001 - containment boundary")
          end = s.index("        finally:\n            disposition = _complete_planner_wakeup(", start)
          p.write_text(s[:start] + s[end:], encoding="utf-8")
          PY
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c9_tenant_containment.py \
              -q -s --no-header > /tmp/nc_c9_06.out 2>&1; then
            echo "NC-C9-06 did not fire: a batch-aborting planner still passed"
            cp /tmp/tasks_backup.py backend/app/tasks/bayesian.py
            cat /tmp/nc_c9_06.out
            exit 1
          fi
          grep -E "failed" /tmp/nc_c9_06.out
          cp /tmp/tasks_backup.py backend/app/tasks/bayesian.py
          python -m pytest \
            backend/tests/trust/test_b25_p13_c9_tenant_containment.py \
            -q -s --no-header | tee /tmp/nc_c9_06_restored.out
          grep -E "2 passed" /tmp/nc_c9_06_restored.out

      # C9: the producer C8-N proved was missing. Cardinality, not confidence --
      # these assert the four widths are the widths of the data, that a width
      # past its cap is reported as a floor rather than a count, and that an
      # authority is never written for a snapshot the producer did not observe.
      - name: P13 C9 feature-authority cardinality physics
        env:
          DATABASE_URL: postgresql://app_worker:app_worker@127.0.0.1:5432/skeldir_b25_p13_e2e
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p13_e2e
          SKELDIR_B25_P13_C9_DB_PROOF: "1"
          SKELDIR_CELERY_WORKER_ROLE: bayesian
          SKELDIR_CELERY_INCLUDE_BAYESIAN_TASKS: "1"
          SKELDIR_BAYESIAN_DB_TOPOLOGY: direct_postgres
          SKELDIR_BAYESIAN_DB_TOPOLOGY_ATTESTATION: direct_postgres_ci_postgres15
          SKELDIR_BAYESIAN_DB_TOPOLOGY_SOURCE: github_actions_postgres_15_alpine
          SKELDIR_BAYESIAN_DB_BACKEND_AFFINITY: connection_lifetime

          cp backend/app/tasks/bayesian.py /tmp/tasks_backup.py
          python - <<'PY'
          import pathlib
          p = pathlib.Path("backend/app/tasks/bayesian.py")
          s = p.read_text(encoding="utf-8")
          start = s.index("        except Exception as exc:  # noqa: BLE001 - containment boundary")
          end = s.index("        finally:\n            disposition = _complete_planner_wakeup(", start)
          p.write_text(s[:start] + s[end:], encoding="utf-8")
          PY
          if python -m pytest \
              backend/tests/trust/test_b25_p13_c9_tenant_containment.py \
              -q -s --no-header > /tmp/nc_c9_06.out 2>&1; then
            echo "NC-C9-06 did not fire: a batch-aborting planner still passed"
            cp /tmp/tasks_backup.py backend/app/tasks/bayesian.py
            cat /tmp/nc_c9_06.out
            exit 1
          fi
          grep -E "failed" /tmp/nc_c9_06.out
          cp /tmp/tasks_backup.py backend/app/tasks/bayesian.py
          python -m pytest \
            backend/tests/trust/test_b25_p13_c9_tenant_containment.py \

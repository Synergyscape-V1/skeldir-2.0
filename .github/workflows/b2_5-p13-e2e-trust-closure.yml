  # load-bearing proof therefore cannot report the required context green.
  b25-p13-e2e-trust-closure:
    name: B2.5-P13 E2E Trust Closure
    if: always()
    needs:
      - b25-p13-e2e-trust-closure-core
      - b2-5-p13-c9-positive-confidence
      - b2-5-p13-c10-artifact-topology
      - b2-5-p13-c13-semantic-history
      - b2-5-p13-c14-semantic-authority
    runs-on: ubuntu-latest
    steps:
      - name: Require every load-bearing P13 proof
        env:
          CORE_RESULT: ${{ needs['b25-p13-e2e-trust-closure-core'].result }}
          POSITIVE_RESULT: ${{ needs['b2-5-p13-c9-positive-confidence'].result }}
          ARTIFACT_RESULT: ${{ needs['b2-5-p13-c10-artifact-topology'].result }}
          SEMANTIC_RESULT: ${{ needs['b2-5-p13-c13-semantic-history'].result }}
          COMPLETE_AUTHORITY_RESULT: ${{ needs['b2-5-p13-c14-semantic-authority'].result }}
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = success || {
            echo "b25-p13-e2e-trust-closure-core=$CORE_RESULT"; exit 1;
          }
          test "$POSITIVE_RESULT" = success || {
            echo "b2-5-p13-c9-positive-confidence=$POSITIVE_RESULT"; exit 1;
          }
          test "$ARTIFACT_RESULT" = success || {
            echo "b2-5-p13-c10-artifact-topology=$ARTIFACT_RESULT"; exit 1;
          }
          test "$SEMANTIC_RESULT" = success || {
            echo "b2-5-p13-c13-semantic-history=$SEMANTIC_RESULT"; exit 1;
          }
          test "$COMPLETE_AUTHORITY_RESULT" = success || {
            echo "b2-5-p13-c14-semantic-authority=$COMPLETE_AUTHORITY_RESULT"; exit 1;
          }
          echo 'p13_load_bearing_proof_graph=green'

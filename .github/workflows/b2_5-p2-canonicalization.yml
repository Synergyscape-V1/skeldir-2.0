name: B2.5-P2 Canonicalization

on:
  push:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "backend/app/trust/**"
      - "backend/tests/trust/**"
      - "scripts/ci/validate_b25_p2_canonicalization.py"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "Makefile"
      - ".github/workflows/b2_5-p2-canonicalization.yml"
      - "docs/ci/**"
      - "docs/forensics/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "backend/app/trust/**"
      - "backend/tests/trust/**"
      - "scripts/ci/validate_b25_p2_canonicalization.py"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "Makefile"
      - ".github/workflows/b2_5-p2-canonicalization.yml"
      - "docs/ci/**"
      - "docs/forensics/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b25-p2-canonicalization:
    name: B2.5-P2 Canonicalization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pyyaml>=6.0" "jsonschema>=4.25.0" "pytest>=7.4.0"

      - name: Validate B2.5-P1 contract authority preservation
        run: make validate-b25-p1-contracts

      - name: Validate B2.5-P1 TrustEnvelope drift tripwire
        run: make validate-b25-p1-trust-drift

      - name: Validate B2.5-P2 canonicalization and negative controls
        run: make validate-b25-p2-canonicalization

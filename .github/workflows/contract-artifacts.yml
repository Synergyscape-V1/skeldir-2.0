name: Contract Artifacts CI

# Purpose: Operationalize contract tests, mocks, and docs with hard gates
# Implements: Jamie's operational rigor + Schmidt's scientific methodology
# Sequence: Bundling -> Integrity -> Provider -> Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'api-contracts/**/*.yaml'
      - 'contracts/**/*.yaml'
      - 'backend/app/api/**/*.py'
      - 'backend/app/schemas/**/*.py'
      - 'scripts/contracts/**'
      - '.github/workflows/contract-artifacts.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'api-contracts/**/*.yaml'
      - 'contracts/**/*.yaml'
      - 'backend/app/api/**/*.py'
      - 'backend/app/schemas/**/*.py'
      - 'scripts/contracts/**'
      - '.github/workflows/contract-artifacts.yml'

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Bundle and validate contracts
  contract-bundling:
    name: Bundle & Validate Contracts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Node dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            if npm install; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "npm install failed after 5 attempts"
              exit 1
            fi
            sleep 2
          done
      
      - name: Bundle contracts
        run: bash scripts/contracts/bundle.sh
      
      - name: Upload bundled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-bundles
          path: api-contracts/dist/openapi/v1/*.bundled.yaml
          retention-days: 7
  
  # Job 2: Contract integrity tests (Schmidt's Phase B)
  contract-integrity-tests:
    name: Contract Integrity Tests (Mocks vs Contracts)
    runs-on: ubuntu-latest
    needs: contract-bundling
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-bundles
          path: api-contracts/dist/openapi/v1
      
      - name: Install Prism CLI
        run: |
          for attempt in 1 2 3 4 5; do
            if npm install -g @stoplight/prism-cli; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Prism CLI install failed after 5 attempts"
              exit 1
            fi
            sleep 2
          done
      
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      
      - name: Start mock servers
        run: bash scripts/start-mocks.sh
      
      - name: Wait for mocks to be ready
        run: sleep 5
      
      - name: Run contract integrity tests
        run: |
          cd tests/contract
          pytest test_mock_integrity.py -v --tb=short
      
      - name: Stop mock servers
        if: always()
        run: bash scripts/stop-mocks.sh || true
  
  # Job 3: Provider contract tests (Jamie's Provider Tests)
  contract-provider-tests:
    name: Provider Contract Tests (Implementation vs Contracts)
    runs-on: ubuntu-latest
    needs: contract-bundling
    # The provider tests import app.main. The B2.6-P2 XXI-F5 construction
    # authority boot guard (backend/app/main.py) verifies the schema
    # revision against a live database at startup and refuses to serve
    # (fatal, after a bounded retry window) when the database cannot
    # vouch for the build. This job previously ran with a placeholder
    # DATABASE_URL and no postgres service, so the guard's retry window
    # (~4 min) ended in construction_authority_guard_fatal:unverifiable
    # on test_contract_semantic_conformance[auth.bundled.yaml]. It now
    # provisions a real postgres service, migrates it to head, and only
    # then runs the provider tests; the boot wait remains fatal, only
    # bounded lower for CI.
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://app_user:app_user@127.0.0.1:5432/skeldir_test
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_test
      SKELDIR_CONSTRUCTION_AUTHORITY_BOOT_WAIT_S: "60"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-bundles
          path: api-contracts/dist/openapi/v1
      
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      
      - name: Provision provider-test database
        env:
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_test
          DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_test
        run: |
          python scripts/database/prepare_migration_authority_boundary.py \
            --admin-dsn postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            --database-name skeldir_test
          python -m alembic upgrade head
      
      - name: Run provider contract tests
        run: |
          cd tests/contract
          pytest test_contract_semantics.py -v --tb=short
  
  # Job 4: Documentation build and validation
  contract-docs:
    name: Build & Validate Documentation
    runs-on: ubuntu-latest
    needs: contract-bundling
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git SHA
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Node dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            if npm install; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "npm install failed after 5 attempts"
              exit 1
            fi
            sleep 2
          done
      
      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-bundles
          path: api-contracts/dist/openapi/v1
      
      - name: Install Python dependencies (for validation)
        run: pip install pyyaml
      
      - name: Build documentation
        run: bash scripts/contracts/build_docs.sh
      
      - name: Validate documentation
        run: python scripts/contracts/validate_docs.py
      
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: api-contracts/dist/docs/v1/
          retention-days: 30
  
  # Summary job: Report overall status
  contract-artifacts-status:
    name: Contract Artifacts Status
    runs-on: ubuntu-latest
    needs: [contract-bundling, contract-integrity-tests, contract-provider-tests, contract-docs]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "Contract Artifacts CI Status:"
          echo "  Bundling: ${{ needs.contract-bundling.result }}"
          echo "  Integrity Tests: ${{ needs.contract-integrity-tests.result }}"
          echo "  Provider Tests: ${{ needs.contract-provider-tests.result }}"
          echo "  Documentation: ${{ needs.contract-docs.result }}"
          
          if [[ "${{ needs.contract-bundling.result }}" != "success" ]] || \
             [[ "${{ needs.contract-integrity-tests.result }}" != "success" ]] || \
             [[ "${{ needs.contract-provider-tests.result }}" != "success" ]] || \
             [[ "${{ needs.contract-docs.result }}" != "success" ]]; then
            echo ""
            echo "Contract artifacts pipeline FAILED"
            echo ""
            echo "Failure interpretation:"
            if [[ "${{ needs.contract-bundling.result }}" != "success" ]]; then
              echo "  - Bundling failed: Invalid OpenAPI syntax or bundling errors"
            fi
            if [[ "${{ needs.contract-integrity-tests.result }}" != "success" ]]; then
              echo "  - Integrity tests failed: Contract examples violate their own schemas"
              echo "    -> Action: Fix contract examples in source YAML files"
            fi
            if [[ "${{ needs.contract-provider-tests.result }}" != "success" ]]; then
              echo "  - Provider tests failed: Implementation diverges from contracts"
              echo "    -> Action: Fix FastAPI implementation to match contracts"
            fi
            if [[ "${{ needs.contract-docs.result }}" != "success" ]]; then
              echo "  - Documentation failed: Unable to build or validate docs"
              echo "    -> Action: Check Redocly CLI errors or validation output"
            fi
            exit 1
          else
            echo ""
            echo "Contract artifacts pipeline PASSED"
            echo ""
            echo "All gates passed:"
            echo "  - Contracts bundled and validated"
            echo "  - Mock servers serve contract-compliant responses"
            echo "  - Implementation conforms to contracts"
            echo "  - Documentation built and validated"
          fi


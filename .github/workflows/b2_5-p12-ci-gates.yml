name: B2.5-P12 CI Gates

# B2.5-P12 is the epistemic enforcement layer over B2.5.
#
# It deliberately does NOT re-run every P1-P11 suite. Those phases own required
# contexts of their own; duplicating them here would add CI cost without adding
# epistemic value (directive P12-H24). P12 contributes the proofs no phase owned:
#
#   Plane A/B  contract projection - what the server emits vs what it publishes
#   Plane A/B  trust-path isolation - transitive imports, dynamic imports,
#              runtime module trace, compute-dispatch surfaces
#   Plane D    CI meta-validation - proof that the above actually execute
#
# Path triggers are authoritative: docs/ci/b25_p12_invariant_registry.yaml lists
# every load-bearing file, and the Plane D validator fails if any listed path is
# missing from the triggers below. Adding a trust file without adding its path
# here makes CI red rather than silently skipping the gate.

on:
  # Deliberately NOT path-filtered. This context is a REQUIRED status check;
  # a required check that is path-filtered never reports on a PR outside its
  # paths, and GitHub blocks that PR forever waiting for a result that cannot
  # arrive. The push trigger below keeps its paths, which is what Plane D
  # reads for path-trigger integrity.
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'contracts/trust-api/**'
      - 'backend/app/trust/**'
      - 'backend/app/confidence_projection/**'
      - 'backend/app/api/trust_api.py'
      - 'backend/app/api/trust_export.py'
      - 'backend/app/api/export.py'
      - 'backend/tests/trust/**'
      - 'scripts/ci/validate_b25_p12_contract_projection.py'
      - 'scripts/ci/validate_b25_p12_trust_isolation.py'
      - 'scripts/ci/validate_b25_p12_ci_gates.py'
      - 'docs/ci/b25_p12_invariant_registry.yaml'
      - '.github/workflows/b2_5-p12-ci-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b25-p12-ci-gates:
    name: B2.5-P12 CI Gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p12_ci
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pyyaml>=6.0" "jsonschema>=4.25.0" "referencing>=0.36.0"

      # Plane A/B: what the server emits must validate against what it publishes.
      # This is the composition whose absence let the v2-runtime/v1-contract
      # defect survive every phase-local validator.
      - name: P12-P0 contract projection (live response vs published schema)
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p12_contract_projection.py --negative-control | tee /tmp/b25_p12_projection.out
          grep -E "^B25_P12_CONTRACT_PROJECTION_VALIDATION_PASS$" /tmp/b25_p12_projection.out
          grep -E "^active_artifact_schema=export-artifact\.v2\.yaml$" /tmp/b25_p12_projection.out
          grep -E "^response_schema_composition_controls_passed=2$" /tmp/b25_p12_projection.out
          grep -E "^protocol_lifecycle_controls_passed=2$" /tmp/b25_p12_projection.out
          grep -E "^example_lifecycle_controls_passed=3$" /tmp/b25_p12_projection.out
          grep -E "^runtime_registry_controls_passed=2$" /tmp/b25_p12_projection.out
          grep -E "^projection_negative_controls_fired=3$" /tmp/b25_p12_projection.out

      # Plane A/B: static graph, dynamic imports, runtime module trace, dispatch.
      - name: P12 trust-path isolation (static + dynamic + runtime)
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p12_trust_isolation.py --negative-control | tee /tmp/b25_p12_isolation.out
          grep -E "^B25_P12_TRUST_ISOLATION_VALIDATION_PASS$" /tmp/b25_p12_isolation.out
          grep -E "^no_llm_reachability_controls_passed=[1-9][0-9]*$" /tmp/b25_p12_isolation.out
          grep -E "^dynamic_import_controls_passed=[1-9][0-9]*$" /tmp/b25_p12_isolation.out
          grep -E "^compute_dispatch_controls_passed=[1-9][0-9]*$" /tmp/b25_p12_isolation.out
          grep -E "^runtime_trace_paths_exercised=7$" /tmp/b25_p12_isolation.out
          grep -E "^isolation_negative_controls_fired=4$" /tmp/b25_p12_isolation.out

      # The fresh-interpreter trace is also invoked directly, not only as a
      # subprocess of the validator above. Registering it as a named step in the
      # enforcer registry while leaving it unreachable from any workflow would be
      # the exact existence-vs-invocation overclaim P13-P0 exists to remove.
      - name: P12 runtime module trace (fresh interpreter, import-time observable)
        run: |
          set -o pipefail
          python scripts/ci/_b25_p12_runtime_trace.py | tee /tmp/b25_p12_runtime_trace.out
          python - <<'PY'
          import json
          report = json.loads(open("/tmp/b25_p12_runtime_trace.out").read().strip().splitlines()[-1])
          assert not report["error"], f"runtime trace error: {report['error']}"
          assert not report["forbidden_modules_loaded"], (
              f"forbidden modules resident after trust paths: {report['forbidden_modules_loaded']}"
          )
          assert len(report["executed_paths"]) == 7, report["executed_paths"]
          print("runtime_trace_forbidden_modules_loaded=0")
          print(f"runtime_trace_executed_paths={len(report['executed_paths'])}")
          PY

      # Plane D: prove the proofs above actually run and cannot be evaded.
      - name: P12 CI meta-validation (Plane D non-vacuity)
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p12_ci_gates.py --negative-control | tee /tmp/b25_p12_gates.out
          grep -E "^B25_P12_CI_GATES_VALIDATION_PASS$" /tmp/b25_p12_gates.out
          grep -E "^required_invariants=22$" /tmp/b25_p12_gates.out
          grep -E "^registry_completeness_controls_passed=22$" /tmp/b25_p12_gates.out
          grep -E "^path_trigger_controls_passed=[1-9][0-9]*$" /tmp/b25_p12_gates.out
          grep -E "^failure_masking_controls_passed=[1-9][0-9]*$" /tmp/b25_p12_gates.out
          grep -E "^gate_invocation_controls_passed=[1-9][0-9]*$" /tmp/b25_p12_gates.out
          grep -E "^context_stability_controls_passed=2$" /tmp/b25_p12_gates.out
          grep -E "^inherited_binding_controls_passed=22$" /tmp/b25_p12_gates.out
          grep -E "^detector_self_protection_controls_passed=22$" /tmp/b25_p12_gates.out
          grep -E "^ci_gate_negative_controls_fired=7$" /tmp/b25_p12_gates.out

      # P12-G9: P12 enforces architecture; it must not redefine it. The inherited
      # contract/drift gates must still hold with the v2 schema in place.
      - name: P1-P11 preservation (contract authority and drift)
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p1_contracts.py --negative-control
          python scripts/ci/validate_b25_p1_trust_drift.py --negative-control

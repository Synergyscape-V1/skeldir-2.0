name: B2.5-P3 Text Disposition

on:
  merge_group:
  push:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "backend/app/trust/**"
      - "backend/app/confidence_projection/**"
      - "backend/tests/trust/**"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "scripts/ci/validate_b25_p2_canonicalization.py"
      - "scripts/ci/validate_b25_p3_text_disposition.py"
      - "Makefile"
      - ".github/workflows/b2_5-p3-text-disposition.yml"
      - "docs/ci/**"
      - "docs/forensics/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "backend/app/trust/**"
      - "backend/app/confidence_projection/**"
      - "backend/tests/trust/**"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "scripts/ci/validate_b25_p2_canonicalization.py"
      - "scripts/ci/validate_b25_p3_text_disposition.py"
      - "Makefile"
      - ".github/workflows/b2_5-p3-text-disposition.yml"
      - "docs/ci/**"
      - "docs/forensics/**"
  workflow_dispatch:

concurrency:
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push / merge_group: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  b25-p3-text-disposition:
    name: B2.5-P3 Text Disposition
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p3_ci
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p3_ci
      CELERY_BROKER_URL: sqla+postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p3_ci
      CELERY_RESULT_BACKEND: db+postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p3_ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pyyaml>=6.0" "jsonschema>=4.25.0" "pytest>=7.4.0"

      - name: Validate B2.5-P1 contract authority preservation
        run: make validate-b25-p1-contracts

      - name: Validate B2.5-P1 TrustEnvelope drift tripwire
        run: make validate-b25-p1-trust-drift

      - name: Run backend trust pytest
        run: python -m pytest backend/tests/trust -q

      - name: Validate B2.5-P2 canonicalization preservation
        run: make validate-b25-p2-canonicalization

      - name: Validate B2.5-P3 text disposition and negative controls
        run: make validate-b25-p3-text-disposition

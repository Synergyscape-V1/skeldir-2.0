name: CI Physics Guard

# Enforces the throughput topology described in docs/ci/CI_TOPOLOGY_PHYSICS.md.
#
# The topology only stays true if something checks it. Without this workflow a
# future phase can silently reintroduce the pathology that was removed - an
# uncancelled run holding slots for an abandoned commit, an uncached toolchain,
# or a fan-out barrier that reserialises the graph - and CI stays green while
# throughput rots.
#
# The rules are structural properties of the YAML, so a new phase inherits them
# by existing. Registering a new phase means adding its workflow; nothing here
# needs editing.

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push / merge_group: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-physics:
    name: CI Physics Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate workflow topology
        run: python scripts/ci/validate_ci_physics.py --verbose

      - name: Prove the guard is non-vacuous
        run: python scripts/ci/test_ci_physics_negative_controls.py

      # B2.5-P13 Corrective XX, Gate XX2-E. Throughput topology is not the only
      # structural property a required context can lose. A lane can execute on
      # every PR and still block nothing, which is exactly how the early-
      # validation DLQ escape reached protected main.
      - name: Validate P13 merge-blocking physics
        run: python scripts/ci/validate_p13_merge_governance.py --verbose

      - name: Prove the merge-governance validator is non-vacuous
        run: python scripts/ci/test_p13_merge_governance_negative_controls.py

name: B2.5-P7 Provenance Audit

on:
  push:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "backend/app/trust/**"
      - "backend/app/confidence_projection/**"
      - "backend/tests/trust/**"
      - "alembic/versions/007_skeldir_foundation/202607011200_b25_p7_trust_audit_provenance.py"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "scripts/ci/validate_b25_p2_canonicalization.py"
      - "scripts/ci/validate_b25_p3_text_disposition.py"
      - "scripts/ci/validate_b25_p4_money_authority.py"
      - "scripts/ci/validate_b25_p5_builder.py"
      - "scripts/ci/validate_b25_p6_reason_truth_matrix.py"
      - "scripts/ci/validate_b25_p7_provenance_audit.py"
      - "Makefile"
      - ".github/workflows/b2_5-p7-provenance-audit.yml"
      - "docs/ci/**"
      - "docs/forensics/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "backend/app/trust/**"
      - "backend/app/confidence_projection/**"
      - "backend/tests/trust/**"
      - "alembic/versions/007_skeldir_foundation/202607011200_b25_p7_trust_audit_provenance.py"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "scripts/ci/validate_b25_p2_canonicalization.py"
      - "scripts/ci/validate_b25_p3_text_disposition.py"
      - "scripts/ci/validate_b25_p4_money_authority.py"
      - "scripts/ci/validate_b25_p5_builder.py"
      - "scripts/ci/validate_b25_p6_reason_truth_matrix.py"
      - "scripts/ci/validate_b25_p7_provenance_audit.py"
      - "Makefile"
      - ".github/workflows/b2_5-p7-provenance-audit.yml"
      - "docs/ci/**"
      - "docs/forensics/**"
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  b25-p7-provenance-audit:
    name: B2.5-P7 Provenance Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p7_ci
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b25_p7_ci
      CELERY_BROKER_URL: sqla+postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p7_ci
      CELERY_RESULT_BACKEND: db+postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b25_p7_ci
      SKELDIR_B25_P7_POSTGRES_PROOF: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install "pyyaml>=6.0" "jsonschema>=4.25.0" "pytest>=7.4.0" "psycopg2-binary>=2.9.9"

      - name: Prepare PostgreSQL proof database
        uses: ./.github/actions/setup-postgres-ci
        with:
          database-name: skeldir_b25_p7_ci

      - name: Run backend trust pytest
        run: |
          python -m pytest backend/tests/trust -q
          python -m pytest backend/tests/trust/test_b25_p7_provenance_audit.py::test_postgres_audit_durability_survives_caller_rollback -q

      - name: Validate B2.5-P1 contract authority preservation
        run: make validate-b25-p1-contracts

      - name: Validate B2.5-P1 TrustEnvelope drift tripwire
        run: make validate-b25-p1-trust-drift

      - name: Validate B2.5-P2 canonicalization preservation
        run: make validate-b25-p2-canonicalization

      - name: Validate B2.5-P3 text disposition preservation
        run: make validate-b25-p3-text-disposition

      - name: Validate B2.5-P4 money authority preservation
        run: make validate-b25-p4-money-authority

      - name: Validate B2.5-P5 builder preservation
        run: make validate-b25-p5-builder

      - name: Validate B2.5-P6 reason truth matrix preservation
        run: make validate-b25-p6-reason-truth-matrix

      - name: Validate B2.5-P7 provenance audit
        run: |
          set -o pipefail
          python scripts/ci/validate_b25_p7_provenance_audit.py --negative-control --skip-prior-phase-subprocesses | tee /tmp/b25_p7_provenance_audit.out
          grep -E '^rollback_witness_canary_controls_passed=[1-9][0-9]*$' /tmp/b25_p7_provenance_audit.out
          grep -E '^caller_transaction_rollback_observed_controls_passed=[1-9][0-9]*$' /tmp/b25_p7_provenance_audit.out
          grep -E '^static_sentinel_created_at_rejection_controls_passed=[1-9][0-9]*$' /tmp/b25_p7_provenance_audit.out
          grep -E '^created_at_source_authority_controls_passed=[1-9][0-9]*$' /tmp/b25_p7_provenance_audit.out

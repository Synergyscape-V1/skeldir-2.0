name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  ADJUDICATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Single git checkout - Schmidt's key requirement
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADJUDICATED_SHA }}
          fetch-depth: 0  # Full history for versioning
      - name: Adjudication SHA check
        run: |
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "MERGE_SHA=${{ github.event.pull_request.merge_commit_sha }}"
          echo "GITHUB_SHA=${{ github.sha }}"
          echo "ADJUDICATED_SHA=${{ env.ADJUDICATED_SHA }}"
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ env.ADJUDICATED_SHA }}"
      - name: Evidence placement check
        run: |
          python3 scripts/check_evidence_placement.py

  governance-guardrails:
    name: Governance Guardrails
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADJUDICATED_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enforce Postgres-only dependencies
        run: |
          python scripts/ci/enforce_postgres_only.py

      - name: Enforce forensics INDEX governance
        run: |
          python scripts/ci/enforce_forensics_index.py

      - name: Enforce main branch required status checks
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
          REQUIRED_STATUS_CHECKS_CONTRACT: contracts-internal/governance/b03_phase2_required_status_checks.main.json
        run: |
          python scripts/ci/enforce_required_status_checks.py

      - name: Enforce branch protection integrity (approval + admin enforcement)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python scripts/ci/enforce_branch_protection_integrity.py
          else
            python scripts/ci/enforce_branch_protection_integrity.py --allow-api-unavailable
          fi
          python scripts/ci/enforce_branch_protection_integrity.py --run-negative-control

  contract-semantic-drift-gate:
    name: Contract Semantic Drift Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [checkout, validate-contracts, b21-p2-strategy-kernel-session-boundary, b21-p4-queue-isolation-performance-lock, b22-p5-webhook-latency-adjudication]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_b22_p2_ci
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b22_p2_ci
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      SKELDIR_B22_P2_REQUIRE_DB_PROOFS: "1"
      SKELDIR_B22_P3_REQUIRE_DB_PROOFS: "1"
      SKELDIR_B22_P4_REQUIRE_DB_PROOFS: "1"
      SKELDIR_B22_P5_REQUIRE_DB_PROOFS: "1"
      SKELDIR_B23_P2_REQUIRE_DB_PROOFS: "1"
      TESTING: "1"
      PLATFORM_TOKEN_ENCRYPTION_KEY: test-platform-key
      CI: "true"
    steps:
      - name: Enforce prerequisite adjudication success
        env:
          CHECKOUT_RESULT: ${{ needs.checkout.result }}
          VALIDATE_CONTRACTS_RESULT: ${{ needs.validate-contracts.result }}
          B21_P2_RESULT: ${{ needs.b21-p2-strategy-kernel-session-boundary.result }}
          B21_P4_RESULT: ${{ needs.b21-p4-queue-isolation-performance-lock.result }}
          B22_P5_RESULT: ${{ needs.b22-p5-webhook-latency-adjudication.result }}
        run: |
          test "$CHECKOUT_RESULT" = "success"
          test "$VALIDATE_CONTRACTS_RESULT" = "success"
          test "$B21_P2_RESULT" = "success"
          test "$B21_P4_RESULT" = "success"
          test "$B22_P5_RESULT" = "success"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADJUDICATED_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend test dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Prepare B2.2-P2 runtime proof authority boundary
        run: |
          python scripts/database/prepare_migration_authority_boundary.py \
            --admin-dsn "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            --database-name "skeldir_b22_p2_ci" \
            --runtime-user "app_user" \
            --runtime-password "app_user" \
            --migration-user "migration_owner" \
            --migration-password "migration_owner"

      - name: Run migrations for B2.2-P2 authoritative runtime proofs
        env:
          DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b22_p2_ci
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b22_p2_ci
        run: |
          alembic upgrade head

      - name: Enforce B1.7-P1 explanation authority lock
        run: |
          python scripts/ci/enforce_b17_p0_explanation_surface_lock.py

      - name: Enforce B2.1-P0 authority convergence lock
        run: |
          python scripts/ci/enforce_b21_p0_authority_convergence.py

      - name: Run B2.1-P0 authority convergence negative controls
        run: |
          pytest backend/tests/test_b21_p0_authority_convergence_enforcer.py -q

      - name: Enforce B2.1-P1 semantic replay lock
        run: |
          python scripts/ci/enforce_b21_p1_semantic_replay_lock.py

      - name: Run B2.1-P1 semantic replay lock negative controls
        run: |
          pytest backend/tests/test_b21_p1_semantic_replay_lock_enforcer.py -q

      - name: Enforce B2.1-P2 strategy kernel lock
        run: |
          python scripts/ci/enforce_b21_p2_strategy_kernel_lock.py

      - name: Run B2.1-P2 strategy kernel lock negative controls
        run: |
          pytest backend/tests/test_b21_p2_strategy_kernel_lock_enforcer.py -q

      - name: Enforce B2.1-P3 persistence read-surface lock
        run: |
          python scripts/ci/enforce_b21_p3_persistence_read_surface_lock.py

      - name: Run B2.1-P3 persistence read-surface negative controls
        run: |
          pytest backend/tests/test_b21_p3_persistence_read_surface_lock_enforcer.py -q

      - name: Enforce B2.1-P4 queue isolation and performance semantics lock
        run: |
          python scripts/ci/enforce_b21_p4_queue_isolation_semantics_lock.py

      - name: Run B2.1-P4 queue isolation negative controls
        run: |
          pytest backend/tests/test_b21_p4_queue_isolation_semantics_lock_enforcer.py -q

      - name: Run B2.1-P4 benchmark adjudication negative controls
        run: |
          pytest backend/tests/test_b21_p4_benchmark_adjudication_enforcer.py -q

      - name: Enforce B2.1-P5 non-vacuous proof harness adjudication lock
        run: |
          python scripts/ci/enforce_b21_p5_nonvacuous_adjudication.py

      - name: Run B2.1-P5 non-vacuous adjudication negative controls
        run: |
          pytest backend/tests/test_b21_p5_nonvacuous_adjudication_enforcer.py -q

      - name: Enforce B2.1-P6 full-chain closure and downstream-readiness lock
        run: |
          python scripts/ci/enforce_b21_p6_full_chain_closure.py

      - name: Run B2.1-P6 closure negative controls
        run: |
          pytest backend/tests/test_b21_p6_full_chain_closure_enforcer.py -q

      - name: Run B1.7-P1 negative controls
        run: |
          pytest backend/tests/test_b17_p0_explanation_surface_lock_enforcer.py -q

      - name: Enforce B1.7-P4 strategy closure lock
        run: |
          python scripts/ci/enforce_b17_p4_strategy_closure.py

      - name: Run B1.7-P4 negative controls
        run: |
          pytest backend/tests/test_b17_p4_strategy_closure_enforcer.py -q

      - name: Enforce B1.7-P5 merge-blocking adjudication lock
        run: |
          python scripts/ci/enforce_b17_p5_merge_blocking_adjudication.py

      - name: Run B1.7-P5 negative controls
        run: |
          pytest backend/tests/test_b17_p5_merge_blocking_adjudication_enforcer.py -q

      - name: Enforce B1.7-P6 adjudication plane lock
        run: |
          python scripts/ci/enforce_b17_p6_adjudication_plane.py

      - name: Run B1.7-P6 adjudication plane negative controls
        run: |
          pytest backend/tests/test_b17_p6_adjudication_plane_enforcer.py -q
          pytest backend/tests/test_b17_p6_benchmark_adjudication_enforcer.py -q

      - name: Enforce B2.2-P0 webhook declared surface lock
        run: |
          python scripts/ci/enforce_b22_p0_webhook_surface_lock.py

      - name: Run B2.2-P0 webhook declared surface negative controls
        run: |
          pytest backend/tests/test_b22_p0_webhook_surface_lock_enforcer.py -q

      - name: Enforce B2.2-P1 authenticity semantics lock
        run: |
          python scripts/ci/enforce_b22_p1_authenticity_semantics_lock.py

      - name: Run B2.2-P1 authenticity semantics negative controls
        run: |
          pytest backend/tests/test_b22_p1_authenticity_semantics_lock_enforcer.py -q

      - name: Run B2.2-P1 authenticity semantics proofs
        run: |
          pytest backend/tests/test_b22_p1_authenticity_semantics.py -q
          pytest backend/tests/test_b12_p8_error_contract_normalization.py::test_eg83_paypal_hmac_failure_variants_share_non_leaky_problem_contract backend/tests/test_b12_p8_error_contract_normalization.py::test_eg8cf_paypal_constant_work_unknown_key_and_known_bad_signature_both_invoke_compute backend/tests/test_b12_p8_error_contract_normalization.py::test_eg8route_stripe_alias_and_canonical_auth_failures_are_equivalent -q

      - name: Enforce B2.2-P2 post-auth privacy boundary lock
        run: |
          python scripts/ci/enforce_b22_p2_post_auth_privacy_boundary.py

      - name: Run B2.2-P2 post-auth privacy boundary negative controls
        run: |
          pytest backend/tests/test_b22_p2_post_auth_privacy_boundary_enforcer.py -q

      - name: Run B2.2-P2 post-auth privacy boundary runtime proofs
        run: |
          pytest backend/tests/test_b22_p2_post_auth_privacy_boundary.py -q

      - name: Enforce B2.2-P3 canonical identity envelope lock
        run: |
          python scripts/ci/enforce_b22_p3_canonical_commerce_identity_envelope.py

      - name: Run B2.2-P3 canonical identity envelope negative controls
        run: |
          pytest backend/tests/test_b22_p3_canonical_identity_envelope_enforcer.py -q

      - name: Run B2.2-P3 canonical identity envelope runtime proofs
        run: |
          pytest backend/tests/test_b22_p3_canonical_identity_envelope.py -q

      - name: Enforce B2.2-P4 idempotent ACK + orchestration lock
        run: |
          python scripts/ci/enforce_b22_p4_idempotent_ack_orchestration.py

      - name: Run B2.2-P4 idempotent ACK + orchestration negative controls
        run: |
          pytest backend/tests/test_b22_p4_idempotent_ack_orchestration_enforcer.py -q

      - name: Run B2.2-P4 idempotent ACK + orchestration runtime proofs
        run: |
          pytest backend/tests/test_b22_p4_idempotent_ack_orchestration.py -q

      - name: Enforce B2.2-P5 performance semantics + negative-control lock
        run: |
          python scripts/ci/enforce_b22_p5_performance_negative_control_lock.py

      - name: Run B2.2-P5 structural negative controls
        run: |
          pytest backend/tests/test_b22_p5_performance_negative_control_lock_enforcer.py -q

      - name: Run B2.2-P5 runtime negative-control + parity proofs
        run: |
          pytest backend/tests/test_b22_p5_performance_negative_controls.py -q

      - name: Run B2.2-P5 benchmark adjudication negative controls
        run: |
          pytest backend/tests/test_b22_p5_webhook_benchmark_adjudication_enforcer.py -q

      - name: Enforce B2.3-P0 typed-boundary source alignment
        run: |
          python scripts/ci/enforce_b23_p0_typed_boundary_source_alignment.py

      - name: Run B2.3-P0 typed-boundary source alignment negative controls
        run: |
          pytest backend/tests/test_b23_p0_typed_boundary_source_alignment_enforcer.py -q

      - name: Enforce B2.3-P0 semantic authority freeze
        run: |
          python scripts/ci/enforce_b23_p0_semantic_authority_freeze.py

      - name: Run B2.3-P0 semantic authority freeze negative controls
        run: |
          pytest backend/tests/test_b23_p0_semantic_authority_freeze_enforcer.py -q

      - name: Run B2.3-P0 semantic authority runtime proofs
        run: |
          pytest backend/tests/test_b23_p0_semantic_authority.py -q

      - name: Enforce B2.3 Pre-P1 specification closure
        run: |
          python scripts/ci/enforce_b23_pre_p1_spec_gate.py

      - name: Run B2.3 Pre-P1 specification closure negative controls
        run: |
          pytest backend/tests/test_b23_pre_p1_spec_gate_enforcer.py -q

      - name: Enforce B2.3-P1 schema authority lock
        run: |
          python scripts/ci/enforce_b23_p1_schema_authority_lock.py

      - name: Run B2.3-P1 schema authority negative controls
        run: |
          pytest backend/tests/test_b23_p1_schema_authority_enforcer.py -q

      - name: Run B2.3-P1 schema authority runtime proofs
        run: |
          pytest backend/tests/test_b23_p1_schema_authority_runtime.py -q

      - name: Verify B2.3-P1 migration reversibility
        env:
          B23_P1_MIGRATION_DSN: ${{ env.MIGRATION_DATABASE_URL }}
        run: |
          python scripts/ci/verify_b23_p1_migration_reversibility.py

      - name: Enforce B2.3-P2 match-engine kernel lock
        run: |
          python scripts/ci/enforce_b23_p2_match_engine_kernel.py

      - name: Run B2.3-P2 match-engine kernel negative controls
        run: |
          pytest backend/tests/test_b23_p2_match_engine_kernel_enforcer.py -q

      - name: Verify B2.3-P2 runtime DB proof-lock prerequisites
        env:
          SKELDIR_B23_P2_REQUIRE_DB_PROOFS: "1"
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          if os.environ.get("SKELDIR_B23_P2_REQUIRE_DB_PROOFS") != "1":
              raise SystemExit("B2.3-P2 runtime DB proof-lock requires SKELDIR_B23_P2_REQUIRE_DB_PROOFS=1.")

          dsn = os.environ.get("DATABASE_URL")
          if not dsn:
              raise SystemExit("B2.3-P2 runtime DB proof-lock requires DATABASE_URL.")

          engine = create_engine(dsn)
          with engine.connect() as conn:
              conn.execute(text("SELECT 1"))
              required_tables = (
                  "b23_match_verdicts",
                  "b23_exception_records",
                  "b23_revenue_events",
                  "b23_webhook_ingestion_logs",
              )
              for table_name in required_tables:
                  regclass = conn.execute(
                      text("SELECT to_regclass(:qualified_name)"),
                      {"qualified_name": f"public.{table_name}"},
                  ).scalar_one()
                  if regclass is None:
                      raise SystemExit(
                          f"B2.3-P2 runtime DB proof-lock missing required table: {table_name}"
                      )

          print("B2.3-P2 runtime DB proof-lock preflight passed")
          PY

      - name: Run B2.3-P2 match-engine kernel runtime proofs
        env:
          SKELDIR_B23_P2_REQUIRE_DB_PROOFS: "1"
        run: |
          mkdir -p artifacts
          pytest backend/tests/test_b23_p2_match_engine_kernel.py -q -rA --junitxml=artifacts/b23_p2_runtime_proofs.junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("artifacts/b23_p2_runtime_proofs.junit.xml")
          skipped = sum(1 for testcase in report.iter("testcase") if testcase.find("skipped") is not None)
          if skipped > 0:
              raise SystemExit(f"B2.3-P2 runtime proofs reported skipped tests: {skipped}")
          print("B2.3-P2 runtime proofs executed with zero skips.")
          PY

      - name: Enforce B2.3-P3 verdict persistence authority
        run: |
          python scripts/ci/enforce_b23_p3_verdict_persistence.py

      - name: Run B2.3-P3 verdict persistence negative controls
        run: |
          pytest backend/tests/test_b23_p3_verdict_persistence_enforcer.py -q

      - name: Verify B2.3-P3 runtime DB proof-lock prerequisites
        env:
          SKELDIR_B23_P3_REQUIRE_DB_PROOFS: "1"
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          if os.environ.get("SKELDIR_B23_P3_REQUIRE_DB_PROOFS") != "1":
              raise SystemExit("B2.3-P3 runtime DB proof-lock requires SKELDIR_B23_P3_REQUIRE_DB_PROOFS=1.")
          dsn = os.environ.get("DATABASE_URL")
          if not dsn:
              raise SystemExit("B2.3-P3 runtime DB proof-lock requires DATABASE_URL.")

          engine = create_engine(dsn)
          with engine.connect() as conn:
              conn.execute(text("SELECT 1"))
              for table_name in (
                  "b23_match_verdicts",
                  "b23_exception_records",
                  "b23_revenue_events",
                  "b23_webhook_ingestion_logs",
              ):
                  regclass = conn.execute(
                      text("SELECT to_regclass(:qualified_name)"),
                      {"qualified_name": f"public.{table_name}"},
                  ).scalar_one()
                  if regclass is None:
                      raise SystemExit(f"B2.3-P3 runtime DB proof-lock missing required table: {table_name}")
              correction_column = conn.execute(
                  text(
                      """
                      SELECT 1
                      FROM information_schema.columns
                      WHERE table_schema = 'public'
                        AND table_name = 'b23_revenue_events'
                        AND column_name = 'is_gross_capture_correction'
                      """
                  )
              ).scalar_one_or_none()
              if correction_column is None:
                  raise SystemExit("B2.3-P3 missing is_gross_capture_correction column.")
          print("B2.3-P3 runtime DB proof-lock preflight passed")
          PY

      - name: Run B2.3-P3 verdict persistence runtime proofs
        env:
          SKELDIR_B23_P3_REQUIRE_DB_PROOFS: "1"
        run: |
          mkdir -p artifacts
          pytest backend/tests/test_b23_p3_verdict_persistence.py -q -rA --junitxml=artifacts/b23_p3_runtime_proofs.junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("artifacts/b23_p3_runtime_proofs.junit.xml")
          skipped = sum(1 for testcase in report.iter("testcase") if testcase.find("skipped") is not None)
          if skipped > 0:
              raise SystemExit(f"B2.3-P3 runtime proofs reported skipped tests: {skipped}")
          print("B2.3-P3 runtime proofs executed with zero skips.")
          PY

      - name: Enforce contract semantic drift gate
        run: |
          pytest tests/contract/test_contract_semantics.py tests/contract/test_b15_p2_contract_addendum.py -q

  b21-p0-runtime-authority-closeout:
    name: B2.1-P0 Runtime Authority Closeout
    runs-on: ubuntu-latest
    needs: [checkout]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://app_user:app_user@127.0.0.1:5432/skeldir_b21_p0
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b21_p0
      EXPECTED_RUNTIME_DB_USER: app_user
      ENFORCE_RUNTIME_IDENTITY_PARITY: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      TESTING: "1"
      PLATFORM_TOKEN_ENCRYPTION_KEY: test-platform-key
      CONTRACT_TESTING: "0"
      CI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADJUDICATED_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Prepare B2.1-P0 runtime closeout authority boundary
        run: |
          python scripts/database/prepare_migration_authority_boundary.py \
            --admin-dsn "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            --database-name "skeldir_b21_p0" \
            --runtime-user "app_user" \
            --runtime-password "app_user" \
            --migration-user "migration_owner" \
            --migration-password "migration_owner" \
            --app-rw-role "app_rw" \
            --app-ro-role "app_ro"

      - name: Apply migrations using formal migration authority
        env:
          DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b21_p0
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b21_p0
        run: |
          alembic upgrade head

      - name: Enforce migration metadata least privilege boundary
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d skeldir_b21_p0 -c "REVOKE ALL ON TABLE public.alembic_version FROM app_user;"

      - name: Run B2.1-P0 closeout runtime authority proofs
        run: |
          pytest backend/tests/integration/test_b21_p0_runtime_authority_closeout.py -q

  b21-p1-semantic-replay-lock:
    name: B2.1-P1 Semantic Replay Lock
    runs-on: ubuntu-latest
    needs: [checkout]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://app_user:app_user@127.0.0.1:5432/skeldir_b21_p1
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b21_p1
      EXPECTED_RUNTIME_DB_USER: app_user
      ENFORCE_RUNTIME_IDENTITY_PARITY: "1"
      ATTRIBUTION_DETERMINISTIC_DEFAULT_LOOKBACK_DAYS: "30"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      TESTING: "1"
      CONTRACT_TESTING: "0"

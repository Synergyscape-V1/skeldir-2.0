      PLATFORM_TOKEN_KEY_ID: test-key
      GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADJUDICATED_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install B1.4-P7 dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Apply migrations
        run: |
          alembic upgrade head

      - name: Execute B1.4-P7 enforcer negative control
        run: |
          if python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py --simulate-regression; then
            echo "expected B1.4-P7 regression simulation to fail"
            exit 1
          fi

      - name: Enforce B1.4-P7 structure
        run: |
          python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py

      - name: Run B1.4-P7 final composed runtime proofs
        run: |
          mkdir -p artifacts/b14_p7
          pytest backend/tests/integration/test_b14_p7_e2e_privacy_system_proofs.py -q -rs --junitxml=artifacts/b14_p7/junit.runtime.xml | tee artifacts/b14_p7/runtime.log

      - name: Capture B1.4-P7 branch-protection evidence
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python scripts/ci/capture_b14_p7_branch_protection_evidence.py \
              --output artifacts/b14_p7/p7_branch_protection_evidence.json \
              --required-status-output artifacts/b14_p7/p7_required_status_checks_live.json \
              --branch-protection-output artifacts/b14_p7/p7_branch_protection_live.json \
              --require-live
          else
            python scripts/ci/capture_b14_p7_branch_protection_evidence.py \
              --output artifacts/b14_p7/p7_branch_protection_evidence.json \
              --required-status-output artifacts/b14_p7/p7_required_status_checks_live.json \
              --branch-protection-output artifacts/b14_p7/p7_branch_protection_live.json
          fi

      - name: Attach legal/compliance sign-off artifact
        run: |
          cp docs/forensics/legal/b14_p7_legal_compliance_signoff.json artifacts/b14_p7/p7_legal_signoff.json

      - name: Verify B1.4-P7 artifact scanner non-vacuity and no-leak hygiene
        run: |
          if python scripts/ci/scan_b14_p7_artifacts.py --simulate-regression; then
            echo "expected scanner regression simulation to fail"
            exit 1
          fi
          mkdir -p artifacts/b14_p7/privacy_bundle
          cp artifacts/b14_p7/p7_composed_runtime_report.json artifacts/b14_p7/privacy_bundle/
          cp artifacts/b14_p7/p7_negative_controls_report.json artifacts/b14_p7/privacy_bundle/
          cp artifacts/b14_p7/p7_branch_protection_evidence.json artifacts/b14_p7/privacy_bundle/
          for optional in \
            artifacts/b14_p7/p7_required_status_checks_live.json \
            artifacts/b14_p7/p7_branch_protection_live.json
          do
            if [ -f "$optional" ]; then
              cp "$optional" artifacts/b14_p7/privacy_bundle/
            fi
          done
          cp artifacts/b14_p7/p7_legal_signoff.json artifacts/b14_p7/privacy_bundle/
          cp artifacts/b14_p7/p7_runtime_logs.txt artifacts/b14_p7/privacy_bundle/
          python scripts/ci/scan_b14_p7_artifacts.py \
            --artifacts-dir artifacts/b14_p7/privacy_bundle \
            --canary "p7_artifact_canary@test.invalid" \
            --report-json artifacts/b14_p7/p7_artifact_scan_report.json

      - name: Verify B1.4-P7 runtime proof execution and artifacts
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py \
              --require-runtime-execution \
              --require-live-branch-protection \
              --junit-xml artifacts/b14_p7/junit.runtime.xml \
              --artifacts-dir artifacts/b14_p7
          else
            python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py \
              --require-runtime-execution \
              --junit-xml artifacts/b14_p7/junit.runtime.xml \
              --artifacts-dir artifacts/b14_p7
          fi

      - name: Upload B1.4-P7 runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b14-p7-runtime-artifacts
          path: artifacts/b14_p7
          if-no-files-found: error


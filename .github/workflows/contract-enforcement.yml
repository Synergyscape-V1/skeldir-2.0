name: Contract-First Enforcement

on:
  workflow_run:
    workflows:
      - Contract Artifacts CI
    branches:
      - main
      - develop
    types:
      - completed

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push / merge_group: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Phase 1: Bundle contracts (prerequisite from B0.1)
  bundle-contracts:
    name: Fetch Contract Bundles
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download bundles from Contract Artifacts CI
        uses: actions/download-artifact@v4
        with:
          name: contract-bundles
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: api-contracts/dist/openapi/v1/
      
      - name: Verify bundles exist
        run: |
          python - <<'PY'
          import pathlib, sys
          
          dist = pathlib.Path("api-contracts/dist/openapi/v1")
          bundles = sorted(dist.glob("*.bundled.yaml"))
          
          if not bundles:
              print(f"No bundled contracts found in {dist}")
              sys.exit(1)
          
          print("Found bundled contracts:")
          for bundle in bundles:
              print(f"  - {bundle.name}")
          PY
      
      - name: Upload bundled specs
        uses: actions/upload-artifact@v4
        with:
          name: bundled-specs
          path: api-contracts/dist/openapi/v1/*.bundled.yaml
          retention-days: 1

  # Phase 2: Generate Pydantic models (prerequisite from P1)
  generate-models:
    name: Generate Pydantic Models
    runs-on: ubuntu-latest
    needs: bundle-contracts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Download bundled specs
        uses: actions/download-artifact@v4
        with:
          name: bundled-specs
          path: api-contracts/dist/openapi/v1/
      
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
      
      - name: Generate models
        run: |
          bash scripts/generate-models.sh
      
      - name: Validate critical models exist
        run: |
          python -c "from backend.app.schemas.auth import LoginRequest, LoginResponse"
          python -c "from backend.app.schemas.attribution import RealtimeRevenueResponse"
      
      - name: Upload generated models
        uses: actions/upload-artifact@v4
        with:
          name: generated-models
          path: backend/app/schemas/*.py
          retention-days: 1

  # Phase 3: Static Conformance Check (NEW - CF3)
  contract-static:
    name: Static Contract Conformance
    runs-on: ubuntu-latest
    needs: generate-models
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Download bundled specs
        uses: actions/download-artifact@v4
        with:
          name: bundled-specs
          path: api-contracts/dist/openapi/v1/
      
      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: generated-models
          path: backend/app/schemas/
      
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install pyyaml
      
      - name: Generate R-Graph (Implementation Routes)
        run: |
          python scripts/contracts/dump_routes.py
      
      - name: Generate C-Graph (Contract Operations)
        run: |
          python scripts/contracts/dump_contract_ops.py
      
      - name: Check Static Conformance
        run: |
          python scripts/contracts/check_static_conformance.py
      
      - name: Upload graphs for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-graphs
          path: |
            tmp/r_graph.json
            tmp/c_graph.json
          retention-days: 7

  # Phase 4: Dynamic Conformance Check (NEW - CF4)
  contract-dynamic:
    name: Dynamic Contract Conformance
    runs-on: ubuntu-latest
    needs: contract-static
    # The conformance tests import app.main. The B2.6-P2 XXI-F5 construction
    # authority boot guard (backend/app/main.py) verifies the schema revision
    # against a live database at startup and refuses to serve (fatal, after a
    # bounded retry window) when the database cannot vouch for the build. This
    # job previously ran with a placeholder DATABASE_URL and no postgres
    # service, so the guard's retry window ended in
    # construction_authority_guard_fatal:unverifiable on
    # test_contract_semantic_conformance[auth.bundled.yaml] (run 39313015651,
    # main 8216b6cc5). It now provisions a real postgres service, migrates it
    # to head, and only then runs the conformance tests, mirroring the
    # contract-provider-tests job in contract-artifacts.yml; the boot wait
    # remains fatal, only bounded lower for CI.
    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://app_user:app_user@127.0.0.1:5432/skeldir_test
      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_test
      SKELDIR_CONSTRUCTION_AUTHORITY_BOOT_WAIT_S: "60"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Download bundled specs
        uses: actions/download-artifact@v4
        with:
          name: bundled-specs
          path: api-contracts/dist/openapi/v1/
      
      - name: Download generated models
        uses: actions/download-artifact@v4
        with:
          name: generated-models
          path: backend/app/schemas/
      
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
      
      - name: Provision conformance database
        env:
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_test
          DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_test
        run: |
          python scripts/database/prepare_migration_authority_boundary.py \
            --admin-dsn postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            --database-name skeldir_test
          python -m alembic upgrade head
      
      - name: Run Schemathesis Contract Tests
        run: |
          cd tests/contract
          pytest test_contract_semantics.py -v --tb=short
      
      - name: Generate coverage report
        if: always()
        run: |
          cd tests/contract
          pytest test_contract_semantics.py::test_coverage_report -v -s
      
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/contract/.pytest_cache/
          retention-days: 7

  # Final: Aggregate Status
  contract-enforcement-status:
    name: Contract Enforcement Status
    runs-on: ubuntu-latest
    needs: [bundle-contracts, generate-models, contract-static, contract-dynamic]
    if: always()
    
    steps:
      - name: Check enforcement status
        run: |
          echo "Contract-First Enforcement Status:"
          echo "  - Bundle Contracts: ${{ needs.bundle-contracts.result }}"
          echo "  - Generate Models: ${{ needs.generate-models.result }}"
          echo "  - Static Conformance: ${{ needs.contract-static.result }}"
          echo "  - Dynamic Conformance: ${{ needs.contract-dynamic.result }}"
          
          if [ "${{ needs.bundle-contracts.result }}" != "success" ] || \
             [ "${{ needs.generate-models.result }}" != "success" ] || \
             [ "${{ needs.contract-static.result }}" != "success" ] || \
             [ "${{ needs.contract-dynamic.result }}" != "success" ]; then
            echo ""
            echo "❌ Contract-First Enforcement FAILED"
            echo "Implementation diverges from specification."
            echo "Review failure logs and align implementation with contracts."
            exit 1
          fi
          
          echo ""
          echo "✅ Contract-First Enforcement PASSED"
          echo "Implementation perfectly aligned with specification."



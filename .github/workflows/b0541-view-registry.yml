name: B0.5.4.1 View Registry Gates

on:
  push:
    paths:
      - 'backend/tests/test_b0541_view_registry.py'
      - 'backend/app/tasks/**'
      - 'alembic/**'
      - 'db/**'
      - '.github/workflows/b0541-view-registry.yml'
      - 'docs/ci/**'
      - 'contracts-internal/governance/b03_phase2_required_status_checks.main.json'
    branches: [main, develop]
  pull_request:
    paths:
      - 'backend/tests/test_b0541_view_registry.py'
      - 'backend/app/tasks/**'
      - 'alembic/**'
      - 'db/**'
      - '.github/workflows/b0541-view-registry.yml'
      - 'docs/ci/**'
      - 'contracts-internal/governance/b03_phase2_required_status_checks.main.json'
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  b0541-gates:
    name: B0.5.4.1 Gates (G1A/G1B/G1C)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:5432/skeldir_validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run B0.5.4.1 gate tests
        run: |
          cd backend
          pytest tests/test_b0541_view_registry.py -q

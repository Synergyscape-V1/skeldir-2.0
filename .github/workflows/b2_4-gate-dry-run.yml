      MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@127.0.0.1:5432/skeldir_b24_p4_ci
      PYTHONPATH: ${{ github.workspace }}/backend
      TESTING: "1"
      CI: "true"
      SKELDIR_B24_P4_REQUIRE_DB_PROOFS: "1"
      PLATFORM_TOKEN_ENCRYPTION_KEY: test-platform-key
      PLATFORM_TOKEN_KEY_ID: test-key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:

  b2-4-p4-postgres-runtime-proof:
    name: B2.4-P4 PostgreSQL Runtime Proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

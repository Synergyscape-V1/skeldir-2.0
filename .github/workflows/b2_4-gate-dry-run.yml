      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend and Bayesian dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-bayesian.txt
          pip install -r backend/requirements-dev.txt

      - name: Prepare B2.4-P6 CI database
        uses: ./.github/actions/setup-postgres-ci
        with:
          database-name: "skeldir_b24_p6_ci"
          migration-command: "alembic upgrade head"
          revoke-alembic-version: "false"

      - name: Run B2.4-P6 static negative controls
        run: |
          python scripts/ci/validate_b24_p6_real_fit_worker.py --negative-control

      - name: Run source-authorized real-fit worker proof
        run: |
          pytest backend/tests/test_b24_p6_real_fit_worker.py -q -rA


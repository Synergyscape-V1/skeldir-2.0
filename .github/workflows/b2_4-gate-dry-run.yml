      EXPECTED_RUNTIME_DB_USER: app_user
      PYTHONPATH: ${{ github.workspace }}/backend
      TESTING: "1"
      CI: "true"
      SKELDIR_B24_P12_REQUIRE_DB_PROOFS: "1"
      SKELDIR_B24_P12_CA1_TELEMETRY_DIR: artifacts/b24_p12_ca1
      ENFORCE_RUNTIME_IDENTITY_PARITY: "1"
      PLATFORM_TOKEN_ENCRYPTION_KEY: test-platform-key
      PLATFORM_TOKEN_KEY_ID: test-key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Prepare B2.4-P12 CI database
        uses: ./.github/actions/setup-postgres-ci
        with:
          database-name: "skeldir_b24_p12_ci"
          migration-command: "alembic upgrade head"
          revoke-alembic-version: "false"

      - name: Run B2.4-P12 static negative controls
        run: python scripts/ci/validate_b24_p12_internal_e2e.py --negative-control

      - name: Run internal E2E composition proof
        run: |
          mkdir -p artifacts/junit artifacts/b24_p12_ca1
          pytest backend/tests/test_b24_p12_internal_e2e.py -q -rA --junitxml=artifacts/junit/b24_p12_internal_e2e.xml

      - name: Upload B2.4-P12 execution artifact
        uses: actions/upload-artifact@v4
        with:
          name: b24-p11-junit-p12-internal-e2e
          path: artifacts/junit/b24_p12_internal_e2e.xml

      - name: Upload B2.4-P12 CA1 worker telemetry
        uses: actions/upload-artifact@v4
        with:
          name: b24-p12-ca1-telemetry
          path: artifacts/b24_p12_ca1/*.json

  b2-4-p11-ci-gates-and-negative-control-harness:
    name: B2.4-P11 CI Gates and Negative Control Harness
    runs-on: ubuntu-latest
    needs:
      - b2-4-gate-dry-run
      - b2-4-p5-runtime
      - b2-4-p5-postgres-runtime-proof
      - b2-4-p6-real-fit-worker-proof
      - b2-4-p7-diagnostic-semantics-proof
      - b2-4-p8-artifact-lifecycle-proof
      - b2-4-p9-worker-tenant-hygiene-proof
      - b2-4-p10-read-only-projection-proof
      - b2-4-p12-internal-e2e-proof
      - b2-4-p1-db-proof
      - b2-4-p4-postgres-runtime-proof
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install validator dependency
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0"

      - name: Download B2.4 execution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: b24-p11-junit-*
          path: artifacts/junit
          merge-multiple: true

      - name: Run P11 CI gate matrix and negative controls
        run: make validate-b24-p11-ci-gates

      - name: Validate workflow vacuity and negative controls
        run: python scripts/ci/validate_b24_p11_workflow_vacuity.py --negative-control

      - name: Validate PR-safe branch-protection state machine and negative controls
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: python scripts/ci/validate_live_branch_protection.py --mode pr --negative-control

      - name: Validate trusted main live branch protection and negative controls
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}
        run: python scripts/ci/validate_live_branch_protection.py --mode main --negative-control

      - name: Validate execution artifacts negative controls
        run: python scripts/ci/validate_b24_p11_execution_artifacts.py --negative-control --negative-control-only --summary-path ""

      - name: Write P11 command execution artifact
        run: |
          python scripts/ci/write_b24_p11_command_junit.py \
            --output artifacts/junit/b24_p11_ci_gates.xml \
            --suite b24_p11_ci_gates \
            --case validate_b24_p11_ci_gates \
            --case validate_b24_p11_workflow_vacuity \
            --case validate_live_branch_protection \
            --case validate_b24_p11_execution_artifacts \
            --case invalid_xml_negative_control \
            --case duplicate_testcase_negative_control \
            --case duplicate_required_context_negative_control \
            --case api_unreadable_negative_control \
            --case permission_denied_negative_control \
            --case subprocess_invalid_token_negative_control \
            --case subprocess_missing_token_negative_control \
            --case pr_add_context_no_deadlock_negative_control \
            --case pr_required_context_removal_negative_control \
            --case main_missing_new_required_context_negative_control \
            --case pr_token_present_negative_control

      - name: Validate downloaded execution artifacts
        run: python scripts/ci/validate_b24_p11_execution_artifacts.py --negative-control

      - name: Upload P11 execution-physical proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b24-p11-execution-physical-proof
          path: |
            artifacts/b24_p11_ci_gate_matrix.json
            artifacts/b24_p11_execution_artifacts.json
            artifacts/b24_p11_live_branch_protection.json
            artifacts/b24_p11_workflow_vacuity.json
            artifacts/junit/*.xml

      - name: Upload P11 structured proof summary
        uses: actions/upload-artifact@v4
        with:
          name: b24-p11-ci-gate-matrix
          path: artifacts/b24_p11_ci_gate_matrix.json

  b2-4-p1-db-proof:
    name: B2.4-P1 DB Proof
    runs-on: ubuntu-latest
    services:

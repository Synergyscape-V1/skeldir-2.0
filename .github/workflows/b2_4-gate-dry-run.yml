          migration-command: "alembic upgrade head"
          revoke-alembic-version: "false"

      - name: Prove deprecated profiling table is absent at head
        env:
          PGPASSWORD: migration_owner
        run: |
          psql -h 127.0.0.1 -U migration_owner -d skeldir_b24_p4_ci \
            -c "SELECT to_regclass('public.b24_p4_profiling_leases') AS deprecated_p4_profiling_leases;"


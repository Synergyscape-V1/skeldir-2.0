name: B1.7-P4 Mixed Workload Benchmark

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push / merge_group: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  b17-p4-mixed-workload-benchmark:
    name: B1.7 P4 Mixed Workload Benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      PYTHONUNBUFFERED: "1"
      TESTING: "1"
      CONTRACT_TESTING: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install benchmark dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          alembic upgrade head

      - name: Benchmark harness integrity
        run: |
          mkdir -p artifacts/b17_p4_benchmark
          python scripts/benchmarks/b17_p4_mixed_workload.py \
            --mode integrity \
            --requests 150 \
            --warm-ratio 0.80 \
            --concurrency 2 \
            --provider-delay-ms 650 \
            --allocation-pool-size 12 \
            --warm-key-space-size 90 \
            --output artifacts/b17_p4_benchmark/integrity.json

      - name: Baseline mixed-workload (prewarm disabled)
        run: |
          python scripts/benchmarks/b17_p4_mixed_workload.py \
            --mode measure \
            --requests 150 \
            --warm-ratio 0.80 \
            --concurrency 2 \
            --provider-delay-ms 150 \
            --prewarm-enabled false \
            --prewarm-run-sync false \
            --allocation-pool-size 12 \
            --warm-key-space-size 90 \
            --output artifacts/b17_p4_benchmark/baseline_no_prewarm.json

      - name: Mixed-workload with bounded event-driven prewarm
        run: |
          python scripts/benchmarks/b17_p4_mixed_workload.py \
            --mode measure \
            --requests 150 \
            --warm-ratio 0.80 \
            --concurrency 2 \
            --provider-delay-ms 150 \
            --prewarm-enabled true \
            --prewarm-run-sync false \
            --allocation-pool-size 12 \
            --warm-key-space-size 90 \
            --output artifacts/b17_p4_benchmark/prewarm_enabled.json

      - name: Enforce B1.7-P6 benchmark adjudication gates
        run: |
          python scripts/ci/enforce_b17_p6_benchmark_adjudication.py \
            --baseline-file artifacts/b17_p4_benchmark/baseline_no_prewarm.json \
            --prewarm-file artifacts/b17_p4_benchmark/prewarm_enabled.json \
            --overall-p95-max-ms 500 \
            --cache-hit-ratio-min 0.60 \
            --provider-delay-min-ms 50 \
            --latency-model-file contracts-internal/governance/b17_p6_benchmark_latency_model.main.json \
            --min-total-requests 150 \
            --min-baseline-cold-path-samples 20 \
            --min-prewarm-cold-path-samples 1 \
            --min-distinct-allocations 10 \
            --min-distinct-determinants 50 \
            --min-distinct-users 25 \
            --max-requests-per-determinant 4 \
            --max-duplicate-request-ratio 0.50 \
            --min-unique-determinant-ratio 0.50

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b17-p4-mixed-workload-benchmark
          path: artifacts/b17_p4_benchmark
          if-no-files-found: error

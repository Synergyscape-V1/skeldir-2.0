name: B1.7-P4 Mixed Workload Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  b17-p4-mixed-workload-benchmark:
    name: B1.7 P4 Mixed Workload Benchmark
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      TESTING: "1"
      CONTRACT_TESTING: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          alembic upgrade head

      - name: Benchmark harness integrity
        run: |
          mkdir -p artifacts/b17_p4_benchmark
          python scripts/benchmarks/b17_p4_mixed_workload.py \
            --mode integrity \
            --requests 60 \
            --warm-ratio 0.65 \
            --concurrency 8 \
            --provider-delay-ms 650 \
            --output artifacts/b17_p4_benchmark/integrity.json

      - name: Baseline mixed-workload (prewarm disabled)
        run: |
          python scripts/benchmarks/b17_p4_mixed_workload.py \
            --mode measure \
            --requests 120 \
            --warm-ratio 0.65 \
            --concurrency 8 \
            --provider-delay-ms 350 \
            --prewarm-enabled false \
            --prewarm-run-sync false \
            --assert-cold-insufficient \
            --output artifacts/b17_p4_benchmark/baseline_no_prewarm.json

      - name: Mixed-workload with bounded event-driven prewarm
        run: |
          python scripts/benchmarks/b17_p4_mixed_workload.py \
            --mode measure \
            --requests 120 \
            --warm-ratio 0.65 \
            --concurrency 8 \
            --provider-delay-ms 350 \
            --prewarm-enabled true \
            --prewarm-run-sync true \
            --output artifacts/b17_p4_benchmark/prewarm_enabled.json

      - name: Assert prewarm materially reduces cold exposure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/b17_p4_benchmark")
          baseline = json.loads((root / "baseline_no_prewarm.json").read_text(encoding="utf-8"))
          prewarm = json.loads((root / "prewarm_enabled.json").read_text(encoding="utf-8"))

          baseline_counts = baseline.get("execution_path_counts", {})
          prewarm_counts = prewarm.get("execution_path_counts", {})
          baseline_cold = int(baseline_counts.get("cold_path_generated", 0))
          prewarm_cold = int(prewarm_counts.get("cold_path_generated", 0))
          prewarm_assisted = int(prewarm_counts.get("prewarm_assisted_cache_hit", 0))

          if prewarm_cold >= baseline_cold:
              raise SystemExit(
                  f"prewarm did not reduce cold exposure: baseline={baseline_cold}, prewarm={prewarm_cold}"
              )
          if prewarm_assisted <= 0:
              raise SystemExit("prewarm scenario produced no prewarm_assisted_cache_hit observations")
          PY

      - name: Enforce B1.7-P6 benchmark adjudication gates
        run: |
          python scripts/ci/enforce_b17_p6_benchmark_adjudication.py \
            --baseline-file artifacts/b17_p4_benchmark/baseline_no_prewarm.json \
            --prewarm-file artifacts/b17_p4_benchmark/prewarm_enabled.json \
            --overall-p95-max-ms 500 \
            --cache-hit-ratio-min 0.60

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b17-p4-mixed-workload-benchmark
          path: artifacts/b17_p4_benchmark
          if-no-files-found: error

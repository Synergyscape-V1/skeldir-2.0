name: Schema Drift Diagnostics (Manual)

on:
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push / merge_group: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift-check:
    name: Drift diagnostics (non-merge authority)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: skeldir_test
          POSTGRES_USER: migration_owner
          POSTGRES_PASSWORD: migration_owner
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install alembic sqlalchemy psycopg2-binary

      - name: Enforce migrations-derived canonical schema
        env:
          CI: "true"
          MIGRATION_DATABASE_URL: postgresql://migration_owner:migration_owner@localhost:5432/skeldir_test
        run: |
          python scripts/schema/assert_canonical_schema.py \
            --mode ci \
            --artifacts-dir artifacts/schema_drift_check \
            --diff-out artifacts/schema_drift_check/canonical_drift.diff

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-check
          path: artifacts/schema_drift_check/
          retention-days: 7

name: Production Schema Deployment

# EMPIRICALLY OPTIMAL: Deploy schema changes to Neon production ONLY after validation passes
# Includes comprehensive audit logging to validate all schema changes originate from CI
on:
  push:
    branches:
      - main
    paths:
      - 'alembic/versions/**'
      - 'db/schema/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Schema Validation"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-to-neon:
    name: Deploy Migrations to Neon Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      # B11 control-plane governance: skeldir-ci-deploy role is scoped to /skeldir/ci/*.
      SKELDIR_ENV: ci
      PGOPTIONS: -c skeldir.require_pg_cron=on
      GH_NEON_API_KEY: ${{ secrets.NEON_API_KEY }} # b23_p0_governed_secret_source
      GH_NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      GH_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }} # b23_p0_governed_secret_source
      GH_NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }} # b23_p0_governed_secret_source
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce B1.5-P7 technical closure gate (allow governed schema deploy while human study is pending)
        run: |
          python scripts/ci/b15_p7_phase_closure_gate.py \
            --mode technical \
            --status-file docs/forensics/evidence/b15_p7/mental_model_study/status.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::326730685463:role/skeldir-ci-deploy
          aws-region: us-east-2

      - name: Guard Neon control-plane secrets (fail closed when missing)
        id: neon-guard
        run: |
          set -euo pipefail
          resolve_secret_manager_by_fragments() {
            local value names name lower_name
            names=$(aws secretsmanager list-secrets \
              --filters "Key=name,Values=/skeldir/${SKELDIR_ENV}/" \
              --query "SecretList[].Name" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null || true)
            for name in ${names}; do
              lower_name=$(echo "${name}" | tr '[:upper:]' '[:lower:]')
              local matches=true
              local fragment
              for fragment in "$@"; do
                if [[ "${lower_name}" != *"${fragment}"* ]]; then
                  matches=false
                  break
                fi
              done
              if [ "${matches}" = true ]; then
                value=$(get_secret_manager_payload "${name}" || true)
                if [ -n "${value}" ]; then
                  echo "${value}"
                  return 0
                fi
              fi
            done
            return 1
          }

          resolve_ssm_by_fragments() {
            local value names name lower_name
            names=$(aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=BeginsWith,Values=/skeldir/${SKELDIR_ENV}/" \
              --query "Parameters[].Name" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null || true)
            for name in ${names}; do
              lower_name=$(echo "${name}" | tr '[:upper:]' '[:lower:]')
              local matches=true
              local fragment
              for fragment in "$@"; do
                if [[ "${lower_name}" != *"${fragment}"* ]]; then
                  matches=false
                  break
                fi
              done
              if [ "${matches}" = true ]; then
                value=$(aws ssm get-parameter \
                  --name "${name}" \
                  --with-decryption \
                  --query Parameter.Value \
                  --output text \
                  --region "${AWS_REGION}" 2>/dev/null || true)
                if [ -n "${value}" ]; then
                  echo "${value}"
                  return 0
                fi
              fi
            done
            return 1
          }

          get_secret_manager_payload() {
            local secret_id response secret_string secret_binary decoded_binary
            secret_id="${1:-}"
            if [ -z "${secret_id}" ]; then
              return 1
            fi
            response=$(aws secretsmanager get-secret-value \
              --secret-id "${secret_id}" \
              --output json \
              --region "${AWS_REGION}" 2>/dev/null || true)
            if [ -z "${response}" ] || [ "${response}" = "null" ]; then
              return 1
            fi
            secret_string=$(echo "${response}" | jq -r '.SecretString // empty')
            if [ -n "${secret_string}" ] && [ "${secret_string}" != "null" ]; then
              echo "${secret_string}"
              return 0
            fi
            secret_binary=$(echo "${response}" | jq -r '.SecretBinary // empty')
            if [ -n "${secret_binary}" ] && [ "${secret_binary}" != "null" ]; then
              decoded_binary=$(echo "${secret_binary}" | base64 --decode 2>/dev/null || true)
              if [ -n "${decoded_binary}" ]; then
                echo "${decoded_binary}"
                return 0
              fi
            fi
            return 1
          }

          resolve_secret_manager_value() {
            local secret_id
            for secret_id in "$@"; do
              local value
              value=$(get_secret_manager_payload "${secret_id}" || true)
              if [ -n "${value}" ]; then
                echo "${value}"
                return 0
              fi
            done
            return 1
          }

          resolve_ssm_value() {
            local parameter_name
            for parameter_name in "$@"; do
              local value
              value=$(aws ssm get-parameter --name "${parameter_name}" --with-decryption --query Parameter.Value --output text --region "${AWS_REGION}" 2>/dev/null || true)
              if [ -n "${value}" ]; then
                echo "${value}"
                return 0
              fi
            done
            return 1
          }

          normalize_secret_payload() {
            local payload kind normalized
            payload="${1:-}"
            kind="${2:-}"
            normalized="${payload}"
            if [ -n "${payload}" ] && echo "${payload}" | jq -e . >/dev/null 2>&1; then
              case "${kind}" in
                neon_api_key)
                  normalized=$(echo "${payload}" | jq -r '
                    (
                      .NEON_API_KEY
                      // .neon_api_key
                      // .api_key
                      // .API_KEY
                      // .NEON_API_TOKEN
                      // .neon_api_token
                      // .token
                      // .TOKEN
                      // .key
                      // empty
                    ) // empty
                  ')
                  if [ -z "${normalized}" ]; then
                    normalized=$(echo "${payload}" | jq -r '
                      [
                        (to_entries[]? | select((.key | ascii_downcase | test("neon.*api.*key|api.*key|api.*token|token|access.*token|key")) and (.value | type == "string" and (.value | length > 0))) | .value),
                        (.. | strings | select(test("^napi_")))
                      ]
                      | map(select(length > 0))
                      | .[0] // empty
                    ')
                  fi
                  ;;
                neon_project_id)
                  normalized=$(echo "${payload}" | jq -r '
                    (
                      .NEON_PROJECT_ID
                      // .neon_project_id
                      // .project_id
                      // .projectId
                      // .PROJECT_ID
                      // .id
                      // .project
                      // empty
                    ) // empty
                  ')
                  if [ -z "${normalized}" ]; then
                    normalized=$(echo "${payload}" | jq -r '
                      [
                        (to_entries[]? | select((.key | ascii_downcase | test("project")) and (.value | type == "string" and (.value | length > 0))) | .value),
                        (.. | strings | select(test("^[a-z0-9-]+-[a-z0-9-]+-[0-9]+$")))
                      ]
                      | map(select(length > 0))
                      | .[0] // empty
                    ')
                  fi
                  ;;
                neon_database_url)
                  normalized=$(echo "${payload}" | jq -r '
                    def dsn_candidates:
                      [
                        .RUNTIME_DATABASE_URL,
                        .runtime_database_url,
                        .DATABASE_URL,
                        .database_url,
                        .connection_uri,
                        .uri,
                        .runtime_url,
                        .url,
                        .MIGRATION_DATABASE_URL,
                        .migration_database_url,
                        .migration_url,
                        (.. | strings | select(test("^postgres(ql)?(\\+[A-Za-z0-9_]+)?://"))),
                        (.. | strings | select(test("(^|[[:space:]])host=")))
                      ]
                      | map(select(type == "string" and length > 0))
                      | map(gsub("^\\s+|\\s+$"; ""));
                    def is_local:
                      test("://([^/@]+@)?(localhost|127\\.0\\.0\\.1|\\[::1\\]|::1)(:|/|$)")
                      or test("(^|[[:space:]])host=(localhost|127\\.0\\.0\\.1|::1|\\[::1\\])([[:space:]]|$)");
                    (dsn_candidates | map(select((is_local | not))) | .[0])
                    // (dsn_candidates | .[0])
                    // empty
                  ')
                  ;;
                *)
                  normalized="${payload}"
                  ;;
              esac
            fi
            # Trim incidental whitespace/newlines from managed secret payloads.
            normalized="$(printf '%s' "${normalized}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            printf '%s' "${normalized}"
          }

          is_valid_database_dsn() {
            local value
            value="${1:-}"
            if [[ "${value}" =~ ^postgres(ql)?(\+[a-zA-Z0-9_]+)?:// ]]; then
              return 0
            fi
            if [[ "${value}" =~ ^host= ]]; then
              return 0
            fi
            return 1
          }

          is_localhost_database_dsn() {
            local value
            value="${1:-}"
            if [[ "${value}" =~ ://([^/@]+@)?(localhost|127\.0\.0\.1|\[::1\]|::1)(:|/|$) ]]; then
              return 0
            fi
            if [[ "${value}" =~ (^|[[:space:]])host=(localhost|127\.0\.0\.1|::1|\[::1\])([[:space:]]|$) ]]; then
              return 0
            fi
            return 1
          }

          resolve_secret_manager_database_dsn_value() {
            local secret_id raw normalized local_candidate
            local_candidate=""
            for secret_id in "$@"; do
              raw=$(get_secret_manager_payload "${secret_id}" || true)
              normalized=$(normalize_secret_payload "${raw:-}" neon_database_url)
              if [ -z "${normalized}" ] || ! is_valid_database_dsn "${normalized}"; then
                continue
              fi
              if ! is_localhost_database_dsn "${normalized}"; then
                echo "${normalized}"
                return 0
              fi
              if [ -z "${local_candidate}" ]; then
                local_candidate="${normalized}"
              fi
            done
            if [ -n "${local_candidate}" ]; then
              echo "${local_candidate}"
              return 0
            fi
            return 1
          }

          NEON_API_SOURCE="none"
          NEON_PROJECT_SOURCE="none"
          NEON_DATABASE_SOURCE="none"
          NEON_MIGRATION_DATABASE_SOURCE="none"

          NEON_API_KEY=$(resolve_secret_manager_value \
            "/skeldir/${SKELDIR_ENV}/secret/ci/neon-api-key" \
            "/skeldir/${SKELDIR_ENV}/secret/neon-api-key" \
            "/skeldir/${SKELDIR_ENV}/secret/control-plane/neon-api-key" || true)
          NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
          if [ -n "${NEON_API_KEY}" ]; then
            NEON_API_SOURCE="aws_secrets_manager_explicit"
          fi
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_secret_manager_by_fragments neon api key || true)
            NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
            if [ -n "${NEON_API_KEY}" ]; then
              NEON_API_SOURCE="aws_secrets_manager_fragment"
            fi
          fi
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_ssm_value \
              "/skeldir/${SKELDIR_ENV}/config/ci/neon-api-key" \
              "/skeldir/${SKELDIR_ENV}/config/neon-api-key" \
              "/skeldir/${SKELDIR_ENV}/config/control-plane/neon-api-key" || true)
            NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
            if [ -n "${NEON_API_KEY}" ]; then
              NEON_API_SOURCE="aws_ssm_explicit"
            fi
          fi
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_ssm_by_fragments neon api key || true)
            NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
            if [ -n "${NEON_API_KEY}" ]; then
              NEON_API_SOURCE="aws_ssm_fragment"
            fi
          fi
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_secret_manager_by_fragments neon token || true)
            NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
            if [ -n "${NEON_API_KEY}" ]; then
              NEON_API_SOURCE="aws_secrets_manager_token_fragment"
            fi
          fi
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_secret_manager_by_fragments neon || true)
            NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
            if [ -n "${NEON_API_KEY}" ]; then
              NEON_API_SOURCE="aws_secrets_manager_neon_scan"
            fi
          fi
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_ssm_by_fragments neon token || true)
            NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
            if [ -n "${NEON_API_KEY}" ]; then
              NEON_API_SOURCE="aws_ssm_token_fragment"
            fi
          fi
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_ssm_by_fragments neon || true)
            NEON_API_KEY=$(normalize_secret_payload "${NEON_API_KEY:-}" neon_api_key)
            if [ -n "${NEON_API_KEY}" ]; then
              NEON_API_SOURCE="aws_ssm_neon_scan"
            fi
          fi

          NEON_PROJECT_ID=$(resolve_ssm_value \
            "/skeldir/${SKELDIR_ENV}/config/ci/neon-project-id" \
            "/skeldir/${SKELDIR_ENV}/config/neon-project-id" \
            "/skeldir/${SKELDIR_ENV}/config/control-plane/neon-project-id" || true)
          NEON_PROJECT_ID=$(normalize_secret_payload "${NEON_PROJECT_ID:-}" neon_project_id)
          if [ -n "${NEON_PROJECT_ID}" ]; then
            NEON_PROJECT_SOURCE="aws_ssm_explicit"
          fi
          if [ -z "${NEON_PROJECT_ID}" ]; then
            NEON_PROJECT_ID=$(resolve_ssm_by_fragments neon project id || true)
            NEON_PROJECT_ID=$(normalize_secret_payload "${NEON_PROJECT_ID:-}" neon_project_id)
            if [ -n "${NEON_PROJECT_ID}" ]; then
              NEON_PROJECT_SOURCE="aws_ssm_fragment"
            fi
          fi
          if [ -z "${NEON_PROJECT_ID}" ]; then
            NEON_PROJECT_ID=$(resolve_secret_manager_value \
              "/skeldir/${SKELDIR_ENV}/secret/ci/neon-project-id" \
              "/skeldir/${SKELDIR_ENV}/secret/control-plane/neon-project-id" \
              "/skeldir/${SKELDIR_ENV}/secret/neon-project-id" || true)
            NEON_PROJECT_ID=$(normalize_secret_payload "${NEON_PROJECT_ID:-}" neon_project_id)
            if [ -n "${NEON_PROJECT_ID}" ]; then
              NEON_PROJECT_SOURCE="aws_secrets_manager_explicit"
            fi
          fi
          if [ -z "${NEON_PROJECT_ID}" ]; then
            NEON_PROJECT_ID=$(resolve_secret_manager_by_fragments neon project id || true)
            NEON_PROJECT_ID=$(normalize_secret_payload "${NEON_PROJECT_ID:-}" neon_project_id)
            if [ -n "${NEON_PROJECT_ID}" ]; then
              NEON_PROJECT_SOURCE="aws_secrets_manager_fragment"
            fi
          fi

          NEON_MIGRATION_DATABASE_URL=$(resolve_secret_manager_database_dsn_value \
            "/skeldir/${SKELDIR_ENV}/secret/database/migration-url" \
            "/skeldir/${SKELDIR_ENV}/secret/control-plane/neon-migration-database-url" \
            "/skeldir/${SKELDIR_ENV}/secret/ci/neon-migration-database-url" || true)
          if [ -n "${NEON_MIGRATION_DATABASE_URL}" ]; then
            NEON_MIGRATION_DATABASE_SOURCE="aws_secrets_manager_explicit"
          fi
          if [ -z "${NEON_MIGRATION_DATABASE_URL}" ]; then
            NEON_MIGRATION_DATABASE_URL=$(resolve_secret_manager_by_fragments neon migration database url || true)
            NEON_MIGRATION_DATABASE_URL=$(normalize_secret_payload "${NEON_MIGRATION_DATABASE_URL:-}" neon_database_url)
            if [ -n "${NEON_MIGRATION_DATABASE_URL}" ] && ! is_valid_database_dsn "${NEON_MIGRATION_DATABASE_URL}"; then
              NEON_MIGRATION_DATABASE_URL=""
            fi
            if [ -n "${NEON_MIGRATION_DATABASE_URL}" ]; then
              NEON_MIGRATION_DATABASE_SOURCE="aws_secrets_manager_fragment"
            fi
          fi
          if [ -n "${NEON_MIGRATION_DATABASE_URL}" ] && is_localhost_database_dsn "${NEON_MIGRATION_DATABASE_URL}"; then
            CANDIDATE_MIGRATION_DATABASE_URL=$(resolve_secret_manager_by_fragments neon database || true)
            CANDIDATE_MIGRATION_DATABASE_URL=$(normalize_secret_payload "${CANDIDATE_MIGRATION_DATABASE_URL:-}" neon_database_url)
            if [ -n "${CANDIDATE_MIGRATION_DATABASE_URL}" ] && is_valid_database_dsn "${CANDIDATE_MIGRATION_DATABASE_URL}" && ! is_localhost_database_dsn "${CANDIDATE_MIGRATION_DATABASE_URL}"; then
              NEON_MIGRATION_DATABASE_URL="${CANDIDATE_MIGRATION_DATABASE_URL}"
              NEON_MIGRATION_DATABASE_SOURCE="aws_secrets_manager_neon_database_scan"
            fi
          fi
          if { [ -z "${NEON_MIGRATION_DATABASE_URL}" ] || is_localhost_database_dsn "${NEON_MIGRATION_DATABASE_URL}"; }; then
            CANDIDATE_MIGRATION_DATABASE_URL=$(resolve_ssm_by_fragments neon database || true)
            CANDIDATE_MIGRATION_DATABASE_URL=$(normalize_secret_payload "${CANDIDATE_MIGRATION_DATABASE_URL:-}" neon_database_url)
            if [ -n "${CANDIDATE_MIGRATION_DATABASE_URL}" ] && is_valid_database_dsn "${CANDIDATE_MIGRATION_DATABASE_URL}" && ! is_localhost_database_dsn "${CANDIDATE_MIGRATION_DATABASE_URL}"; then
              NEON_MIGRATION_DATABASE_URL="${CANDIDATE_MIGRATION_DATABASE_URL}"
              NEON_MIGRATION_DATABASE_SOURCE="aws_ssm_neon_database_scan"
            fi
          fi
          if { [ -z "${NEON_MIGRATION_DATABASE_URL}" ] || is_localhost_database_dsn "${NEON_MIGRATION_DATABASE_URL}"; } && [ -n "${GH_NEON_MIGRATION_DATABASE_URL:-}" ]; then
            CANDIDATE_MIGRATION_DATABASE_URL=$(normalize_secret_payload "${GH_NEON_MIGRATION_DATABASE_URL:-}" neon_database_url)
            if [ -n "${CANDIDATE_MIGRATION_DATABASE_URL}" ] && is_valid_database_dsn "${CANDIDATE_MIGRATION_DATABASE_URL}" && ! is_localhost_database_dsn "${CANDIDATE_MIGRATION_DATABASE_URL}"; then
              NEON_MIGRATION_DATABASE_URL="${CANDIDATE_MIGRATION_DATABASE_URL}"
              NEON_MIGRATION_DATABASE_SOURCE="github_secret_allowlisted"
            fi
          fi

          NEON_DATABASE_URL=$(resolve_secret_manager_database_dsn_value \
            "/skeldir/${SKELDIR_ENV}/secret/database/runtime-url" \
            "/skeldir/${SKELDIR_ENV}/secret/database/migration-url" \
            "/skeldir/${SKELDIR_ENV}/secret/control-plane/neon-database-url" \
            "/skeldir/${SKELDIR_ENV}/secret/ci/neon-database-url" \
            "/skeldir/${SKELDIR_ENV}/secret/neon-database-url" \
            "/skeldir/${SKELDIR_ENV}/secret/database-url" || true)
          if [ -n "${NEON_DATABASE_URL}" ]; then
            NEON_DATABASE_SOURCE="aws_secrets_manager_explicit"
          fi
          if [ -z "${NEON_DATABASE_URL}" ]; then
            NEON_DATABASE_URL=$(resolve_secret_manager_by_fragments neon database url || true)
            NEON_DATABASE_URL=$(normalize_secret_payload "${NEON_DATABASE_URL:-}" neon_database_url)
            if [ -n "${NEON_DATABASE_URL}" ] && ! is_valid_database_dsn "${NEON_DATABASE_URL}"; then
              NEON_DATABASE_URL=""
            fi
            if [ -n "${NEON_DATABASE_URL}" ]; then
              NEON_DATABASE_SOURCE="aws_secrets_manager_fragment"
            fi
          fi
          if [ -z "${NEON_DATABASE_URL}" ]; then
            NEON_DATABASE_URL=$(resolve_ssm_value \
              "/skeldir/${SKELDIR_ENV}/config/ci/neon-database-url" \
              "/skeldir/${SKELDIR_ENV}/config/control-plane/neon-database-url" \
              "/skeldir/${SKELDIR_ENV}/config/neon-database-url" \
              "/skeldir/${SKELDIR_ENV}/config/database-url" || true)
            NEON_DATABASE_URL=$(normalize_secret_payload "${NEON_DATABASE_URL:-}" neon_database_url)
            if [ -n "${NEON_DATABASE_URL}" ] && ! is_valid_database_dsn "${NEON_DATABASE_URL}"; then
              NEON_DATABASE_URL=""
            fi
            if [ -n "${NEON_DATABASE_URL}" ]; then
              NEON_DATABASE_SOURCE="aws_ssm_explicit"
            fi
          fi
          if [ -z "${NEON_DATABASE_URL}" ]; then
            NEON_DATABASE_URL=$(resolve_ssm_by_fragments neon database url || true)
            NEON_DATABASE_URL=$(normalize_secret_payload "${NEON_DATABASE_URL:-}" neon_database_url)
            if [ -n "${NEON_DATABASE_URL}" ] && ! is_valid_database_dsn "${NEON_DATABASE_URL}"; then
              NEON_DATABASE_URL=""
            fi
            if [ -n "${NEON_DATABASE_URL}" ]; then
              NEON_DATABASE_SOURCE="aws_ssm_fragment"
            fi
          fi
          if [ -n "${NEON_DATABASE_URL}" ] && is_localhost_database_dsn "${NEON_DATABASE_URL}"; then
            CANDIDATE_DATABASE_URL=$(resolve_secret_manager_by_fragments neon database || true)
            CANDIDATE_DATABASE_URL=$(normalize_secret_payload "${CANDIDATE_DATABASE_URL:-}" neon_database_url)
            if [ -n "${CANDIDATE_DATABASE_URL}" ] && is_valid_database_dsn "${CANDIDATE_DATABASE_URL}" && ! is_localhost_database_dsn "${CANDIDATE_DATABASE_URL}"; then
              NEON_DATABASE_URL="${CANDIDATE_DATABASE_URL}"
              NEON_DATABASE_SOURCE="aws_secrets_manager_neon_database_scan"
            fi
          fi
          if { [ -z "${NEON_DATABASE_URL}" ] || is_localhost_database_dsn "${NEON_DATABASE_URL}"; }; then
            CANDIDATE_DATABASE_URL=$(resolve_ssm_by_fragments neon database || true)
            CANDIDATE_DATABASE_URL=$(normalize_secret_payload "${CANDIDATE_DATABASE_URL:-}" neon_database_url)
            if [ -n "${CANDIDATE_DATABASE_URL}" ] && is_valid_database_dsn "${CANDIDATE_DATABASE_URL}" && ! is_localhost_database_dsn "${CANDIDATE_DATABASE_URL}"; then
              NEON_DATABASE_URL="${CANDIDATE_DATABASE_URL}"
              NEON_DATABASE_SOURCE="aws_ssm_neon_database_scan"
            fi
          fi
          if { [ -z "${NEON_DATABASE_URL}" ] || is_localhost_database_dsn "${NEON_DATABASE_URL}"; } && [ -n "${GH_NEON_DATABASE_URL:-}" ]; then
            CANDIDATE_DATABASE_URL=$(normalize_secret_payload "${GH_NEON_DATABASE_URL:-}" neon_database_url)
            if [ -n "${CANDIDATE_DATABASE_URL}" ] && is_valid_database_dsn "${CANDIDATE_DATABASE_URL}" && ! is_localhost_database_dsn "${CANDIDATE_DATABASE_URL}"; then
              NEON_DATABASE_URL="${CANDIDATE_DATABASE_URL}"
              NEON_DATABASE_SOURCE="github_secret_allowlisted"
            fi
          fi
          if [ -z "${NEON_API_KEY}" ] && [ -n "${GH_NEON_API_KEY:-}" ]; then
            NEON_API_KEY="${GH_NEON_API_KEY}"
            NEON_API_SOURCE="github_secret_allowlisted"
          fi
          if [ -z "${NEON_PROJECT_ID}" ] && [ -n "${GH_NEON_PROJECT_ID:-}" ]; then
            NEON_PROJECT_ID="${GH_NEON_PROJECT_ID}"
            NEON_PROJECT_SOURCE="github_variable"
          fi

          if [ -z "${NEON_DATABASE_URL}" ] && { [ -z "${NEON_API_KEY}" ] || [ -z "${NEON_PROJECT_ID}" ]; }; then
            echo "Missing required Neon control-plane values for governed production deploy."
            exit 1
          fi
          if [ -n "${NEON_API_KEY}" ]; then
            echo "::add-mask::${NEON_API_KEY}"
            echo "NEON_API_KEY=${NEON_API_KEY}" >> "$GITHUB_ENV"
          fi
          if [ -n "${NEON_PROJECT_ID}" ]; then
            echo "NEON_PROJECT_ID=${NEON_PROJECT_ID}" >> "$GITHUB_ENV"
          fi
          if [ -n "${NEON_DATABASE_URL}" ]; then
            echo "::add-mask::${NEON_DATABASE_URL}"
            echo "NEON_DATABASE_URL=${NEON_DATABASE_URL}" >> "$GITHUB_ENV"
          fi
          if [ -n "${NEON_MIGRATION_DATABASE_URL}" ]; then
            echo "::add-mask::${NEON_MIGRATION_DATABASE_URL}"
            echo "NEON_MIGRATION_DATABASE_URL=${NEON_MIGRATION_DATABASE_URL}" >> "$GITHUB_ENV"
          fi
          echo "NEON_API_SOURCE=${NEON_API_SOURCE}" >> "$GITHUB_ENV"
          echo "NEON_PROJECT_SOURCE=${NEON_PROJECT_SOURCE}" >> "$GITHUB_ENV"
          echo "NEON_DATABASE_SOURCE=${NEON_DATABASE_SOURCE}" >> "$GITHUB_ENV"
          echo "NEON_MIGRATION_DATABASE_SOURCE=${NEON_MIGRATION_DATABASE_SOURCE}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install alembic sqlalchemy psycopg2-binary
      
      - name: Initialize audit log
        run: |
          mkdir -p audit_logs
          echo "=== CI SCHEMA DEPLOYMENT AUDIT LOG ===" > audit_logs/deployment.log
          echo "Workflow Run ID: ${{ github.run_id }}" >> audit_logs/deployment.log
          echo "Commit SHA: ${{ github.sha }}" >> audit_logs/deployment.log
          echo "Actor: ${{ github.actor }}" >> audit_logs/deployment.log
          echo "Timestamp: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")" >> audit_logs/deployment.log
          echo "=========================================" >> audit_logs/deployment.log
      
      - name: Get Neon connection string
        id: neon-connection
        run: |
          set -euo pipefail
          is_valid_database_dsn() {
            local value
            value="${1:-}"
            if [[ "${value}" =~ ^postgres(ql)?(\+[a-zA-Z0-9_]+)?:// ]]; then
              return 0
            fi
            if [[ "${value}" =~ ^host= ]]; then
              return 0
            fi
            return 1
          }

          is_localhost_database_dsn() {
            local value
            value="${1:-}"
            if [[ "${value}" =~ ://([^/@]+@)?(localhost|127\.0\.0\.1|\[::1\]|::1)(:|/|$) ]]; then
              return 0
            fi
            if [[ "${value}" =~ (^|[[:space:]])host=(localhost|127\.0\.0\.1|::1|\[::1\])([[:space:]]|$) ]]; then
              return 0
            fi
            return 1
          }

          to_sync_migration_dsn() {
            local value
            value="${1:-}"
            if [[ "${value}" =~ ^postgresql\+asyncpg:// ]]; then
              echo "${value/postgresql+asyncpg:\/\//postgresql://}"
              return 0
            fi
            if [[ "${value}" =~ ^postgres\+asyncpg:// ]]; then
              echo "${value/postgres+asyncpg:\/\//postgres://}"
              return 0
            fi
            echo "${value}"
          }

          emit_database_outputs() {
            local resolved_url migration_url
            resolved_url="${1:-}"
            if ! is_valid_database_dsn "${resolved_url}"; then
              echo "Resolved Neon connection URI is not a valid Postgres DSN."
              exit 1
            fi
            migration_url="$(to_sync_migration_dsn "${resolved_url}")"
            if ! is_valid_database_dsn "${migration_url}"; then
              echo "Derived migration DSN is not a valid Postgres DSN."
              exit 1
            fi
            if is_localhost_database_dsn "${migration_url}"; then
              echo "Resolved governed production database DSN points to localhost and is invalid for Neon deployment."
              exit 1
            fi
            echo "::add-mask::${migration_url}"
            echo "DATABASE_URL=${migration_url}" >> "$GITHUB_OUTPUT"
            echo "MIGRATION_DATABASE_URL=${migration_url}" >> "$GITHUB_OUTPUT"
            if [ "${resolved_url}" != "${migration_url}" ]; then
              echo "Normalized async Postgres DSN to sync Postgres DSN for Alembic/psql compatibility." >> audit_logs/deployment.log
            fi
          }

          extract_connection_uri_from_json() {
            local payload
            payload="${1:-}"
            echo "${payload}" | jq -r '
              [
                .uri,
                .connection_uri,
                (.connection_uris[]?.connection_uri),
                (.connection_uris[]?.uri),
                (.branch.connection_uris[]?.connection_uri),
                (.branch.connection_uris[]?.uri)
              ]
              | map(select(type == "string" and length > 0))
              | .[0] // empty
            '
          }

          request_connection_uri() {
            local url response uri diagnostic
            url="${1:-}"
            response=$(curl -sS "${url}" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              -H "Accept: application/json")
            uri=$(extract_connection_uri_from_json "${response}")
            if [ -n "${uri}" ]; then
              echo "${uri}"
              return 0
            fi
            diagnostic=$(echo "${response}" | jq -r '(.message // .error // empty)')
            if [ -n "${diagnostic}" ]; then
              echo "Neon API empty URI for ${url}; diagnostic=${diagnostic}" >> audit_logs/deployment.log
            else
              echo "Neon API empty URI for ${url}; no message/error diagnostic returned." >> audit_logs/deployment.log
            fi
            return 1
          }

          echo "Neon credential source: api=${NEON_API_SOURCE:-unknown}, project=${NEON_PROJECT_SOURCE:-unknown}, db_url=${NEON_DATABASE_SOURCE:-none}, migration_db_url=${NEON_MIGRATION_DATABASE_SOURCE:-none}" >> audit_logs/deployment.log
          if [ -n "${NEON_DATABASE_URL:-}" ]; then
            DIRECT_SYNC_URL="$(to_sync_migration_dsn "${NEON_DATABASE_URL}")"
            if is_localhost_database_dsn "${DIRECT_SYNC_URL}"; then
              if [ -n "${NEON_MIGRATION_DATABASE_URL:-}" ]; then
                MIGRATION_SYNC_URL="$(to_sync_migration_dsn "${NEON_MIGRATION_DATABASE_URL}")"
                if is_valid_database_dsn "${MIGRATION_SYNC_URL}" && ! is_localhost_database_dsn "${MIGRATION_SYNC_URL}"; then
                  emit_database_outputs "${NEON_MIGRATION_DATABASE_URL}"
                  echo "Runtime database URL targeted localhost; using governed migration database URL fallback." >> audit_logs/deployment.log
                  exit 0
                fi
              fi
              echo "Ignoring governed direct database URL secret/parameter because it targets localhost and no non-local migration URL fallback was available; falling back to Neon API connection resolution." >> audit_logs/deployment.log
            else
              emit_database_outputs "${NEON_DATABASE_URL}"
              echo "Connected via governed direct Neon database URL secret/parameter." >> audit_logs/deployment.log
              exit 0
            fi
          fi

          RESPONSE=$(curl -sS "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Accept: application/json")
          
          PROD_BRANCH_ID=$(echo "$RESPONSE" | jq -r '((.branches // []) | map(select(.name == "production" or .name == "main")) | .[0].id) // empty')

          if [ -z "${PROD_BRANCH_ID}" ]; then
            PROJECT_RESPONSE=$(curl -sS "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              -H "Accept: application/json")
            PROD_BRANCH_ID=$(echo "${PROJECT_RESPONSE}" | jq -r '(.project.default_branch_id // empty)')
          fi

          PRIMARY_ROLE_NAME=""
          PRIMARY_DATABASE_NAME=""
          if [ -n "${PROD_BRANCH_ID}" ]; then
            PRIMARY_ROLE_NAME=$(echo "${RESPONSE}" | jq -r --arg branch_id "${PROD_BRANCH_ID}" '
              ((.branches // []) | map(select(.id == $branch_id)) | .[0].roles // [])
              | map(.name // empty)
              | map(select(length > 0))
              | .[0] // empty
            ')
            PRIMARY_DATABASE_NAME=$(echo "${RESPONSE}" | jq -r --arg branch_id "${PROD_BRANCH_ID}" '
              ((.branches // []) | map(select(.id == $branch_id)) | .[0].databases // [])
              | map(.name // empty)
              | map(select(length > 0))
              | .[0] // empty
            ')
          fi

          CONNECTION_URI=""
          if [ -n "${PROD_BRANCH_ID}" ]; then
            echo "Resolved Neon branch id for governed deploy: ${PROD_BRANCH_ID}" >> audit_logs/deployment.log
            if [ -n "${PRIMARY_ROLE_NAME}" ] || [ -n "${PRIMARY_DATABASE_NAME}" ]; then
              ROLE_PARAM="${PRIMARY_ROLE_NAME:-neondb_owner}"
              DB_PARAM="${PRIMARY_DATABASE_NAME:-neondb}"
              CONNECTION_URI=$(request_connection_uri "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${PROD_BRANCH_ID}&role_name=${ROLE_PARAM}&database_name=${DB_PARAM}" || true)
            fi
            if [ -z "${CONNECTION_URI}" ]; then
              CONNECTION_URI=$(request_connection_uri "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${PROD_BRANCH_ID}&role_name=neondb_owner&database_name=neondb" || true)
            fi
            if [ -z "${CONNECTION_URI}" ]; then
              CONNECTION_URI=$(request_connection_uri "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${PROD_BRANCH_ID}" || true)
            fi
            if [ -z "${CONNECTION_URI}" ]; then
              BRANCH_DETAIL_RESPONSE=$(curl -sS "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${PROD_BRANCH_ID}" \
                -H "Authorization: Bearer ${NEON_API_KEY}" \
                -H "Accept: application/json")
              CONNECTION_URI=$(extract_connection_uri_from_json "${BRANCH_DETAIL_RESPONSE}")
              if [ -n "${CONNECTION_URI}" ]; then
                echo "Resolved governed Neon connection URI via branch detail payload fallback." >> audit_logs/deployment.log
              fi
            fi
          fi
          if [ -z "${CONNECTION_URI}" ]; then
            CONNECTION_URI=$(request_connection_uri "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?role_name=neondb_owner&database_name=neondb" || true)
          fi
          if [ -z "${CONNECTION_URI}" ]; then
            CONNECTION_URI=$(request_connection_uri "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" || true)
          fi

          if [ -z "${CONNECTION_URI}" ]; then
            echo "Unable to resolve Neon connection URI for governed production deploy."
            exit 1
          fi
          emit_database_outputs "${CONNECTION_URI}"
          if [ -n "${PROD_BRANCH_ID}" ]; then
            echo "Connected to Neon production branch: ${PROD_BRANCH_ID}" >> audit_logs/deployment.log
          else
            echo "Connected via Neon default branch resolution." >> audit_logs/deployment.log
          fi
      
      - name: Capture pre-deployment state
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ steps.neon-connection.outputs.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "\n[PRE-DEPLOYMENT STATE]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -c "SELECT version_num FROM alembic_version;" >> audit_logs/deployment.log 2>&1 || echo "No alembic_version table yet" >> audit_logs/deployment.log
          echo "Current Alembic head: $(alembic current 2>&1)" >> audit_logs/deployment.log
      
      - name: Apply migrations with DDL logging
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ steps.neon-connection.outputs.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "\n[MIGRATION EXECUTION]" >> audit_logs/deployment.log
          echo "Deploying schema migrations to Neon production..." | tee -a audit_logs/deployment.log
          
          alembic upgrade head 2>&1 | tee -a audit_logs/deployment.log
          
          echo "\nMigrations completed" | tee -a audit_logs/deployment.log
      
      - name: Capture post-deployment state
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ steps.neon-connection.outputs.MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "\n[POST-DEPLOYMENT STATE]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -c "SELECT version_num FROM alembic_version;" >> audit_logs/deployment.log
          echo "New Alembic head: $(alembic current 2>&1)" >> audit_logs/deployment.log

      - name: Verify B2.3-P0 delayed-arrival lifecycle substrate in Neon production
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[B2.3-P0 TOPOLOGY + LIFECYCLE VERIFICATION]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL' | tee -a audit_logs/deployment.log
          DO $$
          BEGIN
            IF to_regclass('public.attribution_commerce_identities') IS NULL THEN
              RAISE EXCEPTION 'missing_table:public.attribution_commerce_identities';
            END IF;
            IF to_regclass('public.idx_attr_commerce_identity_last_observed') IS NULL THEN
              RAISE EXCEPTION 'missing_index:public.idx_attr_commerce_identity_last_observed';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'fn_b23_p0_prune_attribution_commerce_identities'
            ) THEN
              RAISE EXCEPTION 'missing_function:public.fn_b23_p0_prune_attribution_commerce_identities';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'fn_b23_p0_prune_attribution_commerce_identities_trigger'
                AND p.prosecdef
            ) THEN
              RAISE EXCEPTION 'missing_security_definer_trigger_wrapper:public.fn_b23_p0_prune_attribution_commerce_identities_trigger';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_trigger t
              JOIN pg_class c ON c.oid = t.tgrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname = 'attribution_commerce_identities'
                AND t.tgname = 'trg_b23_p0_prune_attribution_commerce_identities'
                AND t.tgenabled <> 'D'
            ) THEN
              RAISE EXCEPTION 'missing_trigger:public.trg_b23_p0_prune_attribution_commerce_identities';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_extension
              WHERE extname = 'pg_cron'
            ) THEN
              RAISE EXCEPTION 'missing_extension:pg_cron';
            END IF;
            IF to_regnamespace('cron') IS NULL THEN
              RAISE EXCEPTION 'missing_schema:cron';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM cron.job
              WHERE jobname = 'b23_p0_prune_attribution_commerce_identities_hourly'
            ) THEN
              RAISE EXCEPTION 'missing_cron_job:b23_p0_prune_attribution_commerce_identities_hourly';
            END IF;
          END
          $$;
          SQL
      
      - name: Verify deployment and log schema state
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[VERIFICATION]" >> audit_logs/deployment.log
          
          psql "${DATABASE_URL}" -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" > /tmp/table_count.txt
          TABLE_COUNT=$(cat /tmp/table_count.txt | tr -d ' ')
          echo "Deployed schema version: $(alembic current)" | tee -a audit_logs/deployment.log
          echo "Total tables in production: $TABLE_COUNT" | tee -a audit_logs/deployment.log
          
          echo "\n[TABLE INVENTORY]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;" >> audit_logs/deployment.log
      
      - name: Log DDL audit trail from PostgreSQL
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[DDL QUERY AUDIT]" >> audit_logs/deployment.log
          echo "Source: CI GitHub Actions (Run ID: ${{ github.run_id }})" >> audit_logs/deployment.log
          echo "Connection Role: neondb_owner (CI-exclusive)" >> audit_logs/deployment.log
          echo "Timestamp: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")" >> audit_logs/deployment.log
      
      - name: Upload audit log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-deployment-audit-${{ github.run_id }}
          path: audit_logs/
          retention-days: 90
      
      - name: Update deployment documentation
        if: success()
        run: |
          echo "" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "## Deployment $(date -u +\"%Y-%m-%d %H:%M:%S UTC\")" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Deployed by: CI (GitHub Actions Run #${{ github.run_id }})" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Commit: ${{ github.sha }}" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Alembic Version: $(alembic current)" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Audit Log: Available in workflow artifacts" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md

name: Production Schema Deployment

# EMPIRICALLY OPTIMAL: Deploy schema changes to Neon production ONLY after validation passes
# Includes comprehensive audit logging to validate all schema changes originate from CI
on:
  push:
    branches:
      - main
    paths:
      - 'alembic/versions/**'
      - 'db/schema/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Schema Validation"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-to-neon:
    name: Deploy Migrations to Neon Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      SKELDIR_ENV: prod
      GH_NEON_API_KEY: ${{ secrets.NEON_API_KEY }} # b23_p0_governed_secret_source
      GH_NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce B1.5-P7 technical closure gate (allow governed schema deploy while human study is pending)
        run: |
          python scripts/ci/b15_p7_phase_closure_gate.py \
            --mode technical \
            --status-file docs/forensics/evidence/b15_p7/mental_model_study/status.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::326730685463:role/skeldir-ci-deploy
          aws-region: us-east-2

      - name: Guard Neon control-plane secrets (fail closed when missing)
        id: neon-guard
        run: |
          set -euo pipefail
          resolve_secret_manager_by_fragments() {
            local value names name lower_name
            names=$(aws secretsmanager list-secrets \
              --filters "Key=name,Values=/skeldir/${SKELDIR_ENV}/secret/" \
              --query "SecretList[].Name" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null || true)
            for name in ${names}; do
              lower_name=$(echo "${name}" | tr '[:upper:]' '[:lower:]')
              local matches=true
              local fragment
              for fragment in "$@"; do
                if [[ "${lower_name}" != *"${fragment}"* ]]; then
                  matches=false
                  break
                fi
              done
              if [ "${matches}" = true ]; then
                value=$(aws secretsmanager get-secret-value \
                  --secret-id "${name}" \
                  --query SecretString \
                  --output text \
                  --region "${AWS_REGION}" 2>/dev/null || true)
                if [ -n "${value}" ]; then
                  echo "${value}"
                  return 0
                fi
              fi
            done
            return 1
          }

          resolve_ssm_by_fragments() {
            local value names name lower_name
            names=$(aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=BeginsWith,Values=/skeldir/${SKELDIR_ENV}/config/" \
              --query "Parameters[].Name" \
              --output text \
              --region "${AWS_REGION}" 2>/dev/null || true)
            for name in ${names}; do
              lower_name=$(echo "${name}" | tr '[:upper:]' '[:lower:]')
              local matches=true
              local fragment
              for fragment in "$@"; do
                if [[ "${lower_name}" != *"${fragment}"* ]]; then
                  matches=false
                  break
                fi
              done
              if [ "${matches}" = true ]; then
                value=$(aws ssm get-parameter \
                  --name "${name}" \
                  --with-decryption \
                  --query Parameter.Value \
                  --output text \
                  --region "${AWS_REGION}" 2>/dev/null || true)
                if [ -n "${value}" ]; then
                  echo "${value}"
                  return 0
                fi
              fi
            done
            return 1
          }

          resolve_secret_manager_value() {
            local secret_id
            for secret_id in "$@"; do
              local value
              value=$(aws secretsmanager get-secret-value --secret-id "${secret_id}" --query SecretString --output text --region "${AWS_REGION}" 2>/dev/null || true)
              if [ -n "${value}" ]; then
                echo "${value}"
                return 0
              fi
            done
            return 1
          }

          resolve_ssm_value() {
            local parameter_name
            for parameter_name in "$@"; do
              local value
              value=$(aws ssm get-parameter --name "${parameter_name}" --with-decryption --query Parameter.Value --output text --region "${AWS_REGION}" 2>/dev/null || true)
              if [ -n "${value}" ]; then
                echo "${value}"
                return 0
              fi
            done
            return 1
          }

          NEON_API_KEY=$(resolve_secret_manager_value \
            "/skeldir/${SKELDIR_ENV}/secret/ci/neon-api-key" \
            "/skeldir/${SKELDIR_ENV}/secret/neon-api-key" \
            "/skeldir/${SKELDIR_ENV}/secret/control-plane/neon-api-key" || true)
          if [ -z "${NEON_API_KEY}" ]; then
            NEON_API_KEY=$(resolve_secret_manager_by_fragments neon api key || true)
          fi

          NEON_PROJECT_ID=$(resolve_ssm_value \
            "/skeldir/${SKELDIR_ENV}/config/ci/neon-project-id" \
            "/skeldir/${SKELDIR_ENV}/config/neon-project-id" \
            "/skeldir/${SKELDIR_ENV}/config/control-plane/neon-project-id" || true)
          if [ -z "${NEON_PROJECT_ID}" ]; then
            NEON_PROJECT_ID=$(resolve_ssm_by_fragments neon project id || true)
          fi

          NEON_DATABASE_URL=$(resolve_secret_manager_value \
            "/skeldir/${SKELDIR_ENV}/secret/database/migration-url" \
            "/skeldir/${SKELDIR_ENV}/secret/database/runtime-url" \
            "/skeldir/${SKELDIR_ENV}/secret/ci/neon-database-url" \
            "/skeldir/${SKELDIR_ENV}/secret/neon-database-url" \
            "/skeldir/${SKELDIR_ENV}/secret/database-url" || true)
          if [ -z "${NEON_DATABASE_URL}" ]; then
            NEON_DATABASE_URL=$(resolve_secret_manager_by_fragments neon database url || true)
          fi
          if [ -z "${NEON_DATABASE_URL}" ]; then
            NEON_DATABASE_URL=$(resolve_ssm_value \
              "/skeldir/${SKELDIR_ENV}/config/ci/neon-database-url" \
              "/skeldir/${SKELDIR_ENV}/config/neon-database-url" \
              "/skeldir/${SKELDIR_ENV}/config/database-url" || true)
          fi
          if [ -z "${NEON_DATABASE_URL}" ]; then
            NEON_DATABASE_URL=$(resolve_ssm_by_fragments neon database url || true)
          fi
          if [ -z "${NEON_API_KEY}" ] && [ -n "${GH_NEON_API_KEY:-}" ]; then
            NEON_API_KEY="${GH_NEON_API_KEY}"
          fi
          if [ -z "${NEON_PROJECT_ID}" ] && [ -n "${GH_NEON_PROJECT_ID:-}" ]; then
            NEON_PROJECT_ID="${GH_NEON_PROJECT_ID}"
          fi

          if [ -z "${NEON_DATABASE_URL}" ] && { [ -z "${NEON_API_KEY}" ] || [ -z "${NEON_PROJECT_ID}" ]; }; then
            echo "Missing required Neon control-plane values for governed production deploy."
            exit 1
          fi
          if [ -n "${NEON_API_KEY}" ]; then
            echo "::add-mask::${NEON_API_KEY}"
            echo "NEON_API_KEY=${NEON_API_KEY}" >> "$GITHUB_ENV"
          fi
          if [ -n "${NEON_PROJECT_ID}" ]; then
            echo "NEON_PROJECT_ID=${NEON_PROJECT_ID}" >> "$GITHUB_ENV"
          fi
          if [ -n "${NEON_DATABASE_URL}" ]; then
            echo "::add-mask::${NEON_DATABASE_URL}"
            echo "NEON_DATABASE_URL=${NEON_DATABASE_URL}" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install alembic sqlalchemy psycopg2-binary
      
      - name: Initialize audit log
        run: |
          mkdir -p audit_logs
          echo "=== CI SCHEMA DEPLOYMENT AUDIT LOG ===" > audit_logs/deployment.log
          echo "Workflow Run ID: ${{ github.run_id }}" >> audit_logs/deployment.log
          echo "Commit SHA: ${{ github.sha }}" >> audit_logs/deployment.log
          echo "Actor: ${{ github.actor }}" >> audit_logs/deployment.log
          echo "Timestamp: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")" >> audit_logs/deployment.log
          echo "=========================================" >> audit_logs/deployment.log
      
      - name: Get Neon connection string
        id: neon-connection
        run: |
          set -euo pipefail
          if [ -n "${NEON_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=${NEON_DATABASE_URL}" >> $GITHUB_OUTPUT
            echo "Connected via governed direct Neon database URL secret/parameter." >> audit_logs/deployment.log
            exit 0
          fi

          RESPONSE=$(curl -s "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Accept: application/json")
          
          PROD_BRANCH_ID=$(echo "$RESPONSE" | jq -r '.branches[] | select(.name == "production" or .name == "main") | .id' | head -n 1)
          
          CONNECTION_URI=$(curl -s "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${PROD_BRANCH_ID}&role_name=neondb_owner&database_name=neondb" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Accept: application/json" | jq -r '.uri')
          
          echo "::add-mask::${CONNECTION_URI}"
          echo "DATABASE_URL=${CONNECTION_URI}" >> $GITHUB_OUTPUT
          echo "Connected to Neon production branch: $PROD_BRANCH_ID" >> audit_logs/deployment.log
      
      - name: Capture pre-deployment state
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[PRE-DEPLOYMENT STATE]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -c "SELECT version_num, updated_at FROM alembic_version;" >> audit_logs/deployment.log 2>&1 || echo "No alembic_version table yet" >> audit_logs/deployment.log
          echo "Current Alembic head: $(alembic current 2>&1)" >> audit_logs/deployment.log
      
      - name: Apply migrations with DDL logging
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[MIGRATION EXECUTION]" >> audit_logs/deployment.log
          echo "Deploying schema migrations to Neon production..." | tee -a audit_logs/deployment.log
          
          alembic upgrade head 2>&1 | tee -a audit_logs/deployment.log
          
          echo "\nMigrations completed" | tee -a audit_logs/deployment.log
      
      - name: Capture post-deployment state
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[POST-DEPLOYMENT STATE]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -c "SELECT version_num, updated_at FROM alembic_version;" >> audit_logs/deployment.log
          echo "New Alembic head: $(alembic current 2>&1)" >> audit_logs/deployment.log

      - name: Verify B2.3-P0 delayed-arrival lifecycle substrate in Neon production
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[B2.3-P0 TOPOLOGY + LIFECYCLE VERIFICATION]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL' | tee -a audit_logs/deployment.log
          DO $$
          BEGIN
            IF to_regclass('public.attribution_commerce_identities') IS NULL THEN
              RAISE EXCEPTION 'missing_table:public.attribution_commerce_identities';
            END IF;
            IF to_regclass('public.idx_attr_commerce_identity_last_observed') IS NULL THEN
              RAISE EXCEPTION 'missing_index:public.idx_attr_commerce_identity_last_observed';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'fn_b23_p0_prune_attribution_commerce_identities'
            ) THEN
              RAISE EXCEPTION 'missing_function:public.fn_b23_p0_prune_attribution_commerce_identities';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = 'fn_b23_p0_prune_attribution_commerce_identities_trigger'
                AND p.prosecdef
            ) THEN
              RAISE EXCEPTION 'missing_security_definer_trigger_wrapper:public.fn_b23_p0_prune_attribution_commerce_identities_trigger';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_trigger t
              JOIN pg_class c ON c.oid = t.tgrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname = 'attribution_commerce_identities'
                AND t.tgname = 'trg_b23_p0_prune_attribution_commerce_identities'
                AND t.tgenabled <> 'D'
            ) THEN
              RAISE EXCEPTION 'missing_trigger:public.trg_b23_p0_prune_attribution_commerce_identities';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_extension
              WHERE extname = 'pg_cron'
            ) THEN
              RAISE EXCEPTION 'missing_extension:pg_cron';
            END IF;
            IF to_regnamespace('cron') IS NULL THEN
              RAISE EXCEPTION 'missing_schema:cron';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM cron.job
              WHERE jobname = 'b23_p0_prune_attribution_commerce_identities_hourly'
            ) THEN
              RAISE EXCEPTION 'missing_cron_job:b23_p0_prune_attribution_commerce_identities_hourly';
            END IF;
          END
          $$;
          SQL
      
      - name: Verify deployment and log schema state
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[VERIFICATION]" >> audit_logs/deployment.log
          
          psql "${DATABASE_URL}" -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" > /tmp/table_count.txt
          TABLE_COUNT=$(cat /tmp/table_count.txt | tr -d ' ')
          echo "Deployed schema version: $(alembic current)" | tee -a audit_logs/deployment.log
          echo "Total tables in production: $TABLE_COUNT" | tee -a audit_logs/deployment.log
          
          echo "\n[TABLE INVENTORY]" >> audit_logs/deployment.log
          psql "${DATABASE_URL}" -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;" >> audit_logs/deployment.log
      
      - name: Log DDL audit trail from PostgreSQL
        env:
          DATABASE_URL: ${{ steps.neon-connection.outputs.DATABASE_URL }}
        run: |
          echo "\n[DDL QUERY AUDIT]" >> audit_logs/deployment.log
          echo "Source: CI GitHub Actions (Run ID: ${{ github.run_id }})" >> audit_logs/deployment.log
          echo "Connection Role: neondb_owner (CI-exclusive)" >> audit_logs/deployment.log
          echo "Timestamp: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")" >> audit_logs/deployment.log
      
      - name: Upload audit log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-deployment-audit-${{ github.run_id }}
          path: audit_logs/
          retention-days: 90
      
      - name: Update deployment documentation
        if: success()
        run: |
          echo "" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "## Deployment $(date -u +\"%Y-%m-%d %H:%M:%S UTC\")" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Deployed by: CI (GitHub Actions Run #${{ github.run_id }})" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Commit: ${{ github.sha }}" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Alembic Version: $(alembic current)" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md
          echo "- Audit Log: Available in workflow artifacts" >> docs/SCHEMA_DEPLOYMENT_COMPLETE.md

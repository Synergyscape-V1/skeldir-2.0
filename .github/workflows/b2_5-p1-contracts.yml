name: B2.5-P1 Contract Authority

on:
  push:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "Makefile"
      - ".github/workflows/b2_5-p1-contracts.yml"
      - "backend/**/trust*.py"
      - "backend/**/trust_envelope*.py"
      - "backend/**/schemas/*trust*.py"
      - "backend/**/schemas/*envelope*.py"
      - "backend/**/models/*trust*.py"
      - "backend/**/models/*envelope*.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "contracts/trust-api/**"
      - "scripts/ci/validate_b25_p1_contracts.py"
      - "scripts/ci/validate_b25_p1_trust_drift.py"
      - "Makefile"
      - ".github/workflows/b2_5-p1-contracts.yml"
      - "backend/**/trust*.py"
      - "backend/**/trust_envelope*.py"
      - "backend/**/schemas/*trust*.py"
      - "backend/**/schemas/*envelope*.py"
      - "backend/**/models/*trust*.py"
      - "backend/**/models/*envelope*.py"
  workflow_dispatch:

concurrency:
  # Keyed on event_name as well as PR number: a workflow that declares both
  # pull_request and pull_request_target fires twice for the same PR, and without
  # the event in the group the two runs share it and cancel each other - which
  # cancelled three required contexts on PR #653 before this was fixed.
  # PR events: one live run per workflow per PR - a new push supersedes the old.
  # push: run_id is unique, so those runs are never cancelled
  # and never queued. The audit proof on an exact SHA always runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  b25-p1-contract-authority:
    name: B2.5-P1 Contract Authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0" "jsonschema>=4.25.0"

      - name: Validate B2.5-P1 contract authority and negative controls
        run: make validate-b25-p1-contracts

      - name: Validate B2.5-P1 TrustEnvelope drift tripwire
        run: make validate-b25-p1-trust-drift

name: Setup Postgres CI Database
description: Prepare the least-privilege CI database boundary and run Alembic migrations.

inputs:
  admin-dsn:
    description: Superuser/admin PostgreSQL DSN.
    required: false
    default: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  database-name:
    description: Database name to create or normalize.
    required: true
  runtime-user:
    description: Runtime database principal.
    required: false
    default: app_user
  runtime-password:
    description: Runtime database password.
    required: false
    default: app_user
  migration-user:
    description: Migration database principal.
    required: false
    default: migration_owner
  migration-password:
    description: Migration database password.
    required: false
    default: migration_owner
  app-rw-role:
    description: Application read/write role.
    required: false
    default: app_rw
  app-ro-role:
    description: Application read-only role.
    required: false
    default: app_ro
  worker-user:
    description: Bayesian planner/worker database principal.
    required: false
    default: app_worker
  worker-password:
    description: Bayesian planner/worker database password.
    required: false
    default: app_worker
  publisher-user:
    description: Dedicated cross-tenant fit-dispatch publisher principal.
    required: false
    default: app_dispatch_publisher
  publisher-password:
    description: Dedicated fit-dispatch publisher password.
    required: false
    default: app_dispatch_publisher
  trust-issuer-user:
    description: Dedicated Trust issuance-consequence principal.
    required: false
    default: app_trust_issuer
  trust-issuer-password:
    description: Dedicated Trust issuance-consequence password.
    required: false
    default: app_trust_issuer
  migration-command:
    description: Alembic migration command.
    required: false
    default: alembic upgrade head
  revoke-alembic-version:
    description: Revoke runtime access to alembic_version after migration.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Prepare migration authority boundary
      shell: bash
      run: |
        python scripts/database/prepare_migration_authority_boundary.py \
          --admin-dsn "${{ inputs.admin-dsn }}" \
          --database-name "${{ inputs.database-name }}" \
          --runtime-user "${{ inputs.runtime-user }}" \
          --runtime-password "${{ inputs.runtime-password }}" \
          --migration-user "${{ inputs.migration-user }}" \
          --migration-password "${{ inputs.migration-password }}" \
          --app-rw-role "${{ inputs.app-rw-role }}" \
          --app-ro-role "${{ inputs.app-ro-role }}" \
          --worker-user "${{ inputs.worker-user }}" \
          --worker-password "${{ inputs.worker-password }}" \
          --publisher-user "${{ inputs.publisher-user }}" \
          --publisher-password "${{ inputs.publisher-password }}" \
          --trust-issuer-user "${{ inputs.trust-issuer-user }}" \
          --trust-issuer-password "${{ inputs.trust-issuer-password }}" \
          --trust-signer-user app_trust_signer \
          --trust-signer-password app_trust_signer \
          --b28-requester-user app_b28_requester \
          --b28-requester-password app_b28_requester \
          --b28-solver-user app_b28_solver \
          --b28-solver-password app_b28_solver

    # B2.5-P13 Corrective XVI (XVI-B). Every job that provisions this boundary
    # gets the issuance DSN automatically, so no job can silently run the Trust
    # API with issuance-consequence authority folded back into the ordinary
    # runtime principal.
    #
    # B2.5-P14 Corrective V extends the same rule to B2.8. A durable request is
    # the claim that a verified caller asked; a durable result is the claim that
    # the governed solver ran. Each gets its own login here for the reason the
    # issuer and signer have theirs: a credential the whole process can spend is
    # not a dedicated credential, and the consequence guards key on
    # `session_user`, which SET ROLE cannot forge.
    - name: Export Trust issuance custody DSN
      shell: bash
      run: |
        echo "TRUST_ISSUANCE_DATABASE_URL=postgresql://${{ inputs.trust-issuer-user }}:${{ inputs.trust-issuer-password }}@127.0.0.1:5432/${{ inputs.database-name }}" >> "$GITHUB_ENV"
        echo "TRUST_SIGNER_DATABASE_URL=postgresql://app_trust_signer:app_trust_signer@127.0.0.1:5432/${{ inputs.database-name }}" >> "$GITHUB_ENV"
        echo "B28_REQUEST_DATABASE_URL=postgresql://app_b28_requester:app_b28_requester@127.0.0.1:5432/${{ inputs.database-name }}" >> "$GITHUB_ENV"
        echo "B28_SOLVER_DATABASE_URL=postgresql://app_b28_solver:app_b28_solver@127.0.0.1:5432/${{ inputs.database-name }}" >> "$GITHUB_ENV"

    - name: Run Alembic migrations
      shell: bash
      env:
        DATABASE_URL: postgresql://${{ inputs.migration-user }}:${{ inputs.migration-password }}@127.0.0.1:5432/${{ inputs.database-name }}
        MIGRATION_DATABASE_URL: postgresql://${{ inputs.migration-user }}:${{ inputs.migration-password }}@127.0.0.1:5432/${{ inputs.database-name }}
      run: |
        ${{ inputs.migration-command }}

    - name: Enforce migration metadata least privilege
      if: ${{ inputs.revoke-alembic-version == 'true' }}
      shell: bash
      env:
        PGPASSWORD: postgres
      run: |
        psql -h 127.0.0.1 -U postgres -d "${{ inputs.database-name }}" \
          -c "REVOKE ALL ON TABLE public.alembic_version FROM ${{ inputs.runtime-user }};"

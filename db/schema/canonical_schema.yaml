# ============================================================================
# CANONICAL SCHEMA METADATA
# ============================================================================
# Source: UPDATED SKELDIR BACKEND ARCHITECTURE GUIDE (§3.1)
# Purpose: Structured metadata for schema validation and tooling
# Version: 1.0.0
# Last Updated: 2025-11-15
# ============================================================================

version: "1.0.0"
source: "UPDATED SKELDIR BACKEND ARCHITECTURE GUIDE §3.1"
generated_date: "2025-11-15"

# Invariant Categories and Severity Levels
invariant_categories:
  auth_critical:
    severity: BLOCKING
    description: "Required for API authentication and authorization"
    impact: "B0.4 API auth will fail; downstream services cannot authenticate"
    
  privacy_critical:
    severity: BLOCKING
    description: "Required for GDPR compliance and tenant isolation"
    impact: "Privacy violations; multi-tenant data leakage possible"
    
  processing_critical:
    severity: BLOCKING
    description: "Required for event processing and background worker queues"
    impact: "B0.4 ingestion and B0.5 workers cannot function"
    
  financial_critical:
    severity: BLOCKING
    description: "Required for revenue tracking and reconciliation"
    impact: "B2.2 webhooks, B2.3 currency conversion, B2.4 refunds blocked"
    
  analytics_important:
    severity: HIGH
    description: "Required for statistical attribution and reporting"
    impact: "B2.1 attribution models cannot write statistical metadata"

# Canonical Tables
tables:
  tenants:
    purpose: "Store tenant information for multi-tenant isolation"
    rls_enabled: true
    columns:
      id:
        type: UUID
        nullable: false
        primary_key: true
        default: "gen_random_uuid()"
        invariant: null
        
      name:
        type: VARCHAR(255)
        nullable: false
        invariant: null
        
      api_key_hash:
        type: VARCHAR(255)
        nullable: false
        unique: true
        invariant: auth_critical
        required_for: ["B0.4 API Authentication"]
        
      notification_email:
        type: VARCHAR(255)
        nullable: false
        invariant: auth_critical
        required_for: ["B0.4 Tenant Notifications"]
        
      created_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
      updated_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
    constraints:
      - name: ck_tenants_name_not_empty
        type: CHECK
        definition: "LENGTH(TRIM(name)) > 0"
        
    indexes:
      - name: idx_tenants_name
        columns: [name]
        unique: false
        
      - name: idx_tenants_api_key_hash
        columns: [api_key_hash]
        unique: true
        
    rls_policy:
      name: tenant_isolation_policy
      using: "id = current_setting('app.current_tenant_id')::UUID"
      with_check: "id = current_setting('app.current_tenant_id')::UUID"

  attribution_events:
    purpose: "Store attribution events for revenue tracking and attribution"
    rls_enabled: true
    columns:
      id:
        type: UUID
        nullable: false
        primary_key: true
        default: "gen_random_uuid()"
        invariant: null
        
      tenant_id:
        type: UUID
        nullable: false
        foreign_key: "tenants(id) ON DELETE CASCADE"
        invariant: privacy_critical
        
      session_id:
        type: UUID
        nullable: false
        invariant: privacy_critical
        required_for: ["Attribution Logic"]
        
      idempotency_key:
        type: VARCHAR(255)
        nullable: false
        unique: true
        invariant: processing_critical
        required_for: ["B0.4 Idempotent Ingestion"]
        
      event_type:
        type: VARCHAR(50)
        nullable: false
        invariant: processing_critical
        required_for: ["B0.4 Event Classification"]
        values: [click, impression, purchase]
        
      channel:
        type: VARCHAR(100)
        nullable: false
        invariant: processing_critical
        required_for: ["B0.4 Channel Taxonomy", "B2.1 Attribution"]
        
      campaign_id:
        type: VARCHAR(255)
        nullable: true
        invariant: analytics_important
        
      conversion_value_cents:
        type: INTEGER
        nullable: true
        invariant: financial_critical
        
      currency:
        type: VARCHAR(3)
        nullable: true
        default: "USD"
        invariant: financial_critical
        required_for: ["B2.3 Multi-Currency Support"]
        
      event_timestamp:
        type: TIMESTAMPTZ
        nullable: false
        invariant: processing_critical
        
      processed_at:
        type: TIMESTAMPTZ
        nullable: true
        default: "now()"
        invariant: processing_critical
        
      processing_status:
        type: VARCHAR(20)
        nullable: false
        default: "pending"
        invariant: processing_critical
        required_for: ["B0.5 Background Worker Queue"]
        values: [pending, processed, failed]
        
      retry_count:
        type: INTEGER
        nullable: false
        default: 0
        invariant: processing_critical
        
      raw_payload:
        type: JSONB
        nullable: false
        invariant: null
        
      created_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
      updated_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
    constraints:
      - name: ck_attribution_events_revenue_positive
        type: CHECK
        definition: "conversion_value_cents IS NULL OR conversion_value_cents >= 0"
        
      - name: ck_attribution_events_processing_status_valid
        type: CHECK
        definition: "processing_status IN ('pending', 'processed', 'failed')"
        
    indexes:
      - name: idx_events_tenant_timestamp
        columns: [tenant_id, event_timestamp]
        unique: false
        ops: {event_timestamp: DESC}
        
      - name: idx_events_processing_status
        columns: [processing_status, processed_at]
        unique: false
        where: "processing_status = 'pending'"
        
      - name: uq_attribution_events_tenant_idempotency_key
        columns: [tenant_id, idempotency_key]
        unique: true
        
      - name: idx_attribution_events_session_id
        columns: [session_id]
        unique: false
        where: "session_id IS NOT NULL"
        
    rls_policy:
      name: tenant_isolation_policy
      using: "tenant_id = current_setting('app.current_tenant_id')::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id')::UUID"

  attribution_allocations:
    purpose: "Store attribution model results (channel credit assignments)"
    rls_enabled: true
    columns:
      id:
        type: UUID
        nullable: false
        primary_key: true
        default: "gen_random_uuid()"
        invariant: null
        
      tenant_id:
        type: UUID
        nullable: false
        foreign_key: "tenants(id) ON DELETE CASCADE"
        invariant: privacy_critical
        
      event_id:
        type: UUID
        nullable: true
        foreign_key: "attribution_events(id) ON DELETE SET NULL"
        invariant: null

      recompute_job_id:
        type: UUID
        nullable: true
        foreign_key: "attribution_recompute_jobs(id) ON DELETE CASCADE"
        invariant: analytics_important
        
      created_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
      updated_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
      channel_code:
        type: TEXT
        nullable: false
        foreign_key: "channel_taxonomy(code)"
        invariant: processing_critical
        
      allocated_revenue_cents:
        type: INTEGER
        nullable: false
        default: 0
        invariant: financial_critical
        
      model_metadata:
        type: JSONB
        nullable: true
        invariant: analytics_important
        
      correlation_id:
        type: UUID
        nullable: true
        invariant: null
        
      allocation_ratio:
        type: NUMERIC(6,5)
        nullable: false
        default: 0.0
        invariant: analytics_important
        
      model_version:
        type: TEXT
        nullable: false
        invariant: analytics_important
        
      model_type:
        type: VARCHAR(50)
        nullable: false
        invariant: analytics_important
        
      confidence_score:
        type: NUMERIC(4,3)
        nullable: false
        invariant: analytics_important
        required_for: ["B2.1 Statistical Attribution"]
        check: "confidence_score >= 0 AND confidence_score <= 1"
        
      credible_interval_lower_cents:
        type: INTEGER
        nullable: true
        invariant: analytics_important
        
      credible_interval_upper_cents:
        type: INTEGER
        nullable: true
        invariant: analytics_important
        
      convergence_r_hat:
        type: NUMERIC(5,4)
        nullable: true
        invariant: analytics_important
        
      effective_sample_size:
        type: INTEGER
        nullable: true
        invariant: analytics_important
        
      verified:
        type: BOOLEAN
        nullable: false
        default: false
        invariant: analytics_important
        required_for: ["B2.4 Revenue Verification"]
        
      verification_source:
        type: VARCHAR(50)
        nullable: true
        invariant: analytics_important
        
      verification_timestamp:
        type: TIMESTAMPTZ
        nullable: true
        invariant: analytics_important
        
    constraints:
      - name: ck_attribution_allocations_revenue_positive
        type: CHECK
        definition: "allocated_revenue_cents >= 0"
      - name: ck_attribution_allocations_allocation_ratio_bounds
        type: CHECK
        definition: "allocation_ratio >= 0 AND allocation_ratio <= 1"
      - name: ck_allocations_confidence_score
        type: CHECK
        definition: "confidence_score >= 0 AND confidence_score <= 1"
        
    indexes:
      - name: idx_attribution_allocations_tenant_created_at
        columns: [tenant_id, created_at]
        unique: false
        ops: {created_at: DESC}
        
      - name: idx_attribution_allocations_event_id
        columns: [event_id]
        unique: false
        
      - name: idx_allocations_channel_performance
        columns: [tenant_id, channel_code, created_at]
        unique: false
        ops: {created_at: DESC}
        include: [allocated_revenue_cents, confidence_score]
        
      - name: idx_attribution_allocations_channel
        columns: [channel_code]
        unique: false
        
      - name: idx_attribution_allocations_tenant_event_model_channel
        columns: [tenant_id, event_id, model_version, channel_code]
        unique: true
        where: "model_version IS NOT NULL AND recompute_job_id IS NULL"

      - name: idx_attribution_allocations_tenant_event_projection_channel
        columns: [tenant_id, event_id, recompute_job_id, channel_code]
        unique: true
        where: "recompute_job_id IS NOT NULL"

      - name: idx_attribution_allocations_tenant_event_projection
        columns: [tenant_id, event_id, recompute_job_id]
        unique: false
        where: "recompute_job_id IS NOT NULL"
        
      - name: idx_attribution_allocations_tenant_model_version
        columns: [tenant_id, model_version]
        unique: false
        
    rls_policy:
      name: tenant_isolation_policy
      using: "tenant_id = current_setting('app.current_tenant_id')::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id')::UUID"

  revenue_ledger:
    purpose: "Transaction-centric revenue tracking with state machine"
    rls_enabled: true
    columns:
      id:
        type: UUID
        nullable: false
        primary_key: true
        default: "gen_random_uuid()"
        invariant: null
        
      tenant_id:
        type: UUID
        nullable: false
        foreign_key: "tenants(id) ON DELETE CASCADE"
        invariant: privacy_critical
        
      transaction_id:
        type: VARCHAR(255)
        nullable: false
        unique: true
        invariant: financial_critical
        required_for: ["B2.2 Webhook Idempotency"]
        
      order_id:
        type: VARCHAR(255)
        nullable: true
        invariant: financial_critical
        
      state:
        type: VARCHAR(50)
        nullable: false
        invariant: financial_critical
        required_for: ["B2.4 Refund Tracking"]
        values: [authorized, captured, refunded, chargeback]
        
      previous_state:
        type: VARCHAR(50)
        nullable: true
        invariant: financial_critical
        
      amount_cents:
        type: INTEGER
        nullable: false
        invariant: financial_critical
        
      currency:
        type: VARCHAR(3)
        nullable: false
        invariant: financial_critical
        required_for: ["B2.3 Currency Conversion"]
        
      verification_source:
        type: VARCHAR(50)
        nullable: false
        invariant: financial_critical
        
      verification_timestamp:
        type: TIMESTAMPTZ
        nullable: false
        invariant: financial_critical
        
      metadata:
        type: JSONB
        nullable: true
        invariant: null
        
      created_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
      updated_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
    constraints:
      - name: ck_revenue_ledger_amount_positive
        type: CHECK
        definition: "amount_cents >= 0"
        
      - name: ck_revenue_ledger_state_valid
        type: CHECK
        definition: "state IN ('authorized', 'captured', 'refunded', 'chargeback')"
        
    indexes:
      - name: idx_revenue_ledger_transaction_id
        columns: [transaction_id]
        unique: true
        
      - name: idx_revenue_ledger_tenant_state
        columns: [tenant_id, state, created_at]
        unique: false
        ops: {created_at: DESC}
        
      - name: idx_revenue_ledger_state
        columns: [state]
        unique: false
        
    rls_policy:
      name: tenant_isolation_policy
      using: "tenant_id = current_setting('app.current_tenant_id')::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id')::UUID"

  revenue_state_transitions:
    purpose: "Audit trail for revenue state changes (refunds, chargebacks)"
    rls_enabled: false
    columns:
      id:
        type: UUID
        nullable: false
        primary_key: true
        default: "gen_random_uuid()"
        invariant: null
        
      ledger_id:
        type: UUID
        nullable: false
        foreign_key: "revenue_ledger(id) ON DELETE CASCADE"
        invariant: financial_critical
        
      from_state:
        type: VARCHAR(50)
        nullable: true
        invariant: financial_critical
        
      to_state:
        type: VARCHAR(50)
        nullable: false
        invariant: financial_critical
        
      reason:
        type: TEXT
        nullable: true
        invariant: null
        
      transitioned_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: null
        
    indexes:
      - name: idx_revenue_state_transitions_ledger_id
        columns: [ledger_id, transitioned_at]
        unique: false
        ops: {transitioned_at: DESC}

  dead_events:
    purpose: "Quarantine failed events with retry tracking"
    rls_enabled: true
    columns:
      id:
        type: UUID
        nullable: false
        primary_key: true
        default: "gen_random_uuid()"
        invariant: null
        
      tenant_id:
        type: UUID
        nullable: false
        foreign_key: "tenants(id) ON DELETE CASCADE"
        invariant: privacy_critical
        
      ingested_at:
        type: TIMESTAMPTZ
        nullable: false
        default: "now()"
        invariant: processing_critical
        
      source:
        type: TEXT
        nullable: false
        invariant: processing_critical
        
      error_code:
        type: TEXT
        nullable: false
        invariant: processing_critical
        
      error_detail:
        type: JSONB
        nullable: false
        invariant: processing_critical
        
      correlation_id:
        type: UUID
        nullable: true
        invariant: null
        
      external_event_id:
        type: TEXT
        nullable: true
        invariant: null
        
      event_type:
        type: VARCHAR(50)
        nullable: false
        invariant: processing_critical
        
      raw_payload:
        type: JSONB
        nullable: false
        invariant: null
        
      error_type:
        type: VARCHAR(100)
        nullable: false
        invariant: processing_critical
        
      error_message:
        type: TEXT
        nullable: false
        invariant: processing_critical
        
      error_traceback:
        type: TEXT
        nullable: true
        invariant: null
        
      retry_count:
        type: INTEGER
        nullable: false
        default: 0
        invariant: processing_critical
        required_for: ["B0.5 Retry Logic"]
        
      last_retry_at:
        type: TIMESTAMPTZ
        nullable: true
        invariant: processing_critical
        
      remediation_status:
        type: VARCHAR(20)
        nullable: false
        default: "pending"
        invariant: processing_critical
        required_for: ["B0.5 Background Remediation"]
        values: [pending, in_progress, resolved, abandoned]
        
      remediation_notes:
        type: TEXT
        nullable: true
        invariant: null
        
      resolved_at:
        type: TIMESTAMPTZ
        nullable: true
        invariant: null
        
    constraints:
      - name: ck_dead_events_remediation_status_valid
        type: CHECK
        definition: "remediation_status IN ('pending', 'in_progress', 'resolved', 'abandoned')"
        
    indexes:
      - name: idx_dead_events_tenant_ingested_at
        columns: [tenant_id, ingested_at]
        unique: false
        ops: {ingested_at: DESC}
        
      - name: idx_dead_events_error_code
        columns: [error_code]
        unique: false
        
      - name: idx_dead_events_remediation
        columns: [remediation_status, ingested_at]
        unique: false
        ops: {ingested_at: DESC}
        
      - name: idx_dead_events_source
        columns: [source]
        unique: false
        
    rls_policy:
      name: tenant_isolation_policy
      using: "tenant_id = current_setting('app.current_tenant_id')::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id')::UUID"

  bayesian_model_fits:
    purpose: "B2.4-P1 tenant-scoped Bayesian fit authority records; persistence only"
    rls_enabled: true
    primary_key_strategy:
      type: composite tenant-scoped UUID
      columns: [tenant_id, id]
      default: "gen_random_uuid()"
      rationale: "Retains existing Skeldir UUID convention while using PRIMARY KEY (tenant_id, id) so HASH partitioning by tenant_id is PostgreSQL-valid and tenant-bound artifact FKs remain relationally enforced."
    partitioning:
      strategy: HASH
      key: [tenant_id]
      partitions: 16
      rationale: "Final physical table family for P1; tenant-scoped RLS and query paths prune by tenant while preserving window-inclusive identity and tenant-bound artifact linkage."
    storage:
      fit_partition_fillfactor: 90
      table_family: partitioned
    columns:
      id: {type: UUID, nullable: false, primary_key_component: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, primary_key_component: true, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      model_type: {type: VARCHAR(64), nullable: false}
      model_version: {type: VARCHAR(64), nullable: false}
      source_window_start: {type: TIMESTAMPTZ, nullable: false}
      source_window_end: {type: TIMESTAMPTZ, nullable: false}
      source_snapshot_hash: {type: VARCHAR(64), nullable: false, format: lowercase_sha256_hex}
      status: {type: VARCHAR(32), nullable: false, default: pending, values: [pending, queued, running, succeeded, failed, fallback_only, cancelled]}
      eligibility_status: {type: VARCHAR(32), nullable: false, default: unknown, values: [unknown, eligible, ineligible, fallback_only]}
      data_completeness_status: {type: VARCHAR(32), nullable: false, default: unknown, values: [unknown, complete, partial, insufficient, stale]}
      fallback_applied: {type: BOOLEAN, nullable: false, default: false}
      fallback_reason: {type: VARCHAR(64), nullable: true, values: [source_window_empty, insufficient_data, insufficient_privacy_cohort, input_too_large, feature_width_exceeded, source_window_too_large, memory_bound_exceeded, graph_complexity_exceeded, parameter_count_exceeded, hierarchy_width_exceeded, compilation_memory_bound_exceeded, cardinality_authority_missing, cardinality_authority_stale, cardinality_authority_mismatch, cardinality_authority_timeout, cardinality_authority_build_failed, source_profile_unavailable, timeout, worker_failure, no_convergence, resource_bound_exceeded, source_unavailable, duplicate_fit_suppressed, artifact_unavailable, storage_quota_exceeded]}
      sampling_started_at: {type: TIMESTAMPTZ, nullable: true}
      last_eligibility_check_at: {type: TIMESTAMPTZ, nullable: true}
      last_fit_at: {type: TIMESTAMPTZ, nullable: true}
      completed_at: {type: TIMESTAMPTZ, nullable: true}
      runtime_seconds: {type: INTEGER, nullable: true}
      max_runtime_seconds: {type: INTEGER, nullable: false, default: 60}
      max_samples: {type: INTEGER, nullable: false, default: 0}
      max_cores: {type: INTEGER, nullable: false, default: 1}
      n_chains: {type: INTEGER, nullable: true}
      n_samples_actual: {type: INTEGER, nullable: true}
      r_hat_max: {type: DOUBLE PRECISION, nullable: true}
      ess_min: {type: DOUBLE PRECISION, nullable: true}
      divergence_count: {type: INTEGER, nullable: true}
      credible_interval_status: {type: VARCHAR(32), nullable: false, default: not_available, values: [not_available, available, suppressed, invalid, pending]}
      confidence_bucket: {type: VARCHAR(32), nullable: true, values: [unavailable, low, medium, high, fallback, needs_review]}
      confidence_bucket_reason: {type: VARCHAR(255), nullable: true}
      confidence_policy_version: {type: VARCHAR(64), nullable: true}
      artifact_ref: {type: VARCHAR(255), nullable: true}
      artifact_hash: {type: VARCHAR(64), nullable: true, format: lowercase_sha256_hex}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: ck_bayesian_model_fits_source_snapshot_hash_sha256, type: CHECK, definition: "source_snapshot_hash matches ^[a-f0-9]{64}$"}
      - {name: ck_bayesian_model_fits_artifact_hash_sha256, type: CHECK, definition: "artifact_hash is null or matches ^[a-f0-9]{64}$"}
      - {name: ck_bayesian_model_fits_source_window_order, type: CHECK, definition: "source_window_end > source_window_start"}
      - {name: bayesian_model_fits_pkey, type: PRIMARY KEY, columns: [tenant_id, id]}
      - {name: uq_bayesian_model_fits_tenant_model_window_snapshot, type: UNIQUE, columns: [tenant_id, model_type, model_version, source_window_start, source_window_end, source_snapshot_hash]}
    indexes:
      - {name: idx_bayesian_model_fits_tenant_id, columns: [tenant_id]}
      - {name: idx_bayesian_model_fits_tenant_model_window, columns: [tenant_id, model_type, source_window_start, source_window_end]}
      - {name: idx_bayesian_model_fits_tenant_source_snapshot_hash, columns: [tenant_id, source_snapshot_hash]}
      - {name: idx_bayesian_model_fits_tenant_status, columns: [tenant_id, status]}
      - {name: idx_bayesian_model_fits_tenant_model_eligibility, columns: [tenant_id, model_type, eligibility_status, "last_eligibility_check_at DESC"]}
      - {name: idx_bayesian_model_fits_tenant_model_fallback, columns: [tenant_id, model_type, fallback_reason, "last_eligibility_check_at DESC"], where: "fallback_applied = true"}
      - {name: idx_bayesian_model_fits_tenant_model_window_latest, columns: [tenant_id, model_type, source_window_start, source_window_end, "created_at DESC"]}
    rls_policy:
      name: tenant_isolation_policy_bayesian_model_fits
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  b24_dirty_events:
    purpose: "B2.4-P3 append-only dirty source-change events emitted by deterministic hot paths"
    rls_enabled: true
    columns:
      id: {type: UUID, nullable: false, primary_key_component: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, primary_key_component: true, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      model_type: {type: VARCHAR(64), nullable: false}
      model_version: {type: VARCHAR(64), nullable: false}
      source_window_start: {type: TIMESTAMPTZ, nullable: false}
      source_window_end: {type: TIMESTAMPTZ, nullable: false}
      dirty_reason: {type: VARCHAR(64), nullable: false}
      source_family: {type: VARCHAR(64), nullable: false}
      event_hash: {type: VARCHAR(64), nullable: true, format: lowercase_sha256_hex}
      source_event_id: {type: VARCHAR(128), nullable: true}
      status: {type: VARCHAR(32), nullable: false, default: pending, values: [pending, leased, coalesced, claimed, suppressed, fallback_only, superseded, dispatched, authority_waiting, authority_retry_ready, authority_timeout, authority_build_failed, pruned]}
      planner_owner: {type: VARCHAR(128), nullable: true}
      observed_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      source_snapshot_hash: {type: VARCHAR(64), nullable: true, format: lowercase_sha256_hex}
      authority_retry_count: {type: INTEGER, nullable: false, default: 0}
      authority_retry_after_at: {type: TIMESTAMPTZ, nullable: true}
      authority_wait_started_at: {type: TIMESTAMPTZ, nullable: true}
      authority_reactivated_at: {type: TIMESTAMPTZ, nullable: true}
      authority_terminal_at: {type: TIMESTAMPTZ, nullable: true}
    constraints:
      - {name: b24_dirty_events_pkey, type: PRIMARY KEY, columns: [tenant_id, id]}
      - {name: ck_b24_dirty_events_event_hash_sha256, type: CHECK, definition: "event_hash is null or matches ^[a-f0-9]{64}$"}
      - {name: ck_b24_dirty_events_source_snapshot_hash_sha256, type: CHECK, definition: "source_snapshot_hash is null or matches ^[a-f0-9]{64}$"}
      - {name: ck_b24_dirty_events_authority_retry_count_nonnegative, type: CHECK, definition: "authority_retry_count >= 0"}
      - {name: ck_b24_dirty_events_source_window_order, type: CHECK, definition: "source_window_end > source_window_start"}
    indexes:
      - {name: idx_b24_dirty_events_tenant_status_observed, columns: [tenant_id, status, observed_at, id]}
      - {name: idx_b24_dirty_events_tenant_model_window_pending, columns: [tenant_id, model_type, model_version, source_window_start, source_window_end, observed_at, id], where: "status IN ('pending', 'leased')"}
      - {name: idx_b24_dirty_events_tenant_event_hash, columns: [tenant_id, event_hash], where: "event_hash IS NOT NULL"}
      - {name: idx_b24_dirty_events_authority_retry_ready, columns: [tenant_id, status, authority_retry_after_at, observed_at, id], where: "status IN ('authority_waiting', 'authority_retry_ready')"}
    rls_policy:
      name: tenant_isolation_policy_b24_dirty_events
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  b24_feature_authority_build_requests:
    purpose: "B2.4-P4 transient feature-authority build/rebuild requests keyed by source snapshot"
    rls_enabled: true
    columns:
      tenant_id: {type: UUID, nullable: false, primary_key_component: true, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      model_type: {type: VARCHAR(64), nullable: false, primary_key_component: true}
      model_version: {type: VARCHAR(64), nullable: false, primary_key_component: true}
      source_window_start: {type: TIMESTAMPTZ, nullable: false, primary_key_component: true}
      source_window_end: {type: TIMESTAMPTZ, nullable: false, primary_key_component: true}
      source_snapshot_hash: {type: VARCHAR(64), nullable: false, primary_key_component: true, format: lowercase_sha256_hex}
      status: {type: VARCHAR(32), nullable: false, default: authority_build_requested, values: [authority_build_requested, authority_waiting, authority_retry_ready, authority_completed, authority_timeout, authority_build_failed]}
      authority_reason: {type: VARCHAR(64), nullable: false, values: [cardinality_authority_missing, cardinality_authority_stale, cardinality_authority_mismatch]}
      detail: {type: TEXT, nullable: true}
      retry_count: {type: INTEGER, nullable: false, default: 0}
      max_retries: {type: INTEGER, nullable: false, default: 5}
      retry_after_at: {type: TIMESTAMPTZ, nullable: true}
      requested_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      completed_at: {type: TIMESTAMPTZ, nullable: true}
      terminal_reason: {type: VARCHAR(64), nullable: true, values: [cardinality_authority_timeout, cardinality_authority_build_failed]}
      terminal_at: {type: TIMESTAMPTZ, nullable: true}
      policy_version: {type: VARCHAR(64), nullable: false}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: b24_feature_authority_build_requests_pkey, type: PRIMARY KEY, columns: [tenant_id, model_type, model_version, source_window_start, source_window_end, source_snapshot_hash]}
      - {name: ck_b24_feature_authority_request_snapshot_hash_sha256, type: CHECK, definition: "source_snapshot_hash matches ^[a-f0-9]{64}$"}
      - {name: ck_b24_feature_authority_request_window_order, type: CHECK, definition: "source_window_end > source_window_start"}
      - {name: ck_b24_feature_authority_request_retry_count, type: CHECK, definition: "retry_count >= 0"}
      - {name: ck_b24_feature_authority_request_max_retries, type: CHECK, definition: "max_retries > 0"}
    indexes:
      - {name: idx_b24_feature_authority_build_requests_due, columns: [tenant_id, status, retry_after_at, requested_at]}
    rls_policy:
      name: tenant_isolation_policy_b24_feature_authority_build_requests
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  b24_active_execution_leases:
    purpose: "B2.4-P3 active execution lock keyed by tenant/model/version/window, independent of source_snapshot_hash"
    rls_enabled: true
    columns:
      tenant_id: {type: UUID, nullable: false, primary_key_component: true, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      model_type: {type: VARCHAR(64), nullable: false, primary_key_component: true}
      model_version: {type: VARCHAR(64), nullable: false, primary_key_component: true}
      source_window_start: {type: TIMESTAMPTZ, nullable: false, primary_key_component: true}
      source_window_end: {type: TIMESTAMPTZ, nullable: false, primary_key_component: true}
      fit_id: {type: UUID, nullable: true, foreign_key: "bayesian_model_fits(tenant_id, id) via (tenant_id, fit_id) ON DELETE RESTRICT"}
      active_source_snapshot_hash: {type: VARCHAR(64), nullable: true, format: lowercase_sha256_hex}
      latest_desired_source_snapshot_hash: {type: VARCHAR(64), nullable: true, format: lowercase_sha256_hex}
      status: {type: VARCHAR(32), nullable: false, default: claiming, values: [profiling, profile_passed, profile_rejected, profile_superseded, profile_timeout, profile_failed, claiming, dispatch_pending, dispatched, running, cancel_requested, succeeded, failed, fallback_only, cancelled, stale_recovered]}
      needs_refit_after_current: {type: BOOLEAN, nullable: false, default: false}
      leased_until: {type: TIMESTAMPTZ, nullable: false}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: b24_active_execution_leases_pkey, type: PRIMARY KEY, columns: [tenant_id, model_type, model_version, source_window_start, source_window_end]}
      - {name: fk_b24_active_execution_fit, type: FOREIGN KEY, columns: [tenant_id, fit_id], references: "bayesian_model_fits(tenant_id, id)", on_delete: RESTRICT}
      - {name: ck_b24_active_execution_active_hash_sha256, type: CHECK, definition: "active_source_snapshot_hash is null or matches ^[a-f0-9]{64}$"}
      - {name: ck_b24_active_execution_desired_hash_sha256, type: CHECK, definition: "latest_desired_source_snapshot_hash is null or matches ^[a-f0-9]{64}$"}
      - {name: ck_b24_active_execution_status, type: CHECK, definition: "status is one of profiling, profile_passed, profile_rejected, profile_superseded, profile_timeout, profile_failed, claiming, dispatch_pending, dispatched, running, cancel_requested, succeeded, failed, fallback_only, cancelled, stale_recovered"}
      - {name: ck_b24_active_execution_active_fit_required, type: CHECK, definition: "claiming/profile states may omit fit_id; execution/output states require fit_id"}
    indexes:
      - {name: idx_b24_active_execution_tenant_status_lease, columns: [tenant_id, status, leased_until]}
      - {name: idx_b24_active_execution_canonical_profiling, columns: [tenant_id, model_type, model_version, source_window_start, source_window_end, status, leased_until], where: "status = 'profiling'"}
      - {name: idx_b24_active_execution_tenant_fit, columns: [tenant_id, fit_id], where: "fit_id IS NOT NULL"}
      - {name: idx_b24_active_execution_superseded, columns: [tenant_id, model_type, model_version, source_window_start, source_window_end], where: "needs_refit_after_current = true"}
    rls_policy:
      name: tenant_isolation_policy_b24_active_execution_leases
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  b24_fit_dispatch_outbox:
    purpose: "B2.4-P3 transactional queue dispatch outbox committed atomically with fit claim"
    rls_enabled: true
    columns:
      id: {type: UUID, nullable: false, primary_key_component: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, primary_key_component: true, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      fit_id: {type: UUID, nullable: false, foreign_key: "bayesian_model_fits(tenant_id, id) via (tenant_id, fit_id) ON DELETE RESTRICT"}
      dispatch_key: {type: VARCHAR(128), nullable: false}
      status: {type: VARCHAR(32), nullable: false, default: pending, values: [pending, dispatching, dispatched, failed_retryable, dead_lettered, stale_recovered]}
      attempt_count: {type: INTEGER, nullable: false, default: 0}
      max_attempts: {type: INTEGER, nullable: false, default: 5}
      next_attempt_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      last_error: {type: TEXT, nullable: true}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: b24_fit_dispatch_outbox_pkey, type: PRIMARY KEY, columns: [tenant_id, id]}
      - {name: fk_b24_fit_dispatch_outbox_fit, type: FOREIGN KEY, columns: [tenant_id, fit_id], references: "bayesian_model_fits(tenant_id, id)", on_delete: RESTRICT}
      - {name: uq_b24_fit_dispatch_outbox_dispatch_key, type: UNIQUE, columns: [tenant_id, dispatch_key]}
      - {name: uq_b24_fit_dispatch_outbox_fit, type: UNIQUE, columns: [tenant_id, fit_id]}
    indexes:
      - {name: idx_b24_fit_dispatch_outbox_due, columns: [tenant_id, status, next_attempt_at, id], where: "status IN ('pending', 'failed_retryable', 'stale_recovered')"}
      - {name: idx_b24_fit_dispatch_outbox_dispatching, columns: [tenant_id, dispatching_started_at], where: "status = 'dispatching'"}
      - {name: idx_b24_p3_attribution_events_source_stream_fallback, table: attribution_events, columns: [tenant_id, occurred_at, id], rationale: "Non-partial fallback for parameterized P2 source snapshot stream predicates"}
      - {name: idx_b24_p3_attribution_allocations_source_stream_fallback, table: attribution_allocations, columns: [tenant_id, created_at, id], rationale: "Non-partial fallback for parameterized P2 source snapshot stream predicates"}
      - {name: idx_b24_p3_match_verdicts_source_stream_fallback, table: b23_match_verdicts, columns: [tenant_id, last_transition_at, id], rationale: "Non-partial fallback for parameterized P2 source snapshot stream predicates"}
      - {name: idx_b24_p3_revenue_events_source_stream_fallback, table: b23_revenue_events, columns: [tenant_id, event_occurred_at, id], rationale: "Non-partial fallback for parameterized P2 source snapshot stream predicates"}
    rls_policy:
      name: tenant_isolation_policy_b24_fit_dispatch_outbox
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  bayesian_artifacts:
    purpose: "B2.4-P1 tenant-scoped Bayesian artifact authority records; lifecycle jobs out of scope"
    rls_enabled: true
    primary_key_strategy:
      type: composite tenant-scoped UUID
      columns: [tenant_id, id]
      default: "gen_random_uuid()"
      rationale: "Retains existing Skeldir UUID convention while using PRIMARY KEY (tenant_id, id) so artifact authority is partition-compatible and tenant-scoped by construction."
    partitioning:
      strategy: HASH
      key: [tenant_id]
      partitions: 16
      rationale: "Final P1 decision is to partition artifacts now instead of carrying an envelope exception; tenant-scoped artifact lookup, retention, and pruning can operate partition-locally."
    columns:
      id: {type: UUID, nullable: false, primary_key_component: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, primary_key_component: true, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      fit_id: {type: UUID, nullable: false, foreign_key: "bayesian_model_fits(tenant_id, id) via (tenant_id, fit_id) ON DELETE RESTRICT"}
      artifact_ref: {type: VARCHAR(255), nullable: false}
      artifact_hash: {type: VARCHAR(64), nullable: false, format: lowercase_sha256_hex}
      artifact_type: {type: VARCHAR(32), nullable: false, values: [posterior_trace, diagnostics, summary, source_manifest, fit_metadata]}
      storage_backend: {type: VARCHAR(32), nullable: false, values: [postgres, object_storage, local_fs]}
      artifact_uri_internal: {type: VARCHAR(1024), nullable: false}
      artifact_size_bytes: {type: BIGINT, nullable: false}
      compression: {type: VARCHAR(32), nullable: true, values: [none, gzip, zstd]}
      retention_class: {type: VARCHAR(32), nullable: false, values: [ephemeral, standard, audit]}
      expires_at: {type: TIMESTAMPTZ, nullable: true}
      pruned_at: {type: TIMESTAMPTZ, nullable: true}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: ck_bayesian_artifacts_artifact_hash_sha256, type: CHECK, definition: "artifact_hash matches ^[a-f0-9]{64}$"}
      - {name: ck_bayesian_artifacts_size_non_negative, type: CHECK, definition: "artifact_size_bytes >= 0"}
      - {name: bayesian_artifacts_pkey, type: PRIMARY KEY, columns: [tenant_id, id]}
      - {name: fk_bayesian_artifacts_tenant_fit, type: FOREIGN KEY, columns: [tenant_id, fit_id], references: "bayesian_model_fits(tenant_id, id)", on_delete: RESTRICT}
    indexes:
      - {name: idx_bayesian_artifacts_tenant_id, columns: [tenant_id]}
      - {name: idx_bayesian_artifacts_tenant_fit, columns: [tenant_id, fit_id]}
      - {name: idx_bayesian_artifacts_tenant_artifact_ref, columns: [tenant_id, artifact_ref]}
      - {name: idx_bayesian_artifacts_tenant_artifact_hash, columns: [tenant_id, artifact_hash]}
    rls_policy:
      name: tenant_isolation_policy_bayesian_artifacts
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  trust_access_log:
    purpose: "B2.5-P7 tenant-scoped TrustEnvelope access, issuance, refusal, and replay audit authority"
    rls_enabled: true
    force_rls: true
    columns:
      id: {type: UUID, nullable: false, primary_key: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      event_type: {type: TEXT, nullable: false, values: [issuance, refusal, scope_denial, replay]}
      status: {type: TEXT, nullable: false, values: [success, refused, degraded, replayed]}
      request_identity_hash: {type: TEXT, nullable: false, format: "sha256:<hex64>"}
      idempotency_key_hash: {type: TEXT, nullable: false, format: "sha256:<hex64>"}
      subject_type: {type: TEXT, nullable: false}
      subject_ref_hash: {type: TEXT, nullable: true, format: "sha256:<hex64>"}
      envelope_hash: {type: TEXT, nullable: true, format: "sha256:<hex64>"}
      semantic_truth_hash: {type: TEXT, nullable: true, format: "sha256:<hex64>"}
      policy_state: {type: TEXT, nullable: false}
      reason_code: {type: TEXT, nullable: true}
      audit_ref: {type: TEXT, nullable: false, format: "urn:skeldir:audit:<id>"}
      audit_hash: {type: TEXT, nullable: false, format: "sha256:<hex64>"}
      evidence_refs_allowed: {type: BOOLEAN, nullable: false, default: true}
      replay_count: {type: INTEGER, nullable: false, default: 0}
      last_replayed_at: {type: TIMESTAMPTZ, nullable: true}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: trust_access_log_pkey, type: PRIMARY KEY, columns: [id]}
      - {name: trust_access_log_tenant_id_fkey, type: FOREIGN KEY, columns: [tenant_id], references: "tenants(id)", on_delete: CASCADE}
      - {name: uq_trust_access_log_audit_ref, type: UNIQUE, columns: [tenant_id, audit_ref]}
      - {name: uq_trust_access_log_idempotency, type: UNIQUE, columns: [tenant_id, event_type, idempotency_key_hash]}
      - {name: ck_trust_access_log_event_type, type: CHECK, definition: "event_type in issuance/refusal/scope_denial/replay"}
      - {name: ck_trust_access_log_status, type: CHECK, definition: "status in success/refused/degraded/replayed"}
      - {name: ck_trust_access_log_refusal_no_evidence, type: CHECK, definition: "refusal and scope_denial rows have evidence_refs_allowed = false"}
      - {name: ck_trust_access_log_hashes, type: CHECK, definition: "request, idempotency, audit, subject, envelope, and semantic hashes are sha256:<hex64> when present"}
      - {name: ck_trust_access_log_audit_ref, type: CHECK, definition: "audit_ref matches urn:skeldir:audit namespace"}
    indexes:
      - {name: idx_trust_access_log_subject, columns: [tenant_id, subject_type, subject_ref_hash]}
      - {name: idx_trust_access_log_created, columns: [tenant_id, created_at DESC]}
    rls_policy:
      name: tenant_isolation_policy_trust_access_log
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  trust_envelope_issuance_log:

  trust_rate_limit_state:
    purpose: "B2.5-P9 skeleton rate-limit ledger per agent_client_id over a rolling window"
    rls_enabled: true
    force_rls: true
    columns:
      id: {type: UUID, nullable: false, primary_key: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      agent_client_id: {type: UUID, nullable: false, foreign_key: "agent_clients(id) ON DELETE CASCADE"}
      window_started_at: {type: TIMESTAMPTZ, nullable: false}
      window_ended_at: {type: TIMESTAMPTZ, nullable: false}
      request_count: {type: INTEGER, nullable: false, default: 0}
      request_limit: {type: INTEGER, nullable: false}
      last_request_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: trust_rate_limit_state_pkey, type: PRIMARY KEY, columns: [id]}
      - {name: trust_rate_limit_state_tenant_id_fkey, type: FOREIGN KEY, columns: [tenant_id], references: "tenants(id)", on_delete: CASCADE}
      - {name: trust_rate_limit_state_agent_client_id_fkey, type: FOREIGN KEY, columns: [agent_client_id], references: "agent_clients(id)", on_delete: CASCADE}

      - {name: agent_token_revocations_agent_client_id_fkey, type: FOREIGN KEY, columns: [agent_client_id], references: "agent_clients(id)", on_delete: CASCADE}
      - {name: ck_agent_token_revocations_prefix_len, type: CHECK, definition: "length(token_prefix) = 8"}
      - {name: uq_agent_token_revocations_prefix, type: UNIQUE, columns: [tenant_id, token_prefix]}
    indexes:

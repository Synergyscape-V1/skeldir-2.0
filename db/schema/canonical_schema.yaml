      reason_code: {type: TEXT, nullable: false, values: [scope_denied, tenant_mismatch]}
      evidence_refs_leaked: {type: BOOLEAN, nullable: false, default: false}
      audit_ref: {type: TEXT, nullable: false}
      audit_hash: {type: TEXT, nullable: false, format: "sha256:<hex64>"}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
    constraints:
      - {name: trust_scope_denial_events_pkey, type: PRIMARY KEY, columns: [id]}
      - {name: trust_scope_denial_events_tenant_id_fkey, type: FOREIGN KEY, columns: [tenant_id], references: "tenants(id)", on_delete: CASCADE}
      - {name: uq_trust_scope_denial_idempotency, type: UNIQUE, columns: [tenant_id, idempotency_key_hash]}
      - {name: ck_trust_scope_denial_status, type: CHECK, definition: "status = refused"}
      - {name: ck_trust_scope_denial_reason, type: CHECK, definition: "reason_code in scope_denied/tenant_mismatch"}
      - {name: ck_trust_scope_denial_no_evidence_leak, type: CHECK, definition: "evidence_refs_leaked = false and subject_ref_hash is null"}
      - {name: ck_trust_scope_denial_hashes, type: CHECK, definition: "request, idempotency, and audit hashes are sha256:<hex64>"}
    indexes:
      - {name: idx_trust_scope_denial_created, columns: [tenant_id, created_at DESC]}
    rls_policy:
      name: tenant_isolation_policy_trust_scope_denial_events
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"

  agent_clients:
    purpose: "B2.5-P9 tenant-scoped machine-caller (agent) identity authority"
    rls_enabled: true
    force_rls: true
    columns:
      id: {type: UUID, nullable: false, primary_key: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      client_name: {type: TEXT, nullable: false}
      client_display_hash: {type: TEXT, nullable: false, format: "sha256:<hex64>"}
      audience: {type: TEXT, nullable: false}
      status: {type: TEXT, nullable: false, default: "active", values: [active, revoked, suspended]}
      created_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      updated_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      revoked_at: {type: TIMESTAMPTZ, nullable: true}
    constraints:
      - {name: agent_clients_pkey, type: PRIMARY KEY, columns: [id]}
      - {name: agent_clients_tenant_id_fkey, type: FOREIGN KEY, columns: [tenant_id], references: "tenants(id)", on_delete: CASCADE}
      - {name: ck_agent_clients_status, type: CHECK, definition: "status in active/revoked/suspended"}
      - {name: ck_agent_clients_audience_not_empty, type: CHECK, definition: "length(btrim(audience)) > 0"}
      - {name: ck_agent_clients_display_hash, type: CHECK, definition: "client_display_hash ~ ^sha256:[0-9a-f]{64}$"}
      - {name: uq_agent_clients_tenant_name, type: UNIQUE, columns: [tenant_id, client_name]}
    indexes:
      - {name: idx_agent_clients_tenant_status, columns: [tenant_id, status, created_at DESC]}
    rls_policy:
      name: tenant_isolation_policy_agent_clients
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
  agent_service_credentials:
    purpose: "B2.5-P9 CSPRNG-generated machine tokens hashed-at-rest with SHA-256 and O(1) prefix lookup"
    rls_enabled: true
    force_rls: true
    columns:
      id: {type: UUID, nullable: false, primary_key: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      agent_client_id: {type: UUID, nullable: false, foreign_key: "agent_clients(id) ON DELETE CASCADE"}
      token_prefix: {type: TEXT, nullable: false, invariant: credential_lookup_prefix}
      token_hash: {type: TEXT, nullable: false, format: "hex64_sha256"}
      hash_algorithm: {type: TEXT, nullable: false, default: "sha256", values: [sha256]}
      status: {type: TEXT, nullable: false, default: "active", values: [active, revoked, expired]}
      issued_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      expires_at: {type: TIMESTAMPTZ, nullable: true}
      revoked_at: {type: TIMESTAMPTZ, nullable: true}
    constraints:
      - {name: agent_service_credentials_pkey, type: PRIMARY KEY, columns: [id]}
      - {name: agent_service_credentials_tenant_id_fkey, type: FOREIGN KEY, columns: [tenant_id], references: "tenants(id)", on_delete: CASCADE}
      - {name: agent_service_credentials_agent_client_id_fkey, type: FOREIGN KEY, columns: [agent_client_id], references: "agent_clients(id)", on_delete: CASCADE}
      - {name: ck_agent_service_credentials_status, type: CHECK, definition: "status in active/revoked/expired"}
      - {name: ck_agent_service_credentials_hash_algorithm, type: CHECK, definition: "hash_algorithm = sha256"}
      - {name: ck_agent_service_credentials_prefix_len, type: CHECK, definition: "length(token_prefix) = 8"}
      - {name: ck_agent_service_credentials_token_hash, type: CHECK, definition: "token_hash ~ ^[0-9a-f]{64}$"}
      - {name: uq_agent_service_credentials_prefix, type: UNIQUE, columns: [tenant_id, token_prefix]}
    indexes:
      - {name: idx_agent_service_credentials_lookup, columns: [tenant_id, token_prefix, status]}
      - {name: idx_agent_service_credentials_client, columns: [tenant_id, agent_client_id, issued_at DESC]}
    rls_policy:
      name: tenant_isolation_policy_agent_service_credentials
      using: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
      with_check: "tenant_id = current_setting('app.current_tenant_id', true)::UUID"
  agent_scope_grants:
    purpose: "B2.5-P9 governed scope registry with DB-enforced reserved-action-scope rejection"
    rls_enabled: true
    force_rls: true
    columns:
      id: {type: UUID, nullable: false, primary_key: true, default: "gen_random_uuid()"}
      tenant_id: {type: UUID, nullable: false, foreign_key: "tenants(id) ON DELETE CASCADE", invariant: privacy_critical}
      agent_client_id: {type: UUID, nullable: false, foreign_key: "agent_clients(id) ON DELETE CASCADE"}
      scope_value: {type: TEXT, nullable: false, invariant: governed_scope_enum}
      granted_at: {type: TIMESTAMPTZ, nullable: false, default: "now()"}
      revoked_at: {type: TIMESTAMPTZ, nullable: true}
    constraints:
      - {name: agent_scope_grants_pkey, type: PRIMARY KEY, columns: [id]}
      - {name: agent_scope_grants_tenant_id_fkey, type: FOREIGN KEY, columns: [tenant_id], references: "tenants(id)", on_delete: CASCADE}
      - {name: agent_scope_grants_agent_client_id_fkey, type: FOREIGN KEY, columns: [agent_client_id], references: "agent_clients(id)", on_delete: CASCADE}
      - {name: ck_agent_scope_grants_scope_value, type: CHECK, definition: "scope_value in design_partner_scopes AND NOT in reserved_action_scopes"}
      - {name: uq_agent_scope_grants_client_scope, type: UNIQUE, columns: [tenant_id, agent_client_id, scope_value]}
    indexes:
      - {name: idx_agent_scope_grants_lookup, columns: [tenant_id, agent_client_id, scope_value]}
    triggers:

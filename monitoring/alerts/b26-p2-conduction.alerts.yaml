groups:
  - name: b26_p2_conduction
    interval: 1m
    rules:
      # CRITICAL: P2 degradation is no longer a JSON field nobody reads.
      # The probe (scripts/ops/conduction_health_probe.py) ships INSIDE
      # the backend image (backend/Dockerfile) and consumes the
      # independent API observer as compose healthchecks on the relay
      # and beat deployment units (docker-compose.local.yml, against
      # http://api:8000/health/b26-p2-conduction); a degraded signal
      # marks those units unhealthy for the orchestrator. No image-level
      # HEALTHCHECK is set (the image also runs workers/beat, where an
      # API probe would misreport). These alerts fire on the exported
      # signal with page-level urgency.
      - alert: B26_P2_Conduction_ActionRequired
        expr: b26_p2_conduction_action_required > 0
        for: 2m
        labels:
          severity: critical
          component: b26_p2_conduction
          team: backend
        annotations:
          summary: "B2.6-P2 conduction requires operator action"
          description: "Stale, quarantined, actionable-pending, evaluator-absent, or scheduler-plane-absent P2 work persists. The evaluator heartbeat is evaluation-bound (a fresh tick without genuine evaluation is impossible) and the scheduler-plane heartbeat is beat-credential-bound (a relay-side evaluation cannot manufacture scheduler-plane activity), so this alert always denotes real outstanding work. evaluation_fresh != scheduler_plane_active: each absence is an independent operator fact. Scheduler-plane activity proves recent authorized activity, never orchestrator-attested process liveness."
          action: "Inspect GET /health/b26-p2-conduction (pending_actionable_total, stale_unconducted_count, quarantine_count, evaluator_absent_total, scheduler_absent_total, evaluation_fresh, scheduler_plane_active); drain via relay sweep; re-run the evaluator; verify the beat scheduler ticks the scheduler-plane heartbeat inline."

      - alert: B26_P2_Evaluator_Absent
        expr: b26_p2_evaluator_absent_total > 0
        for: 5m
        labels:
          severity: critical
          component: b26_p2_evaluator
          team: backend
        annotations:
          summary: "B2.6-P2 evaluator heartbeat absent"
          description: "The independent API observer sees no genuine evaluation tick within 4x the governed threshold. Recovery and observation share no credential with the evidence writer."
          action: "Verify the beat scheduler and relay queue consumer; do not trust relay logs alone."

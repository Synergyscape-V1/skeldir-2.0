# SUPPORTED LOCAL DEVELOPMENT ONLY. This reduced topology omits the P13
# Bayesian execution worker, dedicated publisher, and Beat process. It is not
# production-equivalent and must never be cited as P13 evidence.
services:
  postgres:
    image: postgres:15-alpine
    container_name: skeldir-postgres-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skeldir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skeldir_local}
      POSTGRES_DB: ${POSTGRES_DB:-skeldir_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skeldir_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skeldir} -d ${POSTGRES_DB:-skeldir_local}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.local
    working_dir: /app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skeldir-api-local
    env_file:
      - .env.local
    # B2.5-P13 Corrective XVII. The shared env file documents signer custody for
    # the signer deployment unit; the public API must never receive it. Blanking
    # here is the compose-level expression of the same rule the runtime enforces
    # in assert_public_api_signer_isolation().
    environment:
      TRUST_SIGNER_DATABASE_URL: ""
      SKELDIR_TRUST_SIGNING_KEY_SEED_B64URL: ""
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skeldir-worker-local
    env_file:
      - .env.local
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      # The reconciler needs issuer authority, never signer authority.
      TRUST_SIGNER_DATABASE_URL: ""
      SKELDIR_TRUST_SIGNING_KEY_SEED_B64URL: ""
    command: >
      celery -A app.celery_app worker
      --loglevel=INFO
      --pool=solo
      --concurrency=1
      --queues=housekeeping,maintenance,llm,attribution
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp/prometheus_multiproc

  worker_b23:
    # B2.6-P2 Corrective IV: the B2.3 worker authors verdict truth under the
    # dedicated worker credential and must never inherit the API DSN (which
    # would hand the consumer full authority-mint capability while breaking
    # every verdict write). The default below follows this file's convention
    # (every variable defaults for local dev); production-grade fail-closed
    # wiring lives in the Procfile (SKELDIR_B23_REQUIRE_WORKER_DSN) and the
    # required topology proof, not in local compose. The generic worker
    # above no longer consumes b23_match_engine for the same reason.
    # restart: a transient broker fault can kill a Celery process, and
    # supervised restart keeps recovery live without human action.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    container_name: skeldir-worker-b23-local
    env_file:
      - .env.local
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      DATABASE_URL: ${B23_WORKER_DATABASE_URL:-postgresql+asyncpg://app_worker:app_worker@postgres:5432/skeldir_local}
      B23_WORKER_DATABASE_URL: ${B23_WORKER_DATABASE_URL:-postgresql+asyncpg://app_worker:app_worker@postgres:5432/skeldir_local}
      SKELDIR_B23_REQUIRE_WORKER_DSN: "1"
      TRUST_SIGNER_DATABASE_URL: ""
      SKELDIR_TRUST_SIGNING_KEY_SEED_B64URL: ""
    command: >
      celery -A app.celery_app.celery_app worker
      --loglevel=INFO
      --pool=solo
      --concurrency=1
      --queues=b23_match_engine
      --prefetch-multiplier=1
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp/prometheus_multiproc

  relay_b26_p2:
    # B2.6-P2 Corrective V recovery worker: consumes the relay sweep that
    # beat schedules. Runs under the dedicated relay credential
    # (app_relay: SELECT + delivery-column UPDATE + broker DML); it
    # recovers/publishes EXISTING execution authority and cannot mint it.
    # Corrective VIII shipping consumer: the relay's own healthcheck
    # executes the deployed conduction-health probe against the
    # independent API observer. P2 degradation therefore marks this
    # service unhealthy automatically (platform-consumed status), instead
    # of leaving a JSON field no production actor reads.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    container_name: skeldir-relay-b26-p2-local
    env_file:
      - .env.local
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      DATABASE_URL: ${B26_P2_RELAY_DATABASE_URL:-postgresql+asyncpg://app_relay:app_relay@postgres:5432/skeldir_local}
      SKELDIR_CELERY_WORKER_ROLE: b26_p2_relay
      TRUST_SIGNER_DATABASE_URL: ""
      SKELDIR_TRUST_SIGNING_KEY_SEED_B64URL: ""
    command: >
      celery -A app.celery_app.celery_app worker
      --loglevel=INFO
      --pool=solo
      --concurrency=1
      --queues=b26_p2_relay
      --prefetch-multiplier=1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.ops.b26_p2_heartbeat_probe", "--url", "http://api:8000/health/b26-p2-conduction"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    tmpfs:
      - /tmp/prometheus_multiproc

  beat:
    # B2.6-P2 Corrective V recovery motor: schedules the relay sweep (plus
    # the existing governed sweeps) under the dedicated scheduler
    # credential (app_beat: broker DML only, no application-table
    # authority). Without this process pending execution intents never
    # conduct after a broker outage without provider retry.
    # restart: a transient broker fault can kill a Celery process, and the
    # HealingBeatScheduler (which drops poisoned broker state on apply
    # failure) plus supervision together keep the motor live without human
    # action.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    container_name: skeldir-beat-local
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ${B26_P2_BEAT_DATABASE_URL:-postgresql+asyncpg://app_beat:app_beat@postgres:5432/skeldir_local}
      TRUST_SIGNER_DATABASE_URL: ""
      SKELDIR_TRUST_SIGNING_KEY_SEED_B64URL: ""
    command: >
      celery -A app.celery_app.celery_app beat
      --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy

  trust-signer:
    # B2.5-P13 Corrective XVII deployment unit. Started only when an operator
    # supplies SKELDIR_TRUST_SIGNING_KEY_SEED_B64URL, because the process
    # refuses to start without the private key it exists to hold:
    #   docker compose --env-file .env.local -f docker-compose.local.yml     #     --profile trust-signer up -d trust-signer
    profiles: ["trust-signer"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skeldir-trust-signer-local
    env_file:
      - .env.local
    environment:
      # Signer custody is exclusive in the other direction too.
      TRUST_ISSUANCE_DATABASE_URL: ""
      MIGRATION_DATABASE_URL: ""
    command: uvicorn app.trust.signer_service:app --host 0.0.0.0 --port 8001
    ports:
      - "${TRUST_SIGNER_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy

  smoke:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.local
    environment:
      API_BASE_URL: http://api:8000
    command: python /app/scripts/smoke/m1_runtime_smoke.py
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

  validator:
    image: python:3.12-slim
    working_dir: /workspace
    command: >
      sh -c "python scripts/ci/validate_m0_scope_lock.py --local-dev &&
             python scripts/ci/validate_m1_local_dev_authority.py --local-dev"
    volumes:
      - .:/workspace:ro

volumes:
  skeldir_postgres_local:

openapi: 3.1.0
info:
  title: Skeldir WooCommerce Webhooks
  version: 2.0.0
  description: 'WooCommerce webhook schemas for order events.

    Used for revenue verification and attribution tracking.

    '
  contact:
    name: Skeldir Engineering
    email: engineering@skeldir.com
    url: https://skeldir.com
servers:
- url: http://localhost:4016
  description: Prism Mock Server (WooCommerce Webhooks)
tags:
- name: WooCommerce Webhooks
  description: WooCommerce webhook endpoints for order events
security:
- tenantKeyAuth: []
paths:
  /api/webhooks/woocommerce/order_completed:
    post:
      summary: WooCommerce order completed webhook
      description: Triggered when an order is marked as completed
      operationId: woocommerceOrderCompleted
      tags:
      - WooCommerce Webhooks
      parameters:
      - name: X-WC-Webhook-Signature
        in: header
        required: false
        schema:
          type: string
      - name: X-WC-Webhook-Topic
        in: header
        required: false
        schema:
          type: string
          enum:
          - order.completed
      - name: X-WC-Webhook-Resource
        in: header
        required: false
        schema:
          type: string
          enum:
          - order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WooCommerceOrder'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
        '401':
          $ref: ../_common/base.yaml#/components/responses/UnauthorizedError
components:
  securitySchemes:
    tenantKeyAuth:
      $ref: ../_common/base.yaml#/components/securitySchemes/tenantKeyAuth
  responses:
    WebhookAccepted:
      description: Webhook processed successfully
      content:
        application/json:
          schema:
            $ref: ../_common/base.yaml#/components/schemas/SuccessResponse
          example:
            success: true
            correlation_id: 00000000-0000-0000-0000-000000000000
            message: Webhook received
  schemas:
    WooCommerceOrder:
      type: object
      required:
      - id
      - order_key
      - total
      - date_created
      properties:
        id:
          type: integer
          description: WooCommerce order ID
        order_key:
          type: string
          description: Unique order key
        number:
          type: string
          description: Order number
        status:
          type: string
          enum:
          - pending
          - processing
          - on-hold
          - completed
          - cancelled
          - refunded
          - failed
          description: Order status
        total:
          type: string
          description: Order total as string
        subtotal:
          type: string
          description: Order subtotal
        total_tax:
          type: string
          description: Total tax amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency code
          example: USD
        date_created:
          type: string
          format: date-time
        date_modified:
          type: string
          format: date-time
        date_completed:
          type: string
          format: date-time
        date_paid:
          type: string
          format: date-time
        payment_method:
          type: string
          description: Payment method ID
        payment_method_title:
          type: string
          description: Payment method display name
        customer_id:
          type: integer
          description: Customer ID (0 for guests)
        billing:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
              format: email
        line_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              quantity:
                type: integer
              total:
                type: string
        meta_data:
          type: array
          description: Order metadata including attribution data
          items:
            type: object
            properties:
              id:
                type: integer
              key:
                type: string
              value:
                type: string
        refunds:
          type: array
          description: Refund entries for the order
          items:
            type: object
            properties:
              id:
                type: integer
              amount:
                type: string
              reason:
                type: string

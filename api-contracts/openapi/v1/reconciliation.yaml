openapi: 3.1.0
info:
  title: Skeldir Reconciliation API
  version: 2.0.0
  description: |
    Platform reconciliation status endpoints.
    Provides real-time connection status and data sync information for integrated platforms.
  contact:
    name: Skeldir Engineering
    email: engineering@skeldir.com
    url: https://skeldir.com

servers:
  - url: http://localhost:4012
    description: Prism Mock Server (Reconciliation)

tags:
  - name: Reconciliation
    description: Platform reconciliation and data sync status endpoints

security:
  - accessBearerAuth: ["viewer"]

paths:
  /api/reconciliation/status:
    get:
      summary: Get reconciliation status for all platforms
      description: |
        Returns the current connection and sync status for all integrated platforms.
        Includes verification status for payment providers.
      operationId: getReconciliationStatus
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
      responses:
        '200':
          description: Reconciliation status for all platforms
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationStatusResponse'
              example:
                platforms:
                  - platform_name: Shopify
                    connection_status: verified
                    last_sync: '2025-11-26T14:30:00Z'
                    events_processed: 1523
                    revenue_verified: 45230.00
                  - platform_name: Stripe
                    connection_status: verified
                    last_sync: '2025-11-26T14:28:00Z'
                    events_processed: 892
                    revenue_verified: 38120.50
                  - platform_name: Meta
                    connection_status: partial
                    last_sync: '2025-11-26T12:00:00Z'
                    error_message: API rate limit reached
                overall_status: partial
                last_full_sync: '2025-11-26T10:00:00Z'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '500':
          $ref: './_common/base.yaml#/components/responses/ServerError'

  /api/reconciliation/platform/{platform_id}:
    get:
      summary: Get detailed status for a specific platform
      description: Returns detailed reconciliation information for a single platform
      operationId: getPlatformReconciliationStatus
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: platform_id
          in: path
          required: true
          schema:
            type: string
          description: Platform identifier
      responses:
        '200':
          description: Detailed platform reconciliation status
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStatus'
              example:
                platform_name: Shopify
                connection_status: verified
                last_sync: '2025-11-26T13:00:00Z'
                events_processed: 9821
                revenue_verified: 452120.75
                next_scheduled_sync: '2025-11-26T14:00:00Z'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: './_common/base.yaml#/components/responses/NotFoundError'

  /api/reconciliation/sync:
    post:
      summary: Trigger manual sync for platforms
      description: Initiates a manual synchronization for specified platforms
      operationId: triggerSync
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platforms:
                  type: array
                  items:
                    type: string
                  description: List of platform IDs to sync (empty = all platforms)
                full_sync:
                  type: boolean
                  default: false
                  description: Whether to perform a full historical sync
      responses:
        '202':
          description: Sync initiated
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                required:
                  - sync_id
                  - status
                  - estimated_completion
                properties:
                  sync_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, in_progress]
                  estimated_completion:
                    type: string
                    format: date-time
              example:
                sync_id: 99999999-aaaa-bbbb-cccc-111111111111
                status: queued
                estimated_completion: '2025-11-26T15:00:00Z'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'

  /api/reconciliation/match-verdicts/{verdict_id}:
    get:
      summary: Get B2.3 match verdict detail
      description: Returns one row-level B2.3 match verdict with gross/net/discrepancy truth.
      operationId: getB23MatchVerdict
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: verdict_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: B2.3 match verdict detail
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B23MatchVerdictDetailResponse'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tenant_id: 22222222-2222-4222-8222-222222222222
                attribution_event_id: 33333333-3333-4333-8333-333333333333
                webhook_ingress_identity_id: 44444444-4444-4444-8444-444444444444
                provider: stripe
                canonical_commerce_reference: checkout:sk_order_1001
                provider_native_event_reference: evt_1P3example
                provider_native_commerce_reference: pi_3P3example
                status: matched_provisional
                match_quality: high
                canonical_gross_expected_amount_minor: 12500
                canonical_gross_captured_amount_minor: 12500
                canonical_net_verified_amount_minor: 7500
                discrepancy:
                  discrepancy_amount_minor: 0
                  discrepancy_ratio_bps: 0
                  discrepancy_band: exact
                  discrepancy_basis: gross_expected_vs_gross_captured
                adjustments_applied: true
                pending_since: '2026-05-05T17:00:00Z'
                provisional_expires_at: '2026-05-05T18:00:00Z'
                confirmed_at: '2026-05-05T17:35:00Z'
                adjusted_at: '2026-05-05T17:30:00Z'
                unmatched_marked_at: '2026-05-05T17:45:00Z'
                last_transition_at: '2026-05-05T17:30:00Z'
                created_at: '2026-05-05T17:00:00Z'
                updated_at: '2026-05-05T17:30:00Z'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: './_common/base.yaml#/components/responses/NotFoundError'

  /api/reconciliation/match-verdicts/{verdict_id}/corrections:
    post:
      summary: Register a governed B2.3 post-capture correction
      description: >-
        Conducts a provider-authenticated post-capture correction through the
        shipping B2.3 kernel. The amount, currency and commerce reference are
        taken from the named authenticated ingress identity, never from the
        request body, so the caller cannot invent financial authority.
      operationId: createB23PostCaptureCorrection
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["manager"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: verdict_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B23PostCaptureCorrectionRequest'
      responses:
        '200':
          description: Correction applied or governedly unresolved
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B23PostCaptureCorrectionResponse'
              example:
                status: accepted
                match_verdict_id: 11111111-1111-4111-8111-111111111111
                revenue_event_written: false
                net_verified_amount_minor: 1200
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: './_common/base.yaml#/components/responses/NotFoundError'
        '409':
          description: Correction source authority is unavailable or unresolved
          content:
            application/problem+json:
              schema:
                $ref: './_common/base.yaml#/components/schemas/ProblemDetails'
        '422':
          $ref: './_common/base.yaml#/components/responses/ValidationError'

  /api/reconciliation/candidates/classify:
    post:
      summary: Classify one P2 scope candidate
      description: >-
        Returns exactly one canonical P2 disposition. Malformed input is a
        governed INVALID_OR_REFUSED receipt, never an authenticated financial
        row. The endpoint is read-only and performs no financial write.
      operationId: classifyB23P2Candidate
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B23P2CandidateClassificationRequest'
      responses:
        '200':
          description: Canonical P2 classification receipt
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B23P2CandidateClassificationResponse'
              example:
                disposition: SUPPORTED_AND_IN_SCOPE
                reason: supported_and_in_scope
                provider: stripe
                rail: stripe
                currency_code: USD
                window_start: '2026-05-01T00:00:00Z'
                window_end: '2026-05-02T00:00:00Z'
                scope_policy_version: b2.6-p2-scope-policy-v2
                source_verified_gross_amount_minor: 1200
                authority_scope: structural_candidate_only
                live_financial_authority: false
                live_authority_checked: false
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'

  /api/reconciliation/exceptions:
    get:
      summary: List B2.3 exception records
      description: Returns row-level first-class B2.3 exception records for the authenticated tenant.
      operationId: listB23ExceptionRecords
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
      responses:
        '200':
          description: B2.3 exception records
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B23ExceptionListResponse'
              example:
                exceptions:
                  - id: 55555555-5555-4555-8555-555555555555
                    tenant_id: 22222222-2222-4222-8222-222222222222
                    match_verdict_id: 11111111-1111-4111-8111-111111111111
                    provider: stripe
                    canonical_commerce_reference: checkout:sk_order_1001
                    severity: flagged
                    workflow_state: open
                    resolution_code: review_pending
                    discrepancy_reason: gross_capture_correction_entered_flagged_band
                    discrepancy_context:
                      discrepancy_amount_minor: 300
                      discrepancy_ratio_bps: 240
                      discrepancy_band: over_tolerance
                      discrepancy_basis: gross_expected_vs_gross_captured
                    raised_at: '2026-05-05T18:10:00Z'
                    resolved_at: '2026-05-05T18:20:00Z'
                    dismissed_at: '2026-05-05T18:25:00Z'
                    created_at: '2026-05-05T18:10:00Z'
                    updated_at: '2026-05-05T18:10:00Z'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'

  /api/reconciliation/exceptions/{exception_id}:
    get:
      summary: Get B2.3 exception record
      description: Returns one row-level first-class B2.3 exception record.
      operationId: getB23ExceptionRecord
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: exception_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: B2.3 exception record
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B23ExceptionRecordResponse'
              example:
                id: 55555555-5555-4555-8555-555555555555
                tenant_id: 22222222-2222-4222-8222-222222222222
                match_verdict_id: 11111111-1111-4111-8111-111111111111
                provider: stripe
                canonical_commerce_reference: checkout:sk_order_1001
                severity: alert
                workflow_state: open
                resolution_code: review_pending
                discrepancy_reason: gross_capture_correction_entered_alert_band
                discrepancy_context:
                  discrepancy_amount_minor: 1500
                  discrepancy_ratio_bps: 1200
                  discrepancy_band: severe_gap
                  discrepancy_basis: gross_expected_vs_gross_captured
                raised_at: '2026-05-05T18:15:00Z'
                resolved_at: '2026-05-05T18:25:00Z'
                dismissed_at: '2026-05-05T18:30:00Z'
                created_at: '2026-05-05T18:15:00Z'
                updated_at: '2026-05-05T18:15:00Z'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '404':
          $ref: './_common/base.yaml#/components/responses/NotFoundError'

  /api/reconciliation/coverage:
    get:
      summary: Get canonical verification coverage for a window
      description: |
        Resolves the canonical 95.00% verification-coverage authority through
        the sovereign scope-only resolver and returns the integer legs, the
        independently re-derived percentage, and the non-authoritative
        historical leg. The response is tenant-scoped and carries an ETag
        over the exact body.
      operationId: getVerificationCoverage
      tags:
        - Reconciliation
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: window_start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: window_end
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: currency_code
          in: query
          required: false
          schema:
            type: string
            default: USD
            minLength: 3
            maxLength: 3
      responses:
        '200':
          description: Canonical verification coverage
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant_id
                  - currency_code
                  - window_start
                  - window_end
                  - numerator_matched_webhook_revenue_minor
                  - denominator_connected_platform_revenue_minor
                  - coverage_percent
                  - zero_denominator
                  - unverifiable_historical_revenue_minor
                  - supported_platforms
                  - producer
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  currency_code:
                    type: string
                  window_start:
                    type: string
                    format: date-time
                  window_end:
                    type: string
                    format: date-time
                  numerator_matched_webhook_revenue_minor:
                    type: integer
                  denominator_connected_platform_revenue_minor:
                    type: integer
                  coverage_percent:
                    type: string
                    pattern: '^[0-9]+\.[0-9]{2}$'
                  zero_denominator:
                    type: boolean
                  unverifiable_historical_revenue_minor:
                    type: integer
                  supported_platforms:
                    type: array
                    items:
                      type: string
                  producer:
                    type: string
                  generated_at:
                    type: string
                    format: date-time
              example:
                tenant_id: 00000000-0000-0000-0000-000000000000
                currency_code: USD
                window_start: '2026-10-01T00:00:00Z'
                window_end: '2026-11-01T00:00:00Z'
                numerator_matched_webhook_revenue_minor: 76000
                denominator_connected_platform_revenue_minor: 80000
                coverage_percent: '95.00'
                zero_denominator: false
                unverifiable_historical_revenue_minor: 0
                supported_platforms: [paypal, shopify, stripe, woocommerce]
                producer: app.revenue_verification.verification_coverage.fetch_verification_coverage_aggregate+app.revenue_verification.verification_coverage.VERIFICATION_COVERAGE.compute
                generated_at: '2026-10-27T22:00:00Z'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '422':
          $ref: './_common/base.yaml#/components/responses/ValidationError'
        '500':
          $ref: './_common/base.yaml#/components/responses/ServerError'

components:
  schemas:
    ReconciliationStatusResponse:
      type: object
      required:
        - platforms
        - overall_status
      properties:
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformStatus'
        overall_status:
          type: string
          enum: [verified, partial, pending, failed]
          description: Aggregate status across all platforms
        last_full_sync:
          type: string
          format: date-time
          description: Timestamp of last complete sync across all platforms

    PlatformStatus:
      type: object
      required:
        - platform_name
        - connection_status
        - last_sync
      properties:
        platform_name:
          type: string
          enum: [Meta, Google, TikTok, LinkedIn, Shopify, WooCommerce, Stripe, PayPal]
          description: Platform identifier
        connection_status:
          type: string
          enum: [verified, partial, pending, failed, disconnected]
          description: Current connection status
        last_sync:
          type: string
          format: date-time
          description: Timestamp of last successful sync
        events_processed:
          type: integer
          minimum: 0
          description: Total events processed from this platform
        revenue_verified:
          type: number
          format: float
          description: Total verified revenue from this platform
        error_message:
          type: string
          description: Error description if connection is not fully verified
        next_scheduled_sync:
          type: string
          format: date-time
          description: When the next automatic sync is scheduled

    B23VerdictStatus:
      type: string
      enum:
        - pending
        - matched_provisional
        - matched_confirmed
        - adjusted
        - unmatched

    B23MatchQuality:
      type: string
      enum:
        - high
        - medium
        - low

    B23DiscrepancyBand:
      type: string
      enum:
        - exact
        - within_tolerance
        - over_tolerance
        - severe_gap

    B23ExceptionSeverity:
      type: string
      enum:
        - flagged
        - alert

    B23ExceptionWorkflowState:
      type: string
      enum:
        - open
        - acknowledged
        - resolved
        - dismissed

    B23DiscrepancyContext:
      type: object
      additionalProperties: false
      required:
        - discrepancy_amount_minor
        - discrepancy_ratio_bps
        - discrepancy_band
        - discrepancy_basis
      properties:
        discrepancy_amount_minor:
          type: integer
          minimum: 0
        discrepancy_ratio_bps:
          type: integer
          minimum: 0
        discrepancy_band:
          $ref: '#/components/schemas/B23DiscrepancyBand'
        discrepancy_basis:
          type: string
          enum:
            - gross_expected_vs_gross_captured

    B23MatchVerdictDetailResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - attribution_event_id
        - webhook_ingress_identity_id
        - provider
        - canonical_commerce_reference
        - provider_native_event_reference
        - provider_native_commerce_reference
        - status
        - match_quality
        - canonical_gross_expected_amount_minor
        - canonical_gross_captured_amount_minor
        - canonical_net_verified_amount_minor
        - discrepancy
        - adjustments_applied
        - pending_since
        - provisional_expires_at
        - confirmed_at
        - adjusted_at
        - unmatched_marked_at
        - last_transition_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        attribution_event_id:
          type:
            - string
            - 'null'
          format: uuid
        webhook_ingress_identity_id:
          type:
            - string
            - 'null'
          format: uuid
        provider:
          type: string
        canonical_commerce_reference:
          type: string
        provider_native_event_reference:
          type: string
        provider_native_commerce_reference:
          type: string
        status:
          $ref: '#/components/schemas/B23VerdictStatus'
        match_quality:
          $ref: '#/components/schemas/B23MatchQuality'
        canonical_gross_expected_amount_minor:
          type: integer
          minimum: 0
        canonical_gross_captured_amount_minor:
          type: integer
          minimum: 0
        canonical_net_verified_amount_minor:
          type: integer
          minimum: 0
        discrepancy:
          $ref: '#/components/schemas/B23DiscrepancyContext'
        adjustments_applied:
          type: boolean
        pending_since:
          type: string
          format: date-time
        provisional_expires_at:
          type:
            - string
            - 'null'
          format: date-time
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        adjusted_at:
          type:
            - string
            - 'null'
          format: date-time
        unmatched_marked_at:
          type:
            - string
            - 'null'
          format: date-time
        last_transition_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        source_authority_state:
          type: string
          description: 'Current P2 authority of the verdict source ingress
            at read time: current, historically_unverifiable, unresolved,
            or unknown.'
        event_family_law_version:
          type:
            - string
            - 'null'
          description: 'XXI P1: the event-family law version that established
            this verdict meaning (latest law publication at or before the
            backing ingress mint). unknown when no law is recorded at the
            mint; null when the law does not govern the provider.'
        event_family_law_current:
          type:
            - boolean
            - 'null'
          description: 'XXI P1: false when a later event-family law publication
            supersedes the establishing law (the verdict must not read as
            current-law verified meaning); null when the law does not govern
            the provider.'
        source_money_attestation_status:
          type:
            - string
            - 'null'
          description: 'XXV: whether this verdict money is justified by a
            sovereign source attestation signed by the authentication root
            and verified against the fingerprint compiled into the running
            image. xxv_attested means the provider amount is independently
            justified; unverifiable:<reason> means an attestation was
            expected and does not justify the money being reported, in which
            case source_authority_state is source_attestation_unverifiable
            and the figure must not be consumed as current money. The absence
            of an attestation is never a grant: a source authenticated before
            XXV enforcement cannot be retro-attested and is reported as
            unverifiable, not as current money.'
        source_money_attestation_reason:
          type:
            - string
            - 'null'
          description: 'XXV: the governed reason token behind
            source_money_attestation_status.'
        history_integrity_status:
          type:
            - string
            - 'null'
          description: 'XXV reader-boundary unity: verified when the live
            ledger and signed witness agree; unverifiable when the signed
            Trust path would refuse the same money for missing, stale,
            violated, or divergent history.'
        history_integrity_reason:
          type:
            - string
            - 'null'
          description: 'The governed history-integrity refusal reason, if
            unverifiable.'


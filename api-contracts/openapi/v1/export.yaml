openapi: 3.1.0
info:
  title: Skeldir Export API
  version: 5.0.0
  description: |
    B2.5-P11 human-authorized compatibility projections for CSV, JSON, and
    Excel. These responses are explicitly non-authoritative display data;
    raw tenant_id values are forbidden.
  contact:
    name: Skeldir Engineering
    email: engineering@skeldir.com
    url: https://skeldir.com

servers:
  - url: http://localhost:4013
    description: Prism Mock Server (Export)

tags:
  - name: Export
    description: Data export functionality for CSV, JSON, and Excel formats

security:
  - accessBearerAuth: ["viewer"]

paths:
  /api/export/revenue:
    get:
      summary: Export revenue data
      description: Export revenue and attribution data in specified format
      operationId: exportRevenue
      tags:
        - Export
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json, xlsx]
            default: csv
          description: Export file format
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date for export range
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date for export range
        - name: channels
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filter by specific channels
        - $ref: '#/components/parameters/CsvSchemaVersion'
        - name: X-Attribution-Session-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Optional session-local export scope
      responses:
        '200':
          description: Export file
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename
          content:
            'text/csv; profile="https://api.skeldir.com/profiles/export-csv-compat-v1"':
              schema:
                type: string
                description: >-
                  Default profile. Legacy five columns at indices 0-4 preserved
                  byte-for-byte; authority classification appended at 5-6.
              example: |
                date,channel,revenue,conversions,confidence,projection_authority,projection_schema_version
                2025-11-25,Meta,15230.50,127,0.92,non_authoritative_display,b25-p11-export-csv-compat-v1
            'text/csv; profile="https://api.skeldir.com/profiles/export-csv-v2"':
              schema:
                type: string
                description: Header-first rectangular b25-p11-export-csv-v2 rows; every record carries non_authoritative_display.
              example: |
                projection_authority,projection_schema_version,date,channel,revenue,conversions,confidence
                non_authoritative_display,b25-p11-export-csv-v2,2025-11-25,Meta,15230.50,127,0.92
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
              example:
                projection_authority: non_authoritative_display
                projection_schema_version: b25-p11-display-v1
                tenant_id_hash: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                generated_at: '2025-11-26T14:30:00Z'
                date_range:
                  start: '2025-11-01'
                  end: '2025-11-26'
                rows:
                  - date: '2025-11-25'
                    channel: Meta
                    revenue_minor: 1523050
                    revenue_display: '15230.50'
                    conversions: 127
                    confidence_display: '0.92'
                  - date: '2025-11-25'
                    channel: Google
                    revenue_minor: 1245000
                    revenue_display: '12450.00'
                    conversions: 98
                    confidence_display: '0.89'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '400':
          $ref: './_common/base.yaml#/components/responses/ValidationError'
        '410':
          $ref: '#/components/responses/ExportProfileRetired'
        '413':
          $ref: '#/components/responses/ExportLimitExceeded'
        '503':
          $ref: '#/components/responses/ExportDeadlineExceeded'

  /api/export/csv:
    get:
      summary: Export data as CSV
      description: >-
        Export attribution data as CSV. The default profile
        `b25-p11-export-csv-compat-v1` keeps the original five legacy columns at
        positional indices 0-4 and appends `projection_authority` and
        `projection_schema_version` at indices 5-6, so positional readers are
        unaffected and the detached file still states its authority class.
        Request `csv_schema_version=b25-p11-export-csv-v2` for the
        authority-first profile. Every emitted CSV profile is
        non-authoritative display data.
      operationId: exportCSV
      tags:
        - Export
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: X-Attribution-Session-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Optional session-local export scope
        - $ref: '#/components/parameters/CsvSchemaVersion'
      responses:
        '200':
          description: CSV file
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="skeldir-export-2025-11-26.csv"
          content:
            'text/csv; profile="https://api.skeldir.com/profiles/export-csv-compat-v1"':
              schema:
                type: string
                description: >-
                  Default profile. Legacy five columns at indices 0-4 preserved
                  byte-for-byte; authority classification appended at 5-6.
              example: |
                date,channel,revenue,conversions,confidence,projection_authority,projection_schema_version
                2025-11-25,Meta,15230.50,127,0.92,non_authoritative_display,b25-p11-export-csv-compat-v1
                2025-11-25,Google,12450.00,98,0.89,non_authoritative_display,b25-p11-export-csv-compat-v1
            'text/csv; profile="https://api.skeldir.com/profiles/export-csv-v2"':
              schema:
                type: string
              example: |
                projection_authority,projection_schema_version,date,channel,revenue,conversions,confidence
                non_authoritative_display,b25-p11-export-csv-v2,2025-11-25,Meta,15230.50,127,0.92
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '410':
          $ref: '#/components/responses/ExportProfileRetired'
        '413':
          $ref: '#/components/responses/ExportLimitExceeded'
        '503':
          $ref: '#/components/responses/ExportDeadlineExceeded'

  /api/export/json:
    get:
      summary: Export data as JSON
      description: Export attribution data in JSON format
      operationId: exportJSON
      tags:
        - Export
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
        - name: X-Attribution-Session-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Optional session-local export scope
      responses:
        '200':
          description: JSON data
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
              example:
                projection_authority: non_authoritative_display
                projection_schema_version: b25-p11-display-v1
                tenant_id_hash: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                generated_at: '2025-11-26T14:30:00Z'
                date_range:
                  start: '2025-11-01'
                  end: '2025-11-26'
                rows:
                  - date: '2025-11-25'
                    channel: Meta
                    revenue_minor: 1523050
                    revenue_display: '15230.50'
                    conversions: 127
                    confidence_display: '0.92'
                  - date: '2025-11-25'
                    channel: Google
                    revenue_minor: 1245000
                    revenue_display: '12450.00'
                    conversions: 98
                    confidence_display: '0.89'
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '413':
          $ref: '#/components/responses/ExportLimitExceeded'
        '503':
          $ref: '#/components/responses/ExportDeadlineExceeded'

  /api/export/excel:
    get:
      summary: Export data as Excel
      description: Export attribution data in Excel (XLSX) format
      operationId: exportExcel
      tags:
        - Export
      security:
        - accessBearerAuth: ["viewer"]
      parameters:
        - $ref: './_common/base.yaml#/components/parameters/CorrelationId'
        - $ref: './_common/base.yaml#/components/parameters/Authorization'
      responses:
        '200':
          description: Excel file
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="skeldir-export-2025-11-26.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: './_common/base.yaml#/components/responses/UnauthorizedError'
        '403':
          $ref: './_common/base.yaml#/components/responses/ForbiddenError'
        '413':
          $ref: '#/components/responses/ExportLimitExceeded'
        '503':
          $ref: '#/components/responses/ExportDeadlineExceeded'

components:
  parameters:
    CsvSchemaVersion:
      name: csv_schema_version
      in: query
      required: false
      description: >-
        Select the CSV profile. Ignored for non-CSV formats.
        `b25-p11-export-csv-compat-v1` (default) keeps the original five legacy
        columns at their exact positional indices 0-4 and appends
        `projection_authority` and `projection_schema_version` at indices 5-6,
        so positional readers are unaffected while the detached file still
        states its authority class. `b25-p11-export-csv-v2` is the
        authority-first profile. `legacy-v1` is RETIRED: it emitted a bare
        five-column artifact that could carry neither `envelope_ref` nor a
        non-authoritative display label, so a detached file could not state its
        own authority class (P11-G4). Requesting it returns 410.
      schema:
        type: string
        enum: [b25-p11-export-csv-compat-v1, b25-p11-export-csv-v2, legacy-v1]
        default: b25-p11-export-csv-compat-v1
  responses:
    ExportLimitExceeded:
      x-skeldir-shared-error-component: skeldir.export.ExportLimitExceeded
      description: Bounded export resource admission or egress budget exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExportLimitError'
          examples:
            date_span:
              value:
                detail: {status: refused, reason_code: legacy_export_date_span_exceeded}
            row_budget:
              value:
                detail: {status: refused, reason_code: legacy_export_row_budget_exceeded}
    ExportProfileRetired:
      x-skeldir-shared-error-component: skeldir.export.ExportProfileRetired
      description: Requested CSV profile is retired and can no longer be emitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExportProfileRetiredError'
          examples:
            legacy_v1:
              value:
                detail:
                  status: refused
                  reason_code: legacy_csv_profile_retired
                  retired_profile: legacy-v1
                  replacement_profile: b25-p11-export-csv-compat-v1
    ExportDeadlineExceeded:
      x-skeldir-shared-error-component: skeldir.export.ExportDeadlineExceeded
      description: Bounded export database or handler deadline exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExportDeadlineError'
          examples:
            database_deadline:
              value:
                detail: {status: refused, reason_code: legacy_export_database_deadline_exceeded}
            handler_deadline:
              value:
                detail: {status: refused, reason_code: legacy_export_handler_deadline_exceeded}
  schemas:
    ExportLimitError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: object
          additionalProperties: false
          required: [status, reason_code]
          properties:
            status: {type: string, const: refused}
            reason_code:
              type: string
              enum:
                - legacy_export_date_span_exceeded
                - legacy_export_channel_count_exceeded
                - legacy_export_channel_length_exceeded
                - legacy_export_row_admission_exceeded
                - legacy_export_byte_admission_exceeded
                - legacy_export_row_budget_exceeded
                - legacy_export_byte_budget_exceeded
    ExportProfileRetiredError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: object
          additionalProperties: false
          required: [status, reason_code, retired_profile, replacement_profile]
          properties:
            status: {type: string, const: refused}
            reason_code: {type: string, const: legacy_csv_profile_retired}
            retired_profile: {type: string, enum: [legacy-v1]}
            replacement_profile: {type: string, enum: [b25-p11-export-csv-compat-v1]}
    ExportDeadlineError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: object
          additionalProperties: false
          required: [status, reason_code]
          properties:
            status: {type: string, const: refused}
            reason_code:
              type: string
              enum: [legacy_export_database_deadline_exceeded, legacy_export_handler_deadline_exceeded]
    ExportData:
      type: object
      required:
        - projection_authority
        - projection_schema_version
        - tenant_id_hash
        - generated_at
        - date_range
        - rows
      additionalProperties: false
      properties:
        projection_authority:
          type: string
          const: non_authoritative_display
        projection_schema_version:
          type: string
          const: b25-p11-display-v1
        tenant_id_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Hashed tenant scope; a raw tenant_id is forbidden.
        generated_at:
          type: string
          format: date-time
          description: When the export was generated
        date_range:
          type: object
          required:
            - start
            - end
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ExportRow'
    ExportRow:
      type: object
      required:
        - date
        - channel
        - revenue_minor
        - revenue_display
        - conversions
        - confidence_display
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        channel:
          type: string
        revenue_minor:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        revenue_display:
          type: string
        conversions:
          type: integer
        confidence_display:
          type: string

  securitySchemes:
    accessBearerAuth:
      $ref: './_common/base.yaml#/components/securitySchemes/accessBearerAuth'
